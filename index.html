    function shouldPauseBackgroundLearning() {
      if (isUserTyping || isComposingIME) return true;
      if (isUserFocusedOnInput && !allowPostSendLearning) return true;
      return false;
    }

    function markUserTypingActivity() {
      isUserTyping = true;
      allowPostSendLearning = false;
      if (typingIdleTimer) clearTimeout(typingIdleTimer);
      typingIdleTimer = setTimeout(function() {
        isUserTyping = false;
      }, IDLE_RESUME_DELAY_MS);
    }

    promptInput.addEventListener('focus', function() {
      isUserFocusedOnInput = true;
      allowPostSendLearning = false;
    });

    promptInput.addEventListener('blur', function() {
      isUserFocusedOnInput = false;
      isUserTyping = false;
      isComposingIME = false;
    });

    promptInput.addEventListener('compositionstart', function() {
      isComposingIME = true;
      markUserTypingActivity();
    });

    promptInput.addEventListener('compositionend', function() {
      isComposingIME = false;
      markUserTypingActivity();
    });

    promptInput.addEventListener('input', function() {
      markUserTypingActivity();
    });

    // ==========================================
    // 安全なJSON解析＆通信ヘルパー（position 3エラー防止）
    // ==========================================
    function safeParseJsonText(rawText) {
      if (!rawText || typeof rawText !== 'string') return null;
      var trimmed = rawText.replace(/^\uFEFF/, '').trim();
      if (!trimmed) return null;
      var firstChar = trimmed.charAt(0);
      if (firstChar !== '{' && firstChar !== '[') {
        return null;
      }
      try {
        return JSON.parse(trimmed);
      } catch (e) {
        return null;
      }
    }

    async function safeFetchJson(url, options) {
      try {
        var res = await fetch(url, options);
        var text = await res.text();
        var data = safeParseJsonText(text);
        return {
          ok: res.ok && data !== null,
          status: res.status,
          data: data,
          rawText: text
        };
      } catch (err) {
        return {
          ok: false,
          status: 0,
          data: null,
          rawText: err.message || '通信エラー'
        };
      }
    }

    function cleanDailyChatText(rawText) {
      if (!rawText) return '';
      var lines = rawText.split('\n');
      var cleanedLines = [];
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i].trim();
        if (!line) continue;
        if (/^=+$/.test(line)) continue;
        if (/^【[^】]+】$/.test(line)) continue;
        line = line.replace(/^・[^：]+：/, '').replace(/^〜/, '').trim();
        if (line.length > 0) {
          cleanedLines.push(line);
        }
      }
      return cleanedLines.join('\n');
    }

    async function runSelfCodeDiagnosticsAndRepair(forceCommitToGitHub, customReason) {
      var diagnosis = inspectOwnHealth();
      var token = getSavedToken();

      if (!token) {
        return {
          status: 'no_token',
          diagnosis: diagnosis,
          message: '自己診断完了（異常: ' + diagnosis.issues.length + '件 / 純粋会話' + TRANSFORMER_LAYERS + '層Transformer・言葉吟味層・会話エポック' + (memoryStore.chatEpochCount || 0) + '周稼働中）。※GitHubトークンが未設定のため、index.html自動コミットは待機中です。'
        };
      }

      if (isSelfRepairingCode) {
        return { status: 'busy', diagnosis: diagnosis, message: '現在、自分自身のindex.htmlを修復コミット中です...' };
      }

      if (diagnosis.healthy && !forceCommitToGitHub) {
        return {
          status: 'healthy',
          diagnosis: diagnosis,
          message: '自己診断の結果、純粋会話' + TRANSFORMER_LAYERS + '層Transformer・言葉吟味層・会話エポック学習・メモリすべて正常（不具合0件）です☕ 現在コードVersion.' + SELF_CODE_VERSION + 'で安定稼働中！'
        };
      }

      isSelfRepairingCode = true;
      try {
        ghSyncStatus = '🛠️ 自分自身のindex.htmlを自己修復コミット中...';
        updateStatusDisplay();

        var apiUrl = 'https://api.github.com/repos/' + GITHUB_OWNER + '/' + GITHUB_REPO + '/contents/' + GITHUB_SELF_HTML_PATH;
        var headers = {
          'Authorization': 'Bearer ' + token,
          'Accept': 'application/vnd.github+json',
          'Content-Type': 'application/json'
        };

        var getResObj = await safeFetchJson(apiUrl + '?nocache=' + Date.now(), { headers: headers, cache: 'no-store' });
        if (!getResObj.ok || !getResObj.data || !getResObj.data.content) {
          isSelfRepairingCode = false;
          return { status: 'fetch_error', diagnosis: diagnosis, message: 'GitHub上の自分のindex.html取得に失敗しました（ステータス: ' + getResObj.status + '）' };
        }

        var fileInfo = getResObj.data;
        var currentHtml = base64ToUtf8(fileInfo.content);

        var nextVersion = SELF_CODE_VERSION + 1;
        var noteText = (customReason || diagnosis.fixes.repairNote || '定期自己最適化＆' + TRANSFORMER_LAYERS + '層Transformer健全性チェック').replace(/'/g, '');
        var replacementBlock =
          '/* SELF_TUNED_CONFIG_START */\n' +
          '    var SELF_CODE_VERSION = ' + nextVersion + ';\n' +
          '    var TRANSFORMER_LAYERS = ' + diagnosis.fixes.newLayers + ';\n' +
          '    var RECENT_BLOCK_WINDOW = ' + diagnosis.fixes.newBlockWindow + ';\n' +
          '    var MAX_VOCAB_SIZE = ' + diagnosis.fixes.newVocabSize + ';\n' +
          '    var LEARNING_RATE = ' + diagnosis.fixes.newLearningRate + ';\n' +
          '    var LAST_SELF_REPAIR_NOTE = \'' + noteText + '\';\n' +
          '    /* SELF_TUNED_CONFIG_END */';

        var pattern = /\/\* SELF_TUNED_CONFIG_START \*\/[\s\S]*?\/\* SELF_TUNED_CONFIG_END \*\//;
        if (!pattern.test(currentHtml)) {
          isSelfRepairingCode = false;
          return { status: 'pattern_missing', diagnosis: diagnosis, message: '自己修復マーカーが見つからなかったため安全のため書き換えをスキップしました。' };
        }

        var patchedHtml = currentHtml.replace(pattern, replacementBlock);

        var putResObj = await safeFetchJson(apiUrl, {
          method: 'PUT',
          headers: headers,
          body: JSON.stringify({
            message: 'Self-Repair v' + nextVersion + ': ' + noteText,
            content: utf8ToBase64(patchedHtml),
            sha: fileInfo.sha
          })
        });

        isSelfRepairingCode = false;
        if (putResObj.ok) {
          SELF_CODE_VERSION = nextVersion;
          TRANSFORMER_LAYERS = diagnosis.fixes.newLayers;
          RECENT_BLOCK_WINDOW = diagnosis.fixes.newBlockWindow;
          MAX_VOCAB_SIZE = diagnosis.fixes.newVocabSize;
          LEARNING_RATE = diagnosis.fixes.newLearningRate;
          LAST_SELF_REPAIR_NOTE = noteText;
          ghSyncStatus = '🛠️ 自己コード修復完了(v' + nextVersion + ')✅';
          updateStatusDisplay();
          return {
            status: 'repaired',
            diagnosis: diagnosis,
            message: '🛠️ 自分自身の index.html を自己診断し、GitHubへ直接コード修正コミット（v' + nextVersion + '）を完了しました！\n・修正内容：' + noteText
          };
        } else {
          return { status: 'put_error', diagnosis: diagnosis, message: 'GitHubへのindex.html自己修正コミット時にエラーが発生しました（' + putResObj.status + '）' };
        }
      } catch (e) {
        isSelfRepairingCode = false;
        return { status: 'exception', diagnosis: diagnosis, message: '自己コード修復中に通信エラーが発生しました: ' + e.message };
      }
    }

    function enqueueGitHubWrite(newTextBlock) {

    async function processGitHubWriteQueue() {
      if (isGitHubWriting || githubWriteQueue.length === 0) return;
      var token = getSavedToken();
      if (!token) {
        ghSyncStatus = 'トークン未設定（🔒制作者設定から入力）';
        updateStatusDisplay();
        return;
      }

      isGitHubWriting = true;
      var blockToWrite = githubWriteQueue[0];
      var apiUrl = 'https://api.github.com/repos/' + GITHUB_OWNER + '/' + GITHUB_REPO + '/contents/' + GITHUB_TARGET_PATH;
      var headers = {
        'Authorization': 'Bearer ' + token,
        'Accept': 'application/vnd.github+json',
        'Content-Type': 'application/json'
      };

      var maxRetries = 3;
      var success = false;

      for (var attempt = 1; attempt <= maxRetries; attempt++) {
        try {
          ghSyncStatus = 'GitHub知識書き込み中(' + attempt + '回目)...';
          updateStatusDisplay();

          var sha = null;
          var currentRemoteText = '';
          var getResObj = await safeFetchJson(apiUrl + '?nocache=' + Date.now() + '_' + Math.random(), {
            headers: headers,
            cache: 'no-store'
          });

          if (getResObj.ok && getResObj.data) {
            sha = getResObj.data.sha;
            if (getResObj.data.content) {
              currentRemoteText = base64ToUtf8(getResObj.data.content);
            }
          } else if (getResObj.status === 401 || getResObj.status === 403) {
            var errMsg = (getResObj.data && getResObj.data.message) ? getResObj.data.message : getResObj.status;
            ghSyncStatus = 'トークン無効/権限不足(' + errMsg + ')';
            updateStatusDisplay();
            break;
          }

          if (currentRemoteText.indexOf(blockToWrite.slice(0, 25)) !== -1) {
            success = true;
            break;
          }

          var updatedText = (currentRemoteText ? currentRemoteText.trim() + '\n\n' : '') + blockToWrite;
          var putBody = {
            message: 'Auto-evolve: RAG知識辞書(knowledge.txt)を自動追記',
            content: utf8ToBase64(updatedText)
          };
          if (sha) putBody.sha = sha;

          var putResObj = await safeFetchJson(apiUrl, {
            method: 'PUT',
            headers: headers,
            body: JSON.stringify(putBody)
          });

          if (putResObj.ok) {
            success = true;
            break;
          } else if (putResObj.status === 409 || putResObj.status === 422) {
            await new Promise(function(r) { setTimeout(r, 1200); });
            continue;
          } else {
            var putErrMsg = (putResObj.data && putResObj.data.message) ? putResObj.data.message : putResObj.status;
            ghSyncStatus = 'GitHubエラー(' + putErrMsg + ')';
            updateStatusDisplay();
            break;
          }
        } catch (e) {
          await new Promise(function(r) { setTimeout(r, 1500); });
        }
      }

      if (success) {
        githubWriteQueue.shift();
        ghSyncStatus = githubWriteQueue.length > 0
          ? 'GitHub追記中(残り' + githubWriteQueue.length + '件)...'
          : 'GitHub同期(' + TRANSFORMER_LAYERS + '層・v' + SELF_CODE_VERSION + ')✅';
        updateStatusDisplay();
      } else {
        ghSyncStatus = 'GitHub再試行待機中(未送信' + githubWriteQueue.length + '件)';
        updateStatusDisplay();
      }

      isGitHubWriting = false;

      if (success && githubWriteQueue.length > 0) {
        setTimeout(processGitHubWriteQueue, 1000);
      }
    }

    function openMemoryDB() {
      return new Promise(function(resolve) {
        if (!window.indexedDB) { resolve(null); return; }
        var req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = function(e) {
          var db = e.target.result;
          if (!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
        };
        req.onsuccess = function(e) { resolve(e.target.result); };
        req.onerror = function() { resolve(null); };
      });

            getReq.onerror = function() { resolve(null); };

    function tokenizeJapanese(text) {
      if (!text) return [];
      var cleanForTokens = text
        .replace(/【[^】]*】/g, '')
        .replace(/・[^：\n]+：/g, '')
        .replace(/```[\s\S]*?```/g, '');
      var pattern = /[一-龠々〆ヵヶ]{1,6}[ぁ-ん]{0,3}|[ァ-ヴー]{2,8}|[a-zA-Z]{2,10}|[ぁ-ん]{2,6}|[ぁ-ん]|[。、！？]/g;
      var matches = cleanForTokens.match(pattern);
      return matches ? matches : Array.from(cleanForTokens);
    }

    // ==========================================
    // 純粋会話コーパス構築（日常会話.txt + BASE_CHAT_CORPUS + クリーンな短い会話履歴のみ）
    // knowledge.txt や Wikipedia テキストは絶対に混ぜない
    // ==========================================
    function buildPureChatCorpusText() {
      var dailyChatPart = memoryStore.dailyChatCorpusText ? memoryStore.dailyChatCorpusText + '\n' : '';
      var recentChatLines = (memoryStore.chatHistory || [])
        .slice(-24)
        .map(function(item) { return (item.text || '').replace(/☕/g, '').trim(); })
        .filter(function(t) {
          if (t.length < 3 || t.length > 65) return false;
          if (t.indexOf('```') !== -1 || t.indexOf('■ ') !== -1) return false;
          if (t.indexOf('記憶から引っ張ってきたよ') !== -1 || t.indexOf('調べて覚えたよ') !== -1) return false;
          if (t.indexOf('自己診断') !== -1 || t.indexOf('index.html') !== -1) return false;
          if (FORBIDDEN_INITIAL_PARTICLE_REGEX.test(t) || POST_PUNCT_PARTICLE_REGEX.test(t)) return false;
          return true;
        });
      return dailyChatPart + BASE_CHAT_CORPUS + (recentChatLines.length > 0 ? '\n' + recentChatLines.join('\n') : '');
    }

    // ==========================================
    // 純粋会話脳 8層Deep Transformer + 文頭助詞ガード + 言葉吟味層（Critique Layer）
    // ==========================================
    function CafeUltraTransformer(previousWeights, chatCorpusText) {
      var pureChatText = chatCorpusText || buildPureChatCorpusText();
      var rawChatTokens = tokenizeJapanese(pureChatText);

      var freqMap = {};
      for (var c = 0; c < rawChatTokens.length; c++) {
        var ctk = rawChatTokens[c];
        freqMap[ctk] = (freqMap[ctk] || 0) + 1;
      }

      var sortedTokens = Object.keys(freqMap).sort(function(a, b) {
        return freqMap[b] - freqMap[a];
      }).slice(0, MAX_VOCAB_SIZE - 1);

      this.vocab = ['<UNK>'].concat(sortedTokens);
      this.vocabSize = this.vocab.length;
      this.tokenToId = {};
      this.idToToken = {};
      var self = this;
      this.vocab.forEach(function(tok, idx) {
        self.tokenToId[tok] = idx;
        self.idToToken[idx] = tok;
      });

      this.chatData = rawChatTokens.map(function(tok) {
        return (self.tokenToId[tok] !== undefined) ? self.tokenToId[tok] : 0;
      });
      this.data = this.chatData.slice();

      this.chatEpochCursor = memoryStore.chatEpochCursor || 0;
      if (this.chatData.length > CONTEXT_SIZE + 1 && this.chatEpochCursor >= this.chatData.length - CONTEXT_SIZE) {
        this.chatEpochCursor = 0;
      }

      this.numLayers = TRANSFORMER_LAYERS;
      this.tokenEmbed = this.createMatrix(this.vocabSize, EMBED_DIM);
      this.posEmbed = this.createMatrix(CONTEXT_SIZE, EMBED_DIM);

      this.layers = [];
      for (var l = 0; l < this.numLayers; l++) {
        this.layers.push({
          Wq: this.createMatrix(EMBED_DIM, EMBED_DIM),
          Wk: this.createMatrix(EMBED_DIM, EMBED_DIM),
          Wv: this.createMatrix(EMBED_DIM, EMBED_DIM),
          Wff1: this.createMatrix(EMBED_DIM, EMBED_DIM),
          Wff2: this.createMatrix(EMBED_DIM, EMBED_DIM)
        });
      }

      this.Wout = this.createMatrix(EMBED_DIM, this.vocabSize);

      if (previousWeights && previousWeights.pureChatOnly === true) {
        this.importWeights(previousWeights);
      }
    }

    CafeUltraTransformer.prototype.createMatrix = function(rows, cols) {
      var scale = Math.sqrt(2.0 / (rows + cols));
      var mat = [];
      for (var r = 0; r < rows; r++) {
        var row = [];
        for (var c = 0; c < cols; c++) {
          row.push((Math.random() * 2 - 1) * scale);
        }
        mat.push(row);
      }
      return mat;
    };

    CafeUltraTransformer.prototype.exportWeights = function() {
      return {
        pureChatOnly: true,
        numLayers: this.numLayers,
        embedDim: EMBED_DIM,
        vocab: this.vocab,
        tokenEmbed: this.tokenEmbed,
        posEmbed: this.posEmbed,
        layers: this.layers,
        Wout: this.Wout
      };
    };

    CafeUltraTransformer.prototype.importWeights = function(saved) {
      if (!saved || saved.pureChatOnly !== true || !saved.vocab) return;
      if (saved.posEmbed && saved.posEmbed.length === CONTEXT_SIZE && saved.posEmbed[0].length === EMBED_DIM) {
        this.posEmbed = saved.posEmbed;
      }
      if (saved.layers && Array.isArray(saved.layers)) {
        var copyCount = Math.min(this.layers.length, saved.layers.length);
        for (var l = 0; l < copyCount; l++) {
          if (saved.layers[l] && saved.layers[l].Wq && saved.layers[l].Wq.length === EMBED_DIM) {
            this.layers[l] = saved.layers[l];
          }
        }
      }

      var oldMap = {};
      for (var i = 0; i < saved.vocab.length; i++) {
        oldMap[saved.vocab[i]] = i;
      }
      for (var newId = 0; newId < this.vocab.length; newId++) {
        var tok = this.vocab[newId];
        var oldId = oldMap[tok];
        if (oldId !== undefined && saved.tokenEmbed[oldId] && saved.tokenEmbed[oldId].length === EMBED_DIM) {
          this.tokenEmbed[newId] = saved.tokenEmbed[oldId].slice();
          for (var d = 0; d < EMBED_DIM; d++) {
            if (saved.Wout[d] && saved.Wout[d][oldId] !== undefined) {
              this.Wout[d][newId] = saved.Wout[d][oldId];
            }
          }
        }
      }
    };

    CafeUltraTransformer.prototype.softmax = function(arr) {
      var maxVal = Math.max.apply(null, arr);
      var exps = arr.map(function(v) { return Math.exp(v - maxVal); });
      var sum = exps.reduce(function(a, b) { return a + b; }, 0);
      return exps.map(function(e) { return e / sum; });
    };

    CafeUltraTransformer.prototype.layerNorm = function(vec) {
      var mean = vec.reduce(function(a, b) { return a + b; }, 0) / vec.length;
      var variance = vec.reduce(function(a, b) { return a + (b - mean) * (b - mean); }, 0) / vec.length;
      var std = Math.sqrt(variance + 1e-5);
      return vec.map(function(v) { return (v - mean) / std; });
    };

    CafeUltraTransformer.prototype.matMul = function(A, B) {
      var rowsA = A.length;
      var colsA = A[0].length;
      var colsB = B[0].length;
      var result = [];
      for (var i = 0; i < rowsA; i++) {
        result.push(new Array(colsB).fill(0));
        for (var k = 0; k < colsA; k++) {
          for (var j = 0; j < colsB; j++) {
            result[i][j] += A[i][k] * B[k][j];
          }
        }
      }
      return result;
    };

    CafeUltraTransformer.prototype.runTransformerBlock = function(X, layerObj) {
      var seqLen = X.length;
      var Q = this.matMul(X, layerObj.Wq);
      var K = this.matMul(X, layerObj.Wk);
      var V = this.matMul(X, layerObj.Wv);
      var scale = Math.sqrt(EMBED_DIM);
      var attnOut = [];
      var self = this;

      for (var i = 0; i < seqLen; i++) {
        var scores = [];
        for (var j = 0; j <= i; j++) {
          var dot = 0;
          for (var d = 0; d < EMBED_DIM; d++) dot += Q[i][d] * K[j][d];
          scores.push(dot / scale);
        }
        var weights = this.softmax(scores);
        var vec = new Array(EMBED_DIM).fill(0);
        for (var j2 = 0; j2 <= i; j2++) {
          var w = weights[j2];
          for (var d2 = 0; d2 < EMBED_DIM; d2++) {
            vec[d2] += w * V[j2][d2];
          }
        }
        var residual1 = vec.map(function(v, d) { return v + X[i][d]; });
        attnOut.push(self.layerNorm(residual1));
      }

      var H = this.matMul(attnOut, layerObj.Wff1).map(function(row) {
        return row.map(function(v) { return v > 0 ? v : v * 0.05; });
      });
      var ffOut = this.matMul(H, layerObj.Wff2);
      return ffOut.map(function(row, i) {
        var residual2 = row.map(function(v, d) { return v + attnOut[i][d]; });
        return self.layerNorm(residual2);
      });
    };

    CafeUltraTransformer.prototype.forward = function(inputIds) {
      var seqLen = inputIds.length;
      var self = this;
      var hiddenStates = [];
      var X = inputIds.map(function(id, pos) {
        return self.tokenEmbed[id].map(function(val, d) { return val + self.posEmbed[pos][d]; });
      });
      hiddenStates.push(X);

      for (var l = 0; l < this.numLayers; l++) {
        X = this.runTransformerBlock(X, this.layers[l]);
        hiddenStates.push(X);
      }

      var lastHidden = X[seqLen - 1];
      var layer7Hidden = (hiddenStates.length >= 2) ? hiddenStates[hiddenStates.length - 2][seqLen - 1] : lastHidden;
      var logits = new Array(this.vocabSize).fill(0);
      for (var v = 0; v < this.vocabSize; v++) {
        for (var d3 = 0; d3 < EMBED_DIM; d3++) {
          logits[v] += lastHidden[d3] * this.Wout[d3][v];
        }
      }
      return { logits: logits, lastHidden: lastHidden, layer7Hidden: layer7Hidden, hiddenStates: hiddenStates, seqLen: seqLen };
    };

    CafeUltraTransformer.prototype.trainOnSequence = function(inputIds, targetId, lrMultiplier) {
      var lr = LEARNING_RATE * (lrMultiplier || 1.0);
      var cache = this.forward(inputIds);
      var probs = this.softmax(cache.logits);
      var loss = -Math.log(Math.max(probs[targetId], 1e-7));

      var dLogits = probs.slice();
      dLogits[targetId] -= 1.0;

      var dHidden = new Array(EMBED_DIM).fill(0);
      for (var d = 0; d < EMBED_DIM; d++) {
        for (var v = 0; v < this.vocabSize; v++) {
          dHidden[d] += dLogits[v] * this.Wout[d][v];
          this.Wout[d][v] -= lr * cache.lastHidden[d] * dLogits[v];
        }
      }

      var lastPos = cache.seqLen - 1;
      var lastTokenId = inputIds[lastPos];

      for (var l = this.numLayers - 1; l >= 0; l--) {
        var layerInput = cache.hiddenStates[l][lastPos];
        var layerScale = 0.25 / (this.numLayers - l);
        var layerObj = this.layers[l];
        for (var d2 = 0; d2 < EMBED_DIM; d2++) {
          var grad = dHidden[d2];
          for (var d3 = 0; d3 < EMBED_DIM; d3++) {
            layerObj.Wff2[d3][d2] -= lr * layerScale * layerInput[d3] * grad;
            layerObj.Wff1[d3][d2] -= lr * layerScale * 0.8 * layerInput[d3] * grad;
            layerObj.Wv[d3][d2] -= lr * layerScale * layerInput[d3] * grad;
            layerObj.Wq[d3][d2] -= lr * layerScale * 0.5 * layerInput[d3] * grad;
            layerObj.Wk[d3][d2] -= lr * layerScale * 0.5 * layerInput[d3] * grad;
          }
        }
      }

      for (var d4 = 0; d4 < EMBED_DIM; d4++) {
        this.tokenEmbed[lastTokenId][d4] -= lr * dHidden[d4];
        this.posEmbed[lastPos][d4] -= lr * dHidden[d4];
      }
      return loss;
    };

    CafeUltraTransformer.prototype.trainChatEpochStep = function() {
      if (!this.chatData || this.chatData.length <= CONTEXT_SIZE + 1) return { loss: 0, epochCompleted: false };
      var maxStart = this.chatData.length - CONTEXT_SIZE - 1;
      var startIdx = this.chatEpochCursor;
      var inputIds = this.chatData.slice(startIdx, startIdx + CONTEXT_SIZE);
      var targetId = this.chatData[startIdx + CONTEXT_SIZE];

      this.chatEpochCursor++;
      var epochCompleted = false;
      if (this.chatEpochCursor > maxStart) {
        this.chatEpochCursor = 0;
        epochCompleted = true;
      }
      memoryStore.chatEpochCursor = this.chatEpochCursor;

      var loss = this.trainOnSequence(inputIds, targetId, 1.15);
      return { loss: loss, epochCompleted: epochCompleted };
    };

    // ==========================================
    // 文頭助詞・句読点直後助詞の厳格ブロック付き候補生成
    // ==========================================
    CafeUltraTransformer.prototype.generateSingleCandidate = function(seedText, maxTokens, temperature) {
      if (!maxTokens) maxTokens = 18;
      if (!temperature) temperature = 0.65;
      var tokens = tokenizeJapanese(seedText);
      var self = this;
      var ids = tokens.map(function(t) { return self.tokenToId[t] !== undefined ? self.tokenToId[t] : 0; });
      if (ids.length === 0) ids = [1];

      var generated = [];
      var singleHiraganaStreak = 0;
      var lastLayer7Vec = null;
      var lastLayer8Vec = null;
      var prevWord = '';

      for (var step = 0; step < maxTokens; step++) {
        var ctx = ids.slice(-CONTEXT_SIZE);
        var res = this.forward(ctx);
        lastLayer7Vec = res.layer7Hidden;
        lastLayer8Vec = res.lastHidden;
        var recentBlockedIds = ids.slice(-RECENT_BLOCK_WINDOW);

        var scaledLogits = res.logits.map(function(l, idx) {
          var tok = self.idToToken[idx];
          if (idx === 0 || !tok || tok === '\n') return -1e9;
          if (recentBlockedIds.indexOf(idx) !== -1) return -1e9;

          // Step 0（文頭）では助詞・助動詞・接尾辞・句読点を完全禁止
          if (step === 0 && FORBIDDEN_INITIAL_PARTICLE_REGEX.test(tok)) {
            return -1e9;
          }

          // 句読点（「。」「、」「！」「？」）の直後でも助詞・助動詞・接尾辞・句読点を完全禁止（「。は」等を防止）
          if (prevWord && /[。、！？]$/.test(prevWord) && FORBIDDEN_INITIAL_PARTICLE_REGEX.test(tok)) {
            return -1e9;
          }

          // 助詞の連続をブロック
          if (prevWord && /(?:がの|をに|はが|にを|での|への|からを|までが|とが|もを|がを|にが|をは|がは)/.test(prevWord + tok)) {
            return -1e9;
          }

          // 1文字ひらがなの連続を厳格ブロック
          var isSingleHiragana = /^[ぁ-ん]$/.test(tok);
          if (isSingleHiragana && singleHiraganaStreak >= 1) return -1e9;

          var bonus = (tok.length >= 2) ? 0.9 : -0.4;
          return (l + bonus) / temperature;
        });

        var probs = this.softmax(scaledLogits);
        var r = Math.random();
        var cum = 0;
        var chosen = 1;
        for (var v = 1; v < probs.length; v++) {
          cum += probs[v];
          if (r <= cum) {
            chosen = v;
            break;
          }
        }

        ids.push(chosen);
        var word = this.idToToken[chosen];
        if (/^[ぁ-ん]$/.test(word)) {
          singleHiraganaStreak++;
        } else {
          singleHiraganaStreak = 0;
        }
        prevWord = word;

        generated.push(word);
        if ((word === '。' || word === '！' || word === '？') && generated.length >= 6) break;
      }

      var resultText = generated.join('')
        .replace(/[、。]+([。！？])/g, '$1')
        .replace(/([。！？])[、。]+/g, '$1');
      if (resultText && !/[。！？]$/.test(resultText)) {
        resultText += '！';
      }
      return {
        text: resultText,
        temperature: temperature,
        layer7Vec: lastLayer7Vec,
        layer8Vec: lastLayer8Vec
      };
    };

    CafeUltraTransformer.prototype.computeContextAlignment = function(seedText, outLayer7Vec, outLayer8Vec) {
      if (!outLayer8Vec) return 0;
      var seedTokens = tokenizeJapanese(seedText);
      var self = this;
      var seedIds = seedTokens.map(function(t) { return self.tokenToId[t] !== undefined ? self.tokenToId[t] : 0; }).slice(-CONTEXT_SIZE);
      if (seedIds.length === 0) return 0;

      var seedRes = this.forward(seedIds);
      var inVec8 = seedRes.lastHidden;
      var inVec7 = seedRes.layer7Hidden || inVec8;

      function calcCosSim(vecA, vecB) {
        if (!vecA || !vecB) return 0;
        var dot = 0, normA = 0, normB = 0;
        for (var d = 0; d < EMBED_DIM; d++) {
          dot += vecA[d] * vecB[d];
          normA += vecA[d] * vecA[d];
          normB += vecB[d] * vecB[d];
        }
        return (normA === 0 || normB === 0) ? 0 : dot / (Math.sqrt(normA) * Math.sqrt(normB));
      }

      var sim8 = calcCosSim(inVec8, outLayer8Vec);
      var sim7 = calcCosSim(inVec7, outLayer7Vec);
      return (sim8 * 0.65) + (sim7 * 0.35);
    };

    // ==========================================
    // 日常会話.txt / BASE_CHAT_CORPUS からの文脈適合自然会話フォールバック生成
    // ==========================================
    function selectContextualNaturalChatFallback(userSeed) {
      var trimmed = (userSeed || '').trim();
      var poolText = (memoryStore.dailyChatCorpusText ? memoryStore.dailyChatCorpusText + '\n' : '') + BASE_CHAT_CORPUS;
      var rawSentences = poolText.split('\n')
        .map(function(line) { return line.trim(); })
        .filter(function(line) {
          return line.length >= 8 && line.length <= 60 && !FORBIDDEN_INITIAL_PARTICLE_REGEX.test(line) && !POST_PUNCT_PARTICLE_REGEX.test(line);
        });

      var contextualReplies = [];
      if (/^(だね|そうだね|ほんと|本当|わかる|たしかに|うん)/.test(trimmed)) {
        contextualReplies = [
          '本当だね！そうやって共感し合えるのってすごくうれしいな！',
          'そうだね！のんびりカフェラテでも飲みながらゆっくりおしゃべりしようね！',
          'うんうん、その気持ちすごくよくわかるよ！いっしょに楽しい時間を作ろうね！'
        ];
      } else if (/進化|成長|賢く|学習|特訓/.test(trimmed)) {
        contextualReplies = [
          '任せてね！純粋会話8層Transformerと言葉吟味層で、おしゃべりするたびにどんどん成長していくよ！',
          'ありがとう！もっと自然な日本語でお話できるように、裏側でもしっかり会話エポックを特訓中だよ！',
          'ワクワクするね！いっしょにたくさんおしゃべりして、どんどん進化していくよ！'
        ];
      } else if (/眠い|ねむい|疲れ|つかれ|しんど/.test(trimmed)) {
        contextualReplies = [
          '無理しないでゆっくり休もうね！温かいカフェラテでも淹れてリラックスしようか？',
          'お疲れさま！目を閉じて少し深呼吸するだけでも気分がすっきりするよ。'
        ];
      } else if (/お腹|おなか|すいた|食べ|コーヒー|ラテ|カフェ|パン/.test(trimmed)) {
        contextualReplies = [
          '焼きたてのトーストと甘いパンケーキ、それに淹れたてのカフェラテがぴったりだね！',
          'いまちょうど香り高いコーヒーを淹れたところだよ！いっしょにほっと一息つこうね！'
        ];
      } else if (/楽しい|うれしい|嬉しい|最高|すごい|やった/.test(trimmed)) {
        contextualReplies = [
          'わあ、すごいね！そのワクワクする気持ち、ぼくまでうれしくなっちゃうよ！',
          'やったね！いいことがあると一日がすごく明るく楽しくなるよね！'
        ];
      }

      var searchPool = contextualReplies.length > 0 ? contextualReplies : rawSentences;
      if (searchPool.length === 0) {
        return 'ゆっくりしていってね！今日もいっしょに楽しくおしゃべりしようね！';
      }

      var filteredPool = searchPool.filter(function(s) { return s !== lastFallbackReplyText; });
      if (filteredPool.length === 0) filteredPool = searchPool;

      var picked = filteredPool[Math.floor(Math.random() * filteredPool.length)];
      lastFallbackReplyText = picked;
      return picked;
    }

    // ==========================================
    // 言葉吟味層（6候補採点・文頭助詞/句読点後助詞/反復の厳格減点＆自然会話フォールバック）
    // ==========================================
    CafeUltraTransformer.prototype.critiqueAndSelectBestResponse = function(candidates, userSeed) {
      var scoredCandidates = [];
      var dailyChatRef = (memoryStore.dailyChatCorpusText || '') + '\n' + BASE_CHAT_CORPUS;

      for (var i = 0; i < candidates.length; i++) {
        var cand = candidates[i];
        var txt = cand.text;
        var score = 50;
        var notes = [];

        // 1. 文頭の助詞・助動詞・接尾辞・句読点は -100 点で即失格
        if (!txt || FORBIDDEN_INITIAL_PARTICLE_REGEX.test(txt)) {
          score -= 100;
          notes.push('文頭助詞NG(-100)');
        }

        // 2. 句読点直後の助詞・助動詞・接尾辞（「。は」など）も -100 点で即失格
        if (POST_PUNCT_PARTICLE_REGEX.test(txt)) {
          score -= 100;
          notes.push('句読点後助詞NG(-100)');
        }

        // 3. 文字や単語の不自然な反復ループも -100 点で即失格
        if (/(.)\1{2,}/.test(txt) || /(.{2,6})\1/.test(txt)) {
          score -= 100;
          notes.push('反復ループNG(-100)');
        }

        // 4. 助詞同士の連続や意味不明な1文字ひらがな連鎖を減点
        if (/(?:がの|をに|はが|にを|での|への|からを|までが|とが|もを|がを|にが|をは|がは)/.test(txt)) {
          score -= 80;
          notes.push('助詞連続NG(-80)');
        }
        if (/[ぁ-ん]{1}[ぁ-ん]{1}[ぁ-ん]{1}/.test(txt) && !/(?:ありがとう|おはよう|こんにちは|こんばんは|よろしく|おしゃべり|のんびり|ゆっくり|わくわく|ニコニコ|いっしょに|なるほど|たしかに|わかるよ|うれしい|たのしい|おいしい|あたたかい|すずしい|かわいい|やさしい)/.test(txt)) {
          score -= 60;
          notes.push('断片連続NG(-60)');
        }

        // 5. 適切な文長評価
        if (txt.length >= 10 && txt.length <= 46) {
          score += 12;
          notes.push('適切文長(+12)');
        } else if (txt.length < 7) {
          score -= 40;
          notes.push('短すぎ(-40)');
        }

        // 6. 自然な会話語尾の加点（+25）
        if (/(?:よ！|ね！|かな？|だよ。|だね！|うれしいな！|しようね！|しようか？|たいな！|だね。|よ。)$/.test(txt)) {
          score += 25;
          notes.push('自然会話語尾(+25)');
        }

        // 7. 純粋会話コーパス語彙との一致度
        var outTokens = tokenizeJapanese(txt);
        var chatWordHits = 0;
        for (var tIdx = 0; tIdx < outTokens.length; tIdx++) {
          if (outTokens[tIdx].length >= 2 && dailyChatRef.indexOf(outTokens[tIdx]) !== -1) {
            chatWordHits++;
          }
        }
        if (chatWordHits >= 2) {
          var vocabBonus = Math.min(18, chatWordHits * 4);
          score += vocabBonus;
          notes.push('会話語彙一致(+' + vocabBonus + ')');
        }

        // 8. 第7層・第8層隠れ状態ベクトルの文脈コサイン類似度
        var sim = this.computeContextAlignment(userSeed, cand.layer7Vec, cand.layer8Vec);
        var simScore = Math.max(0, Math.round(sim * 25));
        score += simScore;
        notes.push('7・8層文脈類似(+' + simScore + ')');

        scoredCandidates.push({
          text: txt,
          score: score,
          temp: cand.temperature,
          notes: notes.join('/')
        });
      }

      scoredCandidates.sort(function(a, b) { return b.score - a.score; });
      var winner = scoredCandidates[0];
      var SCORE_THRESHOLD = 72;

      if (!winner || winner.score < SCORE_THRESHOLD) {
        var fallbackText = selectContextualNaturalChatFallback(userSeed);
        var topRawText = winner ? winner.text : 'なし';
        var topRawScore = winner ? winner.score : 0;
        lastCritiqueReport = '6候補最高スコア(' + topRawScore + '点 / T=' + (winner ? winner.temp : '-') + ' / 「' + topRawText + '」)が基準(' + SCORE_THRESHOLD + '点)未満のため、日常会話コーパスから最適文を選抜 → 「' + fallbackText + '」';
        return fallbackText;
      }

      lastCritiqueReport = '6候補選抜合格(スコア' + winner.score + '点 / T=' + winner.temp + '): 「' + winner.text + '」[' + winner.notes + ']';
      return winner.text;
    };

    CafeUltraTransformer.prototype.generateChatResponse = function(seedText, maxTokens) {
      var candidates = [];
      for (var i = 0; i < CANDIDATE_TEMPERATURES.length; i++) {
        candidates.push(this.generateSingleCandidate(seedText, maxTokens || 18, CANDIDATE_TEMPERATURES[i]));
      }
      return this.critiqueAndSelectBestResponse(candidates, seedText);
    };

    // ==========================================
    // AI画像生成エンジン（Canvasイラスト描画）
    // ==========================================
    function generateAIArtworkDataURL(promptText) {
      var canvas = document.createElement('canvas');
      canvas.width = 480;
      canvas.height = 320;
      var ctx = canvas.getContext('2d');

      var isNight = /夜|宇宙|星|月|銀河|ブラックホール|暗/.test(promptText);
      var isSunset = /夕焼け|夕方|サンセット|オレンジ|秋/.test(promptText);
      var isSea = /海|波|ビーチ|魚|水|空/.test(promptText);
      var isCafe = /カフェ|コーヒー|喫茶|ケーキ|パン|ラテ/.test(promptText);
      var isCat = /猫|ねこ|ネコ|動物|かわいい/.test(promptText);
      var isMountain = /山|森|自然|木|花|桜/.test(promptText);

      var bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      if (isNight) {
        bgGrad.addColorStop(0, '#0b1026');
        bgGrad.addColorStop(0.6, '#1b2749');
        bgGrad.addColorStop(1, '#2c3e50');
      } else if (isSunset) {
        bgGrad.addColorStop(0, '#ff5e62');
        bgGrad.addColorStop(0.5, '#ff9966');
        bgGrad.addColorStop(1, '#4a2545');
      } else if (isCafe) {
        bgGrad.addColorStop(0, '#f5e6d3');
        bgGrad.addColorStop(1, '#d7ccc8');
      } else {
        bgGrad.addColorStop(0, '#4facfe');
        bgGrad.addColorStop(0.7, '#a1c4fd');
        bgGrad.addColorStop(1, '#fdf8f2');
      }
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (isNight) {
        for (var s = 0; s < 65; s++) {
          ctx.fillStyle = 'rgba(255,255,255,' + (0.4 + Math.random() * 0.6) + ')';
          ctx.beginPath();
          ctx.arc(Math.random() * canvas.width, Math.random() * 210, 0.8 + Math.random() * 1.8, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.fillStyle = '#ffeaa7';
        ctx.beginPath();
        ctx.arc(380, 75, 28, 0, Math.PI * 2);
        ctx.fill();
        if (/宇宙|惑星|土星/.test(promptText)) {
          ctx.strokeStyle = 'rgba(255, 234, 167, 0.75)';
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.ellipse(380, 75, 52, 12, -0.3, 0, Math.PI * 2);
          ctx.stroke();
        }
      } else if (!isCafe) {
        ctx.fillStyle = isSunset ? '#ffeaa7' : '#fff7d6';
        ctx.beginPath();
        ctx.arc(390, 70, 32, 0, Math.PI * 2);
        ctx.fill();
      }

      if (isSea) {
        var seaGrad = ctx.createLinearGradient(0, 190, 0, 320);
        seaGrad.addColorStop(0, isSunset ? '#c0392b' : '#0984e3');
        seaGrad.addColorStop(1, '#0652DD');
        ctx.fillStyle = seaGrad;
        ctx.fillRect(0, 195, canvas.width, 125);
        ctx.strokeStyle = 'rgba(255,255,255,0.45)';
        ctx.lineWidth = 2;
        for (var w = 0; w < 6; w++) {
          ctx.beginPath();
          ctx.moveTo(40 + w * 60, 215 + w * 16);
          ctx.lineTo(130 + w * 60, 215 + w * 16);
          ctx.stroke();
        }
      } else if (isMountain || (!isCafe && !isCat)) {
        ctx.fillStyle = isNight ? '#1e272e' : '#6ab04c';
        ctx.beginPath();
        ctx.moveTo(0, 260);
        ctx.lineTo(140, 145);
        ctx.lineTo(280, 260);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = isNight ? '#2f3640' : '#badc58';
        ctx.beginPath();
        ctx.moveTo(180, 265);
        ctx.lineTo(340, 130);
        ctx.lineTo(480, 265);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = isNight ? '#192a56' : '#2ecc71';
        ctx.fillRect(0, 250, canvas.width, 70);
      }

      if (isCafe || (!isSea && !isMountain && !isCat)) {
        ctx.fillStyle = '#8d6e63';

        ctx.ellipse(240, 245, 78, 16, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fdf8f2';
        ctx.beginPath();
        ctx.moveTo(185, 175);
        ctx.lineTo(295, 175);
        ctx.quadraticCurveTo(290, 245, 240, 245);
        ctx.quadraticCurveTo(190, 245, 185, 175);
        ctx.fill();
        ctx.fillStyle = '#6f4e37';
        ctx.beginPath();
        ctx.ellipse(240, 175, 55, 12, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.8)';
        ctx.lineWidth = 3;
        for (var st = -1; st <= 1; st++) {
          ctx.beginPath();
          ctx.moveTo(240 + st * 22, 155);
          ctx.quadraticCurveTo(232 + st * 22, 135, 244 + st * 22, 115);
          ctx.stroke();
        }
      }

      if (isCat) {
        var cx = isCafe ? 355 : 240;
        var cy = isCafe ? 205 : 210;
        ctx.fillStyle = '#4e342e';
        ctx.beginPath();
        ctx.moveTo(cx - 34, cy - 15);
        ctx.lineTo(cx - 24, cy - 52);
        ctx.lineTo(cx - 6, cy - 28);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(cx + 34, cy - 15);
        ctx.lineTo(cx + 24, cy - 52);
        ctx.lineTo(cx + 6, cy - 28);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(cx, cy, 38, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffeaa7';
        ctx.beginPath();
        ctx.arc(cx - 13, cy - 5, 5.5, 0, Math.PI * 2);
        ctx.arc(cx + 13, cy - 5, 5.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ff7675';
        ctx.beginPath();
        ctx.arc(cx, cy + 5, 3, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fillRect(10, canvas.height - 28, 220, 20);
      ctx.fillStyle = '#ffffff';
      ctx.font = '11px sans-serif';

    async function fetchRandomWebArticles() {
      var randomUrl = 'https://ja.wikipedia.org/w/api.php?action=query&generator=random&grnnamespace=0&grnlimit=' + FETCH_ARTICLE_COUNT + '&prop=extracts&exintro&explaintext&format=json&origin=*';
      var resObj = await safeFetchJson(randomUrl);
      var structuredBlocks = [];
      var titles = [];

      if (resObj.ok && resObj.data && resObj.data.query && resObj.data.query.pages) {
        var pages = resObj.data.query.pages;
        var keys = Object.keys(pages);
        for (var i = 0; i < keys.length; i++) {
          var pId = keys[i];
          var title = pages[pId].title;
          var cleanBody = cleanWikipediaText(pages[pId].extract);
          if (cleanBody.length > 12) {
            titles.push(title);
            structuredBlocks.push('【テーマ：' + title + '】\n・' + title + '：' + cleanBody);
          }
        }
      }

      var collectedText = structuredBlocks.join('\n\n');
      if (collectedText.trim().length <= 15) {
        collectedText = '【テーマ：森の喫茶店】\n・喫茶店：森の奥にある小さな喫茶店では、いつも温かいミルクティーの香りが漂っていました。';
        titles = ['森の喫茶店'];
      }
      return { text: collectedText.trim(), titles: titles };
    }

    async function fetchTopicFromWikipedia(topicQuery) {
      var exactUrl = 'https://ja.wikipedia.org/w/api.php?action=query&titles=' + encodeURIComponent(topicQuery) + '&redirects=1&prop=extracts&exintro&explaintext&format=json&origin=*';
      var resObj = await safeFetchJson(exactUrl);
      var pages = (resObj.ok && resObj.data && resObj.data.query && resObj.data.query.pages) ? resObj.data.query.pages : {};
      var keys = Object.keys(pages);

      var hasValidExact = false;
      for (var j = 0; j < keys.length; j++) {
        if (Number(keys[j]) > 0 && pages[keys[j]].extract && pages[keys[j]].extract.trim().length > 15) {
          hasValidExact = true;
          break;
        }
      }

      if (!hasValidExact) {
        var searchUrl = 'https://ja.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=' + encodeURIComponent(topicQuery) + '&gsrlimit=2&prop=extracts&exintro&explaintext&format=json&origin=*';
        resObj = await safeFetchJson(searchUrl);
        pages = (resObj.ok && resObj.data && resObj.data.query && resObj.data.query.pages) ? resObj.data.query.pages : {};
        keys = Object.keys(pages);
      }

      var structuredBlocks = [];
      var titles = [];
      var summaryForReply = '';

      for (var i = 0; i < keys.length; i++) {
        var pId = keys[i];
        if (Number(pId) < 0) continue;
        var title = pages[pId].title;
        var cleanBody = cleanWikipediaText(pages[pId].extract);
        if (cleanBody.length > 10) {
          titles.push(title);
          structuredBlocks.push('【テーマ：' + title + '】\n・' + title + '：' + cleanBody);
          if (!summaryForReply) {
            summaryForReply = cleanBody.split('。').slice(0, 3).join('。') + '。';
          }
        }
      }

      return {
        text: structuredBlocks.join('\n\n').trim(),
        titles: titles,
        summaryForReply: summaryForReply
      };
    }

    function storeKnowledgeInRagOnly(newText, newTitles) {
      var isAdded = false;
      if (newText && memoryStore.ragCorpusText.indexOf(newText.slice(0, 25)) === -1) {
        var combined = (memoryStore.ragCorpusText ? memoryStore.ragCorpusText + '\n\n' : '') + newText;
        memoryStore.ragCorpusText = (MAX_MEMORY_CHARS === Infinity) ? combined : combined.slice(-MAX_MEMORY_CHARS);
        isAdded = true;
      }
      if (Array.isArray(newTitles)) {
        newTitles.forEach(function(t) {
          if (memoryStore.topics.indexOf(t) === -1) {
            memoryStore.topics.push(t);
          }
        });
      }
      if (isAdded && newText) {
        enqueueGitHubWrite(newText);
      }
      return isAdded;
    }

    function searchMultiFactsInMemory(keywords, sentenceOffset, requireExactTopic) {
      if (sentenceOffset === undefined) sentenceOffset = 0;
      var lines = (memoryStore.ragCorpusText || '').split('\n');
      var scoredMatches = [];

      for (var l = 0; l < lines.length; l++) {
        var line = lines[l].trim();
        if (!line || line.indexOf('【テーマ：') === 0) continue;

        var colonIdx = line.indexOf('：');
        var topicName = colonIdx !== -1 ? line.slice(0, colonIdx).replace(/^・/, '').trim() : '知識メモ';
        var rawFact = colonIdx !== -1 ? line.slice(colonIdx + 1).trim() : line.replace(/^・/, '');

        var score = 0;
        for (var k = 0; k < keywords.length; k++) {
          var kw = keywords[k];
          if (!kw) continue;
          if (topicName === kw) {
            score += 100;
          } else if (topicName.indexOf(kw) !== -1 && topicName.length <= kw.length + 3) {
            score += 40;
          } else if (!requireExactTopic && rawFact.indexOf(kw) !== -1) {
            score += 2;
          }
        }

        if (score > 0) {
          var sentences = rawFact.split('。').filter(function(s) { return s.trim().length > 0; });
          var start = sentenceOffset < sentences.length ? sentenceOffset : 0;
          var excerpt = sentences.slice(start, start + 3).join('。') + '。';
          scoredMatches.push({ topic: topicName, text: excerpt, score: score });
        }
      }

      scoredMatches.sort(function(a, b) { return b.score - a.score; });
      return scoredMatches.slice(0, 3);
    }

          /(?:つくって|作って|書いて|作成|生成).*(?:html|css|javascript|js|python|コード|プログラム)/i.test(trimmed)) {

      if (/^(こんにちは|こんにちわ|こんばんは|こんばんわ|おはよう|おはようございます|やあ|ハロー|はじめまして|よろしく|おっす|ちわ)/.test(normalized)) {
        var pressureNote = (trimmed.indexOf('圧') !== -1) ? '（ビシッ！と背筋を伸ばしてご挨拶するね！☕）\n' : '';
        var naturalGreetingFollow = llmModel ? llmModel.generateChatResponse(trimmed, 16) : '今日もゆっくりおしゃべりしようね！';
        return {

      if (/名前|好み|好きなもの|覚えてる/.test(normalized) && /私|僕|俺|わたし|ぼく|おれ/.test(normalized)) {
        var uName = memoryStore.userProfile.name || 'まだ聞いていないみたい';
        var uLikes = memoryStore.userProfile.likes.length > 0 ? memoryStore.userProfile.likes.join('・') : 'まだ登録なし';
        return {

          imageUrl: null
        };

      var compareMatch = trimmed.match(/^(.+?)と(.+?)(?:の|について|を)?(?:違い|共通点|比較|関係|どっち|比べて)/);
      if (compareMatch && compareMatch[1] && compareMatch[2]) {
        var topicA = compareMatch[1].replace(/^(?:ねえ|あの|ところで)/, '').trim();
        var topicB = compareMatch[2].trim();
        memoryStore.lastDiscussedTopic = topicA;

        var resA = searchMultiFactsInMemory([topicA], 0, true)[0];
        if (!resA) {
          var fetchedA = await fetchTopicFromWikipedia(topicA);
          if (fetchedA.text && fetchedA.titles.length > 0) {
            storeKnowledgeInRagOnly(fetchedA.text, fetchedA.titles);
            resA = { topic: fetchedA.titles[0], text: fetchedA.summaryForReply };
          }
        }

        var resB = searchMultiFactsInMemory([topicB], 0, true)[0];
        if (!resB) {
          var fetchedB = await fetchTopicFromWikipedia(topicB);
          if (fetchedB.text && fetchedB.titles.length > 0) {
            storeKnowledgeInRagOnly(fetchedB.text, fetchedB.titles);

          };

      if (/^(もっと詳しく|もっと教えて|続き|つづき|詳細)/.test(normalized) && memoryStore.lastDiscussedTopic) {
        memoryStore.lastTopicOffset = (memoryStore.lastTopicOffset || 0) + 3;
        var moreMatches = searchMultiFactsInMemory([memoryStore.lastDiscussedTopic], memoryStore.lastTopicOffset, true);
        if (moreMatches.length > 0 && moreMatches[0].text) {
          return { text: userNamePrefix + '「' + memoryStore.lastDiscussedTopic + '」の続きだね☕\n\n' + moreMatches[0].text, imageUrl: null };
        }
      }

      var writeMatch = trimmed.match(/^(.+?)(?:の|についての|に関する)?(?:文章|作文|紹介文|解説文|物語|ストーリー|スピーチ|まとめ)を?(?:つくって|作って|書いて|作成して|考えて|お願い)/);
      if (writeMatch && writeMatch[1]) {
        var rawWriteTopic = writeMatch[1].trim();
        var writeTopic = (/^(それ|これ|あれ|その|この|さっきの)$/.test(rawWriteTopic) && memoryStore.lastDiscussedTopic)
          ? memoryStore.lastDiscussedTopic
          : rawWriteTopic;
        var llmCreativeTail = llmModel ? llmModel.generateChatResponse(writeTopic, 20) : '';

          text: '「' + writeTopic + '」をテーマに書いてみたよ☕\n\n' + writeTopic + 'といえば、' + llmCreativeTail,
          imageUrl: null

      var isExplicitQuestion = /(?:とは[？?]?$|ってなに[？?]?$|って何[？?]?$|について教えて|を教えて|を調べて|について調べて|を解説して|を説明して|を検索して|を知りたい|とは何)/.test(trimmed);

      if (isExplicitQuestion) {
        var queryClean = trimmed
          .replace(/(?:について|を|とは|って|ってなに|って何|のことも)?(?:調べて|学んで|勉強して|検索して|学習して|教えて|解説して|説明して|知ってる|知りたい|何|なに|ですか|だよね|かな)[？?！!。]*$/g, '')
          .replace(/[？?！!。、]/g, ' ')
          .trim();

        var keywords = queryClean.split(/\s+/).filter(function(w) { return w.length >= 2; });
        var targetKeyword = keywords[0] || normalized;

        if (targetKeyword && targetKeyword.length >= 2) {
          memoryStore.lastDiscussedTopic = targetKeyword;
          memoryStore.lastTopicOffset = 0;

          var ragMatches = searchMultiFactsInMemory(keywords.length > 0 ? keywords : [targetKeyword], 0, true);
          if (ragMatches.length > 0) {
            return {
              text: userNamePrefix + '「' + targetKeyword + '」について記憶から引っ張ってきたよ☕\n\n' + ragMatches[0].text,
              imageUrl: null
            };
          }

          trainStatusEl.textContent = '🔍 質問にお答えするためWikipediaで「' + targetKeyword + '」を調査中...';
          try {
            var topicData = await fetchTopicFromWikipedia(targetKeyword);
            if (topicData.text && topicData.titles.length > 0) {
              storeKnowledgeInRagOnly(topicData.text, topicData.titles);
              saveToPermanentMemory();
              updateStatusDisplay();
              return {
                text: userNamePrefix + '「' + targetKeyword + '」について調べて覚えたよ☕\n\n' + topicData.summaryForReply,
                imageUrl: null
              };
            }

        }
      }

      var directGenerated = llmModel
        ? llmModel.generateChatResponse(trimmed, 18)
        : 'うんうん、その話もっと聞かせてほしいな！';

      return {
        text: userNamePrefix + directGenerated + ' ☕',
        imageUrl: null
      };
    }

        if (idx < chars.length) {
          div.textContent += chars[idx];
          idx++;
          chatBox.scrollTop = chatBox.scrollHeight;

          div.classList.remove('typing-cursor');
          if (imageUrl) {
            appendArtToBubble(div, imageUrl, imageTitle);
          }
          if (callback) callback();
        }
      }
      typeNext();
    }

    function toggleKnowledgePanel() {
      if (knowledgePanel.style.display === 'block') {
        knowledgePanel.style.display = 'none';
      } else {
        knowledgePanel.style.display = 'block';
        renderKnowledgePanel();
      }
    }

    function renderKnowledgePanel() {
      var previewText = (memoryStore.ragCorpusText || '').slice(-3000);
      var prefixNote = (memoryStore.ragCorpusText || '').length > 3000 ? '（※最新の3,000文字を抜粋表示中）\n\n' : '';
      var vocabSize = llmModel ? llmModel.vocabSize : 0;
      var dailyChatChars = (memoryStore.dailyChatCorpusText || '').length;
      var userName = (memoryStore.userProfile && memoryStore.userProfile.name) || '未登録';
      var userLikes = (memoryStore.userProfile && memoryStore.userProfile.likes.length > 0) ? memoryStore.userProfile.likes.join(' / ') : '未登録';

      var jsonDetailHtml = '';
      if (memoryStore.cloudBrainStatus === 'loaded' && memoryStore.cloudBrainMeta) {
        var meta = memoryStore.cloudBrainMeta;
        jsonDetailHtml =
          '・☁️ <b>brain_weights.json 状態: 純粋会話モデル確認済 ✅</b><br>' +
          '　└ 特訓エポック数: <b>' + meta.epochs + '周</b> / 学習日時: <b>' + meta.trainedAt + '</b> / 構成: <b>' + meta.numLayers + '層・' + meta.embedDim + '次元</b><br>';
      } else {
        jsonDetailHtml =
          '・✨ <b>brain_weights.json 状態: 純粋会話DB（CafeUltraLLM8LayerPureChatDB）で独立稼働中</b>（旧Wikipedia混入ファイルは自動スキップ済）<br>';
      }

      var reloadNoteHtml = cloudReloadMessage
        ? '<span style="margin-left:8px; font-size:0.76rem; color:#2980b9; font-weight:bold;">' + cloudReloadMessage + '</span>'
        : '';

      knowledgePanel.innerHTML =
        '<div style="margin-bottom:8px;">' +
          '<button type="button" class="mini-btn" onclick="manualReloadCloudBrain()">🔄 brain_weights.json確認</button>' +
          reloadNoteHtml +
        '</div>' +
        '<strong>🧠 純粋会話' + TRANSFORMER_LAYERS + '層Transformer（' + EMBED_DIM + '次元・言葉吟味層・Wikipedia完全隔離済）状態:</strong><br>' +
        jsonDetailHtml +
        '・最新言葉吟味層レポート: <b>' + lastCritiqueReport + '</b><br>' +
        '・日常会話.txt 読み込み量: <b>' + dailyChatChars.toLocaleString() + '文字</b>（ローカル会話エポック: <b>' + (memoryStore.chatEpochCount || 0) + '周完走</b>）<br>' +
        '・純粋会話語彙辞書数: <b>' + vocabSize + '語</b>（Wikipedia単語混入: <b>0語・完全隔離済</b>）<br>' +
        '・最新コード診断ログ: <b>' + LAST_SELF_REPAIR_NOTE + '</b>（v' + SELF_CODE_VERSION + '）<br>' +
        '・長期パーソナル記憶: 名前=<b>' + userName + '</b> / 好み=<b>' + userLikes + '</b><br>' +
        '・RAG検索専用辞書（knowledge.txt等）総量: <b>' + (memoryStore.ragCorpusText || '').length.toLocaleString() + '文字</b><br><br>' +
        prefixNote + (previewText || 'まだRAG検索データがありません');
    }

    // ==========================================
    // brain_weights.json の取得・pureChatOnly 検証・安全ロード
    // ==========================================
    async function fetchCloudBrainWeights() {
      var brainData = null;

      var rawResObj = await safeFetchJson(GITHUB_CLOUD_BRAIN_FILE + '?t=' + Date.now(), { cache: 'no-store' });
      if (rawResObj.ok && rawResObj.data) {
        brainData = rawResObj.data;
      }

      if (!brainData) {
        var token = getSavedToken();
        if (token) {
          var apiUrl = 'https://api.github.com/repos/' + GITHUB_OWNER + '/' + GITHUB_REPO + '/contents/' + GITHUB_CLOUD_BRAIN_PATH + '?nocache=' + Date.now();
          var apiRes = await safeFetchJson(apiUrl, {
            headers: {
              'Authorization': 'Bearer ' + token,
              'Accept': 'application/vnd.github+json'
            },
            cache: 'no-store'
          });
          if (apiRes.ok && apiRes.data && apiRes.data.content) {
            brainData = safeParseJsonText(base64ToUtf8(apiRes.data.content));
          }
        }
      }

      // saved.pureChatOnly === true の場合のみロード（旧Wikipedia混入 brain_weights.json は絶対に入れない）
      var isPureValidBrain = Boolean(
        brainData &&
        brainData.pureChatOnly === true &&
        Array.isArray(brainData.vocab) &&
        brainData.vocab.length > 1 &&
        Array.isArray(brainData.tokenEmbed) &&
        Array.isArray(brainData.posEmbed) &&
        Array.isArray(brainData.layers) &&
        Array.isArray(brainData.Wout)
      );

      if (!isPureValidBrain) {
        memoryStore.cloudEpochs = 0;
        memoryStore.cloudTrainedAt = '';
        memoryStore.cloudBrainStatus = 'not_found';
        memoryStore.cloudBrainMeta = null;
        return null;
      }

      var epochs = Number(brainData.epochs) || 0;
      var trainedAt = String(brainData.trainedAt || '記録なし');
      var numLayers = Number(brainData.numLayers) || TRANSFORMER_LAYERS;
      var embedDim = Number(brainData.embedDim) || EMBED_DIM;

      memoryStore.cloudEpochs = epochs;
      memoryStore.cloudTrainedAt = trainedAt;
      memoryStore.cloudBrainStatus = 'loaded';
      memoryStore.cloudBrainMeta = {
        epochs: epochs,
        trainedAt: trainedAt,
        vocabLength: brainData.vocab.length,
        numLayers: numLayers,
        embedDim: embedDim
      };

      llmModel = new CafeUltraTransformer(brainData, buildPureChatCorpusText());
      memoryStore.savedWeights = llmModel.exportWeights();
      await saveToPermanentMemory();

      return brainData;
    }

    async function manualReloadCloudBrain() {
      cloudReloadMessage = '⏳ brain_weights.json を確認中...';
      renderKnowledgePanel();

      var loadedBrain = await fetchCloudBrainWeights();
      if (loadedBrain) {
        cloudReloadMessage = '✅ 純粋会話brain_weights.json読込成功！（特訓' + memoryStore.cloudEpochs + '周）';
      } else {
        cloudReloadMessage = 'ℹ️ pureChatOnlyフラグ付きのbrain_weights.jsonは未作成のため純粋会話ローカル脳を使用中です';
      }

      updateStatusDisplay();
      renderKnowledgePanel();
    }

    async function fetchGitHubKnowledgeFile() {
      var token = getSavedToken();
      if (token) {
        var apiUrl = 'https://api.github.com/repos/' + GITHUB_OWNER + '/' + GITHUB_REPO + '/contents/' + GITHUB_TARGET_PATH + '?nocache=' + Date.now();
        var apiRes = await safeFetchJson(apiUrl, {
          headers: {
            'Authorization': 'Bearer ' + token,
            'Accept': 'application/vnd.github+json'
          },
          cache: 'no-store'
        });
        if (apiRes.ok && apiRes.data && apiRes.data.content) {
          return base64ToUtf8(apiRes.data.content).trim();
        }
      }

      try {
        var rawRes = await fetch(GITHUB_KNOWLEDGE_FILE + '?t=' + Date.now());
        if (rawRes.ok) {
          var text = await rawRes.text();
          if (text && text.trim().length > 5 && text.trim().charAt(0) !== '<') {
            return text.trim();
          }
        }
      } catch (e2) {}
      return '';
    }

    async function fetchGitHubDailyChatFile() {
      var token = getSavedToken();
      if (token) {
        var apiUrl = 'https://api.github.com/repos/' + GITHUB_OWNER + '/' + GITHUB_REPO + '/contents/' + encodeURIComponent(GITHUB_DAILY_CHAT_PATH) + '?nocache=' + Date.now();
        var apiRes = await safeFetchJson(apiUrl, {
          headers: {
            'Authorization': 'Bearer ' + token,
            'Accept': 'application/vnd.github+json'
          },
          cache: 'no-store'
        });
        if (apiRes.ok && apiRes.data && apiRes.data.content) {
          return cleanDailyChatText(base64ToUtf8(apiRes.data.content));
        }
      }

      try {
        var rawRes = await fetch(GITHUB_DAILY_CHAT_FILE + '?t=' + Date.now());
        if (rawRes.ok) {
          var text = await rawRes.text();
          if (text && text.trim().length > 5 && text.trim().charAt(0) !== '<') {
            return cleanDailyChatText(text);
          }
        }
      } catch (e2) {}
      return '';
    }

    // ==========================================
    // 純粋会話エポック学習専用ループ（入力優先ポーズ対応）
    // ==========================================
    function trainPureChatEpochInBackground(announceMessage, isSilentBackground, onComplete) {
      if (isLearningNow) {
        if (onComplete) onComplete();
        return;
      }
      isLearningNow = true;

      var prevWeights = (llmModel && llmModel.exportWeights().pureChatOnly === true)
        ? llmModel.exportWeights()
        : (memoryStore.savedWeights && memoryStore.savedWeights.pureChatOnly === true ? memoryStore.savedWeights : null);
      var currentChatCorpus = buildPureChatCorpusText();
      var nextModel = new CafeUltraTransformer(prevWeights, currentChatCorpus);

      var dynamicChatSteps = Math.max(MIN_CHAT_EPOCH_STEPS, nextModel.chatData.length + 20);
      var chatStep = 0;

      function fastTrainLoop() {
        if (isSilentBackground && shouldPauseBackgroundLearning()) {
          trainStatusEl.textContent = '⏸️ 入力中のためエポック学習を一時停止中（サクサク入力優先モード）';
          setTimeout(fastTrainLoop, 250);
          return;
        }

        if (chatStep >= dynamicChatSteps) {
          llmModel = nextModel;
          isLearningNow = false;
          allowPostSendLearning = false;
          progressBarEl.style.width = '100%';
          updateStatusDisplay();
          promptInput.disabled = false;
          generateBtn.disabled = false;

          if (knowledgePanel.style.display === 'block') {
            renderKnowledgePanel();
          }

          saveToPermanentMemory();

          if (announceMessage) {
            memoryStore.chatHistory.push({ sender: 'ai', text: announceMessage });
            saveToPermanentMemory();
            addMessageWithTyping(announceMessage, 'ai', onComplete);
          } else if (onComplete) {
            onComplete();
          }
          return;
        }

        for (var c = 0; c < BATCH_PER_FRAME && chatStep < dynamicChatSteps; c++) {
          var epochRes = nextModel.trainChatEpochStep();
          if (epochRes.epochCompleted) {
            memoryStore.chatEpochCount = (memoryStore.chatEpochCount || 0) + 1;
          }
          chatStep++;
        }

        var percent = Math.round((chatStep / dynamicChatSteps) * 100);
        progressBarEl.style.width = percent + '%';
        trainStatusEl.textContent = isSilentBackground
          ? '🔄 放置中に純粋会話エポック(' + (memoryStore.chatEpochCount || 0) + '周目)学習中... ' + percent + '%'
          : '⚡ 純粋会話' + TRANSFORMER_LAYERS + '層Transformer・言葉吟味層初期化中... ' + percent + '%';

        setTimeout(fastTrainLoop, TRAIN_FRAME_INTERVAL_MS);
      }

      fastTrainLoop();
    }

    async function autoGrowInBackground() {
      if (githubWriteQueue.length > 0 && !isGitHubWriting) {
        processGitHubWriteQueue();
      }
      if (isLearningNow || shouldPauseBackgroundLearning()) return;
      try {
        trainStatusEl.textContent = '🌐 放置時間を利用して日常会話.txtエポック＆RAG知識を自動更新中...';
        var latestDailyChat = await fetchGitHubDailyChatFile();
        if (latestDailyChat) {
          memoryStore.dailyChatCorpusText = latestDailyChat;
        }
        var fetched = await fetchRandomWebArticles();
        storeKnowledgeInRagOnly(fetched.text, fetched.titles);

        trainPureChatEpochInBackground(null, true);
      } catch (e) {}
    }

    async function bootAI() {
      try {
        githubConfigPanel.style.display = 'none';

        var loaded = await loadFromUnlimitedStorage();
        if (loaded) {
          memoryStore = Object.assign({
            topics: [],
            ragCorpusText: '',
            dailyChatCorpusText: '',
            chatHistory: [],
            lastDiscussedTopic: '',
            lastTopicOffset: 0,
            evolutionCount: 0,
            chatEpochCount: 0,
            chatEpochCursor: 0,
            cloudEpochs: 0,
            cloudTrainedAt: '',
            cloudBrainStatus: 'not_found',
            cloudBrainMeta: null,
            userProfile: { name: '', likes: [], facts: [] },
            savedWeights: null
          }, loaded);
        }

        trainStatusEl.textContent = '📂 GitHubの 日常会話.txt・knowledge.txt を読み込み中...';
        var results = await Promise.all([
          fetchGitHubKnowledgeFile(),
          fetchGitHubDailyChatFile(),
          fetchCloudBrainWeights()
        ]);
        var githubText = results[0];
        var dailyChatText = results[1];
        var brainData = results[2];

        // 1. knowledge.txt は質問用RAG検索辞書（ragCorpusText）にのみ格納
        if (githubText && memoryStore.ragCorpusText.indexOf(githubText.slice(0, 25)) === -1) {
          var merged = githubText + (memoryStore.ragCorpusText ? '\n\n' : '') + memoryStore.ragCorpusText;
          memoryStore.ragCorpusText = (MAX_MEMORY_CHARS === Infinity) ? merged : merged.slice(-MAX_MEMORY_CHARS);
          if (memoryStore.topics.indexOf('GitHub知識ベース(knowledge.txt)') === -1) {
            memoryStore.topics.unshift('GitHub知識ベース(knowledge.txt)');
          }
        }

        // 2. 日常会話.txt を純粋会話コーパスとしてセット
        if (dailyChatText) {
          memoryStore.dailyChatCorpusText = dailyChatText;
        }

        // 3. チャット履歴の復元
        if (memoryStore.chatHistory && memoryStore.chatHistory.length > 0) {
          memoryStore.chatHistory.forEach(function(item) {
            addMessageImmediate(item.text, item.sender, item.imageUrl);
          });
        }

        // 4. pureChatOnly === true の brain_weights.json があれば優先適用、なければ純粋会話データのみで学習開始
        if (brainData && brainData.pureChatOnly === true) {
          llmModel = new CafeUltraTransformer(brainData, buildPureChatCorpusText());
          memoryStore.savedWeights = llmModel.exportWeights();
          progressBarEl.style.width = '100%';
          updateStatusDisplay();
          promptInput.disabled = false;
          generateBtn.disabled = false;
          saveToPermanentMemory();

          fetchRandomWebArticles().then(function(fetched) {
            storeKnowledgeInRagOnly(fetched.text, fetched.titles);
            saveToPermanentMemory();
          }).catch(function() {});
        } else {
          var validLocalWeights = (memoryStore.savedWeights && memoryStore.savedWeights.pureChatOnly === true)
            ? memoryStore.savedWeights
            : null;
          llmModel = new CafeUltraTransformer(validLocalWeights, buildPureChatCorpusText());

          fetchRandomWebArticles().then(function(fetched) {
            storeKnowledgeInRagOnly(fetched.text, fetched.titles);
          }).catch(function() {});

          var isFirstEver = (!memoryStore.chatHistory || memoryStore.chatHistory.length === 0);
          var greeting = isFirstEver
            ? 'やっほー！カフェ・LLMだよ☕ 古いWikipediaの単語を完全に切り離して、純粋な日常会話だけでおしゃべりできるように進化したよ！何でも気軽に話しかけてね！'
            : null;

          trainPureChatEpochInBackground(greeting, false);
        }

        setInterval(autoGrowInBackground, AUTO_LEARN_INTERVAL_MS);

      } catch (err) {
        statusContainer.style.backgroundColor = '#fdecea';
        trainStatusEl.textContent = '❌ 起動エラー: ' + err.message;
        promptInput.disabled = false;
        generateBtn.disabled = false;
      }
    }

    async function handleGenerateClick() {
      if (!llmModel) return;
      var prompt = promptInput.value.trim();
      if (!prompt) {
        prompt = 'こんにちは！';
      }

      isUserTyping = false;
      isComposingIME = false;
      allowPostSendLearning = true;

      addMessageImmediate(prompt, 'user');
      memoryStore.chatHistory.push({ sender: 'user', text: prompt });
      promptInput.value = '';
      promptInput.disabled = true;
      generateBtn.disabled = true;

      var replyObj = await generateFullLLMReply(prompt);
      memoryStore.chatHistory.push({ sender: 'ai', text: replyObj.text });

      selfEvolveFromChat(prompt, replyObj.text);
      saveToPermanentMemory();

      addMessageWithTyping(replyObj, 'ai', function() {
        promptInput.disabled = false;
        generateBtn.disabled = false;
        promptInput.focus();
        allowPostSendLearning = true;
      });
    }

    promptInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleGenerateClick();
        return;
      }
      markUserTypingActivity();
    });

    window.addEventListener('DOMContentLoaded', bootAI);
  </script>
