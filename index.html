<html lang="ja">
<head>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23fdf8f2' stroke='%238d6e63' stroke-width='4'/%3E%3Cpath d='M22 16 Q20 12 22 8 M32 15 Q30 11 32 7 M42 16 Q40 12 42 8' stroke='%23e67e22' stroke-width='3' stroke-linecap='round' fill='none'/%3E%3Cpath d='M16 24 H44 V38 C44 46 38 50 30 50 C22 50 16 46 16 38 Z' fill='%238d6e63'/%3E%3Cpath d='M44 27 H49 C52 27 54 29 54 33.5 C54 37 52 39 49 39 H44' stroke='%238d6e63' stroke-width='4' fill='none'/%3E%3Ccircle cx='25" cy="35" r="2.5" fill="%23fff'/%3E%3Ccircle cx='35' cy='35' r='2.5' fill='%23fff'/%3E%3Cpath d='M27 41 Q30 44 33 41' stroke='%23fff' stroke-width='2.5' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg-cream: #fdf8f2;
      --card-white: #ffffff;
      --latte-brown: #8d6e63;
      --espresso-dark: #4e342e;
      --caramel-accent: #e67e22;
      --mint-green: #27ae60;
      --sky-blue: #2980b9;
      --soft-border: #eadbc8;
    }

    body {
      font-family: 'Hiragino Maru Gothic ProN', 'Quicksand', sans-serif;
      background-color: var(--bg-cream);
      color: var(--espresso-dark);
      max-width: 760px;
      margin: 25px auto;
      padding: 0 16px;
    }

    header {
      text-align: center;
      margin-bottom: 18px;
    }

    .title-wrap {

    }

    .card {

      flex-direction: column;
    }

    .status-bar {
      background-color: #fbf3e8;
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 12px;
      font-size: 0.83rem;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .status-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tool-buttons {
      display: flex;
      gap: 6px;

    .mini-btn {

      width: 100%;

    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background-color: var(--mint-green);
      transition: width 0.15s;
    }

    #github-config-panel {
      display: none;
      background-color: #f4f9fc;
      border: 1px dashed var(--sky-blue);
      border-radius: 12px;

    .config-input {

    .save-config-btn {

    #knowledge-panel {

    #chat-box {
      height: 380px;

    .ai-row {
      display: flex;

      max-width: 88%;

    .ai-avatar {

    .message {

    @keyframes popIn {

    textarea {

<body>

  <header>

      </svg>
      <h1>カフェ・LLM</h1>
    </div>
    <div class="subtitle">単語トークナイザー・2層Transformer・RAG推論＆長期記憶LLM（280054-netizen/tomoAI）</div>

  <div class="card">
    <div class="status-bar" id="status-container">
      <div class="status-top">
        <span id="train-status">⏳ LLMの頭脳とGitHub knowledge.txt にアクセス中...</span>
        <div class="tool-buttons">
          <button type="button" class="mini-btn" onclick="toggleKnowledgePanel()">🧠 LLM脳みそ＆記憶を見る</button>
          <button type="button" class="mini-btn github-sync-btn" onclick="toggleGitHubConfigPanel()">🔒 制作者設定</button>
        </div>
      </div>
      <div class="progress-bar-bg">
        <div id="progress-bar" class="progress-bar-fill"></div>
      </div>
    </div>

    <div id="github-config-panel">
      <strong>🔒 制作者専用：GitHub「knowledge.txt」自動追記トークン設定</strong><br>
      <span style="font-size:0.75rem; color:#555;">※制作者認証済みです。トークン（github_pat_...）を保存するとブラウザ内に安全保管されます（280054-netizen/tomoAI）。</span>
      <input type="password" id="gh-token-input" class="config-input" placeholder="新しいトークン（github_pat_...）を貼り付け">
      <button type="button" class="save-config-btn" onclick="saveNewGitHubToken()">💾 トークンを保存して閉じる</button>
      <span id="gh-badge" style="margin-left:8px; font-size:0.75rem; color:#27ae60;"></span>
    </div>

    <div id="knowledge-panel"></div>

    <div id="chat-box"></div>

    <div class="input-group">
      <textarea id="prompt-input" placeholder="質問・比較（「宇宙と地球の違い」）・「私は〇〇と申します」など何でも話しかけてね..." disabled></textarea>
      <button type="button" id="generate-btn" class="btn-send" onclick="handleGenerateClick()" disabled>送信</button>
    </div>
  </div>

  <script>
    window.onerror = function(message, source, lineno) {
      var container = document.getElementById('status-container');
      var statusEl = document.getElementById('train-status');
      if (container && statusEl) {
        container.style.backgroundColor = '#fdecea';
        container.style.border = '1px solid #e74c3c';
        statusEl.textContent = '❌ エラー（' + lineno + '行目）: ' + message;
      }
    };

    // ==========================================
    // ★制作者パスワード設定（自由に変更できます）
    // ==========================================
    var CREATOR_PASSWORD = 'tomo2026';
    var isCreatorUnlocked = false;

    var GITHUB_OWNER = '280054-netizen';
    var GITHUB_REPO = 'tomoAI';
    var GITHUB_TARGET_PATH = 'knowledge.txt';
    var GITHUB_KNOWLEDGE_FILE = './knowledge.txt';
    var TOKEN_STORAGE_KEY = 'tomoai_safe_github_token_v2';

    var FETCH_ARTICLE_COUNT = 3;
    var AUTO_LEARN_INTERVAL_MS = 25000;
    var MAX_MEMORY_CHARS = Infinity;
    var MAX_VOCAB_SIZE = 1500;
    var CONTEXT_SIZE = 6;
    var EMBED_DIM = 24;
    var LEARNING_RATE = 0.05;
    var TOTAL_STEPS = 800;
    var BATCH_PER_FRAME = 100;
    var TYPING_SPEED_MS = 18;
    var DB_NAME = 'CafeLLMFullEvolutionDB';
    var DB_STORE = 'llmStateStore';
    var STORAGE_KEY = 'cafe_llm_full_evolution_v1';

    var statusContainer = document.getElementById('status-container');
    var trainStatusEl = document.getElementById('train-status');
    var progressBarEl = document.getElementById('progress-bar');
    var githubConfigPanel = document.getElementById('github-config-panel');
    var knowledgePanel = document.getElementById('knowledge-panel');
    var chatBox = document.getElementById('chat-box');
    var promptInput = document.getElementById('prompt-input');
    var generateBtn = document.getElementById('generate-btn');

    var llmModel = null;
    var isLearningNow = false;
    var ghSyncStatus = '待機中';

    var memoryStore = {
      topics: [],
      corpusText: '',
      chatHistory: [],
      lastDiscussedTopic: '',
      lastTopicOffset: 0,
      userProfile: {
        name: '',
        likes: [],
        facts: []
      },
      savedWeights: null
    };

    var githubWriteQueue = [];
    var isGitHubWriting = false;

    var AI_AVATAR_SVG = '<svg width="22" height="22" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">' +
      '<path d="M22 17 Q20 12 22 8 M32 16 Q30 11 32 7 M42 17 Q40 12 42 8" stroke="#e67e22" stroke-width="4" stroke-linecap="round" fill="none"/>' +
      '<path d="M16 25 H44 V38 C44 46 38 50 30 50 C22 50 16 46 16 38 Z" fill="#8d6e63"/>' +
      '<path d="M44 28 H49 C52 28 54 30 54 33.5 C54 37 52 39 49 39 H44" stroke="#8d6e63" stroke-width="4.5" fill="none"/>' +
      '<circle cx="25" cy="35" r="2.8" fill="#ffffff"/>' +
      '<circle cx="35" cy="35" r="2.8" fill="#ffffff"/>' +
      '<path d="M27 41 Q30 44 33 41" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none"/>' +
      '</svg>';

    function getSavedToken() {
      try {
        return (localStorage.getItem(TOKEN_STORAGE_KEY) || '').trim();
      } catch (e) {
        return '';
      }
    }

    // ==========================================
    // 修正箇所1：制作者パスワード認証付き設定パネル開閉
    // ==========================================
    function toggleGitHubConfigPanel() {
      if (githubConfigPanel.style.display === 'block') {
        githubConfigPanel.style.display = 'none';
        return;
      }
      if (!isCreatorUnlocked) {
        var inputPw = prompt('🔒 制作者専用設定です。パスワードを入力してください：');
        if (inputPw === null) return;
        if (inputPw !== CREATOR_PASSWORD) {
          alert('❌ パスワードが違います。制作者のみアクセスできます。');
          return;
        }
        isCreatorUnlocked = true;
      }
      githubConfigPanel.style.display = 'block';
    }

    function saveNewGitHubToken() {
      var val = document.getElementById('gh-token-input').value.trim();
      if (!val) return;
      localStorage.setItem(TOKEN_STORAGE_KEY, val);
      document.getElementById('gh-token-input').value = '';
      document.getElementById('gh-badge').textContent = '✅ 保存完了！自動追記を開始します...';
      githubConfigPanel.style.display = 'none';
      if (memoryStore.corpusText) {
        enqueueGitHubWrite(memoryStore.corpusText.slice(-2000));
      }
    }

    function cleanWikipediaText(rawText) {
      if (!rawText) return '';
      return rawText
        .replace(/（[^（）]*）/g, '')
        .replace(/\([^()]*\)/g, '')
        .replace(/\[[^\]]*\]/g, '')
        .replace(/[「」『』【】()（）]/g, '')
        .replace(/\s+/g, '')
        .trim();
    }

    function utf8ToBase64(str) {
      return btoa(unescape(encodeURIComponent(str)));
    }
    function base64ToUtf8(b64) {
      return decodeURIComponent(escape(atob(b64.replace(/\n/g, ''))));
    }

    function enqueueGitHubWrite(newTextBlock) {
      if (!newTextBlock || !newTextBlock.trim()) return;
      githubWriteQueue.push(newTextBlock.trim());
      processGitHubWriteQueue();
    }

    async function processGitHubWriteQueue() {
      if (isGitHubWriting || githubWriteQueue.length === 0) return;
      var token = getSavedToken();
      if (!token) {
        ghSyncStatus = 'トークン未設定（🔒制作者設定から入力）';
        updateStatusDisplay();
        return;
      }

      isGitHubWriting = true;
      var blockToWrite = githubWriteQueue[0];
      var apiUrl = 'https://api.github.com/repos/' + GITHUB_OWNER + '/' + GITHUB_REPO + '/contents/' + GITHUB_TARGET_PATH;
      var headers = {
        'Authorization': 'Bearer ' + token,
        'Accept': 'application/vnd.github+json',
        'Content-Type': 'application/json'
      };

      var maxRetries = 3;
      var success = false;

      for (var attempt = 1; attempt <= maxRetries; attempt++) {
        try {
          ghSyncStatus = 'GitHub書き込み中(' + attempt + '回目)...';
          updateStatusDisplay();

          var sha = null;
          var currentRemoteText = '';
          var getRes = await fetch(apiUrl + '?nocache=' + Date.now() + '_' + Math.random(), {
            headers: headers,
            cache: 'no-store'
          });

          if (getRes.ok) {
            var fileInfo = await getRes.json();
            sha = fileInfo.sha;
            if (fileInfo.content) {
              currentRemoteText = base64ToUtf8(fileInfo.content);
            }
          } else if (getRes.status === 401 || getRes.status === 403) {
            var authErr = await getRes.json();
            ghSyncStatus = 'トークン無効/権限不足(' + (authErr.message || getRes.status) + ')';
            updateStatusDisplay();
            break;
          }

          if (currentRemoteText.indexOf(blockToWrite.slice(0, 25)) !== -1) {
            success = true;
            break;
          }

          var updatedText = (currentRemoteText ? currentRemoteText.trim() + '\n\n' : '') + blockToWrite;
          var putBody = {
            message: 'Auto-learn: 新しい知識をknowledge.txtに自動追記',
            content: utf8ToBase64(updatedText)
          };
          if (sha) putBody.sha = sha;

          var putRes = await fetch(apiUrl, {
            method: 'PUT',
            headers: headers,
            body: JSON.stringify(putBody)
          });

          if (putRes.ok) {
            success = true;
            break;
          } else if (putRes.status === 409 || putRes.status === 422) {
            await new Promise(function(r) { setTimeout(r, 1200); });
            continue;
          } else {
            var errData = await putRes.json();
            ghSyncStatus = 'GitHubエラー(' + (errData.message || putRes.status) + ')';
            updateStatusDisplay();
            break;
          }
        } catch (e) {
          await new Promise(function(r) { setTimeout(r, 1500); });
        }
      }

      if (success) {
        githubWriteQueue.shift();
        ghSyncStatus = githubWriteQueue.length > 0
          ? 'GitHub追記中(残り' + githubWriteQueue.length + '件)...'
          : 'GitHub自動追記成功✅';
        updateStatusDisplay();
      } else {
        ghSyncStatus = 'GitHub再試行待機中(未送信' + githubWriteQueue.length + '件)';
        updateStatusDisplay();
      }

      isGitHubWriting = false;

      if (success && githubWriteQueue.length > 0) {
        setTimeout(processGitHubWriteQueue, 1000);
      }
    }

    function updateStatusDisplay() {
      var vocabCount = llmModel ? llmModel.vocabSize : 0;
      trainStatusEl.textContent = '🧠 語彙:' + vocabCount + '語 / 知識:' + memoryStore.corpusText.length.toLocaleString() + '文字（' + memoryStore.topics.length + 'テーマ）｜' + ghSyncStatus;
    }

    function openMemoryDB() {
      return new Promise(function(resolve) {
        if (!window.indexedDB) { resolve(null); return; }
        var req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = function(e) {
          var db = e.target.result;
          if (!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
        };
        req.onsuccess = function(e) { resolve(e.target.result); };
        req.onerror = function() { resolve(null); };
      });
    }

    async function loadFromUnlimitedStorage() {
      var db = await openMemoryDB();
      if (db) {
        var loaded = await new Promise(function(resolve) {
          try {
            var tx = db.transaction(DB_STORE, 'readonly');
            var getReq = tx.objectStore(DB_STORE).get('main');
            getReq.onsuccess = function() { resolve(getReq.result || null); };
            getReq.onerror = function() { resolve(null); };
          } catch (e) { resolve(null); }
        });
        if (loaded && loaded.corpusText) return loaded;
      }
      try {
        var savedJson = localStorage.getItem(STORAGE_KEY);
        if (savedJson) return JSON.parse(savedJson);
      } catch (e) {}
      return null;
    }

    async function saveToPermanentMemory() {
      if (memoryStore.chatHistory.length > 30) {
        memoryStore.chatHistory = memoryStore.chatHistory.slice(-30);
      }
      if (llmModel) {
        memoryStore.savedWeights = llmModel.exportWeights();
      }
      var db = await openMemoryDB();
      if (db) {
        try {
          var tx = db.transaction(DB_STORE, 'readwrite');
          tx.objectStore(DB_STORE).put(memoryStore, 'main');
        } catch (e) {}
      }
      try {
        var lightCopy = Object.assign({}, memoryStore, { savedWeights: null });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(lightCopy));
      } catch (e) {}
    }

    function tokenizeJapanese(text) {
      if (!text) return [];
      var pattern = /[一-龠々〆ヵヶ]+|[ァ-ヴー]+|[a-zA-Z0-9_]+|[ぁ-ん]+|[。、！？\n]/g;
      var matches = text.match(pattern);
      return matches ? matches : Array.from(text);
    }

    function CafeDeepLLM(text, previousWeights) {
      var sampleText = text.slice(-50000);
      var rawTokens = tokenizeJapanese(sampleText);

      var freqMap = {};
      for (var i = 0; i < rawTokens.length; i++) {
        var tk = rawTokens[i];
        freqMap[tk] = (freqMap[tk] || 0) + 1;
      }

      var sortedTokens = Object.keys(freqMap).sort(function(a, b) {
        return freqMap[b] - freqMap[a];
      }).slice(0, MAX_VOCAB_SIZE - 1);

      this.vocab = ['<UNK>'].concat(sortedTokens);
      this.vocabSize = this.vocab.length;
      this.tokenToId = {};
      this.idToToken = {};
      var self = this;
      this.vocab.forEach(function(tok, idx) {
        self.tokenToId[tok] = idx;
        self.idToToken[idx] = tok;
      });

      this.data = rawTokens.map(function(tok) {
        return (self.tokenToId[tok] !== undefined) ? self.tokenToId[tok] : 0;
      });

      this.tokenEmbed = this.createMatrix(this.vocabSize, EMBED_DIM);
      this.posEmbed = this.createMatrix(CONTEXT_SIZE, EMBED_DIM);

      this.Wq1 = this.createMatrix(EMBED_DIM, EMBED_DIM);
      this.Wk1 = this.createMatrix(EMBED_DIM, EMBED_DIM);
      this.Wv1 = this.createMatrix(EMBED_DIM, EMBED_DIM);

      this.Wq2 = this.createMatrix(EMBED_DIM, EMBED_DIM);
      this.Wk2 = this.createMatrix(EMBED_DIM, EMBED_DIM);
      this.Wv2 = this.createMatrix(EMBED_DIM, EMBED_DIM);

      this.Wout = this.createMatrix(EMBED_DIM, this.vocabSize);

      if (previousWeights) {
        this.importWeights(previousWeights);
      }
    }

    CafeDeepLLM.prototype.createMatrix = function(rows, cols) {
      var scale = Math.sqrt(2.0 / (rows + cols));
      var mat = [];
      for (var r = 0; r < rows; r++) {
        var row = [];
        for (var c = 0; c < cols; c++) {
          row.push((Math.random() * 2 - 1) * scale);
        }
        mat.push(row);
      }
      return mat;
    };

    CafeDeepLLM.prototype.exportWeights = function() {
      return {
        vocab: this.vocab,
        tokenEmbed: this.tokenEmbed,
        posEmbed: this.posEmbed,
        Wq1: this.Wq1,
        Wk1: this.Wk1,
        Wv1: this.Wv1,
        Wq2: this.Wq2,
        Wk2: this.Wk2,
        Wv2: this.Wv2,
        Wout: this.Wout
      };
    };

    CafeDeepLLM.prototype.importWeights = function(saved) {
      if (!saved || !saved.vocab) return;
      if (saved.posEmbed && saved.posEmbed.length === CONTEXT_SIZE) this.posEmbed = saved.posEmbed;
      if (saved.Wq1) this.Wq1 = saved.Wq1;
      if (saved.Wk1) this.Wk1 = saved.Wk1;
      if (saved.Wv1) this.Wv1 = saved.Wv1;
      if (saved.Wq2) this.Wq2 = saved.Wq2;
      if (saved.Wk2) this.Wk2 = saved.Wk2;
      if (saved.Wv2) this.Wv2 = saved.Wv2;

      var oldMap = {};
      for (var i = 0; i < saved.vocab.length; i++) {
        oldMap[saved.vocab[i]] = i;
      }
      for (var newId = 0; newId < this.vocab.length; newId++) {
        var tok = this.vocab[newId];
        var oldId = oldMap[tok];
        if (oldId !== undefined && saved.tokenEmbed[oldId]) {
          this.tokenEmbed[newId] = saved.tokenEmbed[oldId].slice();
          for (var d = 0; d < EMBED_DIM; d++) {
            if (saved.Wout[d] && saved.Wout[d][oldId] !== undefined) {
              this.Wout[d][newId] = saved.Wout[d][oldId];
            }
          }
        }
      }
    };

    CafeDeepLLM.prototype.softmax = function(arr) {
      var maxVal = Math.max.apply(null, arr);
      var exps = arr.map(function(v) { return Math.exp(v - maxVal); });
      var sum = exps.reduce(function(a, b) { return a + b; }, 0);
      return exps.map(function(e) { return e / sum; });
    };

    CafeDeepLLM.prototype.matMul = function(A, B) {
      var rowsA = A.length;
      var colsA = A[0].length;
      var colsB = B[0].length;
      var result = [];
      for (var i = 0; i < rowsA; i++) {
        result.push(new Array(colsB).fill(0));
        for (var k = 0; k < colsA; k++) {
          for (var j = 0; j < colsB; j++) {
            result[i][j] += A[i][k] * B[k][j];
          }
        }
      }
      return result;
    };

    CafeDeepLLM.prototype.runSelfAttentionLayer = function(X, Wq, Wk, Wv) {
      var seqLen = X.length;
      var Q = this.matMul(X, Wq);
      var K = this.matMul(X, Wk);
      var V = this.matMul(X, Wv);
      var scale = Math.sqrt(EMBED_DIM);
      var out = [];

      for (var i = 0; i < seqLen; i++) {
        var scores = [];
        for (var j = 0; j <= i; j++) {
          var dot = 0;
          for (var d = 0; d < EMBED_DIM; d++) dot += Q[i][d] * K[j][d];
          scores.push(dot / scale);
        }
        var weights = this.softmax(scores);
        var vec = new Array(EMBED_DIM).fill(0);
        for (var j2 = 0; j2 <= i; j2++) {
          var w = weights[j2];
          for (var d2 = 0; d2 < EMBED_DIM; d2++) {
            vec[d2] += w * V[j2][d2];
          }
        }
        out.push(vec.map(function(v, d) {
          var sumVal = v + X[i][d];
          return sumVal > 0 ? sumVal : sumVal * 0.1;
        }));
      }
      return out;
    };

    CafeDeepLLM.prototype.forward = function(inputIds) {
      var seqLen = inputIds.length;
      var self = this;
      var X0 = inputIds.map(function(id, pos) {
        return self.tokenEmbed[id].map(function(val, d) { return val + self.posEmbed[pos][d]; });
      });

      var H1 = this.runSelfAttentionLayer(X0, this.Wq1, this.Wk1, this.Wv1);
      var H2 = this.runSelfAttentionLayer(H1, this.Wq2, this.Wk2, this.Wv2);

      var lastHidden = H2[seqLen - 1];
      var logits = new Array(this.vocabSize).fill(0);
      for (var v = 0; v < this.vocabSize; v++) {
        for (var d3 = 0; d3 < EMBED_DIM; d3++) {
          logits[v] += lastHidden[d3] * this.Wout[d3][v];
        }
      }
      return { logits: logits, lastHidden: lastHidden, H1: H1, X0: X0, seqLen: seqLen };
    };

    CafeDeepLLM.prototype.trainStep = function() {
      if (this.data.length <= CONTEXT_SIZE + 1) return 0;
      var startIdx = Math.floor(Math.random() * (this.data.length - CONTEXT_SIZE));
      var inputIds = this.data.slice(startIdx, startIdx + CONTEXT_SIZE);
      var targetId = this.data[startIdx + CONTEXT_SIZE];

      var cache = this.forward(inputIds);
      var probs = this.softmax(cache.logits);
      var loss = -Math.log(Math.max(probs[targetId], 1e-7));

      var dLogits = probs.slice();
      dLogits[targetId] -= 1.0;

      var dHidden = new Array(EMBED_DIM).fill(0);
      for (var d = 0; d < EMBED_DIM; d++) {
        for (var v = 0; v < this.vocabSize; v++) {
          dHidden[d] += dLogits[v] * this.Wout[d][v];
          this.Wout[d][v] -= LEARNING_RATE * cache.lastHidden[d] * dLogits[v];
        }
      }

      var lastPos = cache.seqLen - 1;
      var lastTokenId = inputIds[lastPos];
      for (var d2 = 0; d2 < EMBED_DIM; d2++) {
        var grad = dHidden[d2];
        this.tokenEmbed[lastTokenId][d2] -= LEARNING_RATE * grad;
        this.posEmbed[lastPos][d2] -= LEARNING_RATE * grad;

        for (var d3 = 0; d3 < EMBED_DIM; d3++) {
          this.Wv2[d3][d2] -= LEARNING_RATE * 0.4 * cache.H1[lastPos][d3] * grad;
          this.Wq2[d3][d2] -= LEARNING_RATE * 0.2 * cache.H1[lastPos][d3] * grad;
          this.Wk2[d3][d2] -= LEARNING_RATE * 0.2 * cache.H1[lastPos][d3] * grad;
          this.Wv1[d3][d2] -= LEARNING_RATE * 0.25 * cache.X0[lastPos][d3] * grad;
          this.Wq1[d3][d2] -= LEARNING_RATE * 0.1 * cache.X0[lastPos][d3] * grad;
          this.Wk1[d3][d2] -= LEARNING_RATE * 0.1 * cache.X0[lastPos][d3] * grad;
        }
      }
      return loss;
    };

    CafeDeepLLM.prototype.generateTokenContinuation = function(seedText, maxTokens) {
      if (!maxTokens) maxTokens = 16;
      var tokens = tokenizeJapanese(seedText);
      var self = this;
      var ids = tokens.map(function(t) { return self.tokenToId[t] !== undefined ? self.tokenToId[t] : 0; });
      if (ids.length === 0) ids = [1];

      var generated = [];
      for (var step = 0; step < maxTokens; step++) {
        var ctx = ids.slice(-CONTEXT_SIZE);
        var res = this.forward(ctx);
        var scaledLogits = res.logits.map(function(l, idx) {
          return idx === 0 ? -1e9 : l / 0.75;
        });
        var probs = this.softmax(scaledLogits);
        var r = Math.random();
        var cum = 0;
        var chosen = 1;
        for (var v = 1; v < probs.length; v++) {
          cum += probs[v];
          if (r <= cum) {
            chosen = v;
            break;
          }
        }
        ids.push(chosen);
        var word = this.idToToken[chosen];
        generated.push(word);
        if (word === '。' && generated.length >= 6) break;
      }
      return generated.join('');
    };

    async function fetchRandomWebArticles() {
      var randomUrl = 'https://ja.wikipedia.org/w/api.php?action=query&generator=random&grnnamespace=0&grnlimit=' + FETCH_ARTICLE_COUNT + '&prop=extracts&exintro&explaintext&format=json&origin=*';
      var res = await fetch(randomUrl);
      var data = await res.json();
      var pages = (data.query && data.query.pages) ? data.query.pages : {};
      var keys = Object.keys(pages);

      var structuredBlocks = [];
      var titles = [];
      for (var i = 0; i < keys.length; i++) {
        var pId = keys[i];
        var title = pages[pId].title;
        var cleanBody = cleanWikipediaText(pages[pId].extract);
        if (cleanBody.length > 12) {
          titles.push(title);
          structuredBlocks.push('【テーマ：' + title + '】\n・' + title + '：' + cleanBody);
        }
      }

      var collectedText = structuredBlocks.join('\n\n');
      if (collectedText.trim().length <= 15) {
        collectedText = '【テーマ：森の喫茶店】\n・喫茶店：森の奥にある小さな喫茶店では、いつも温かいミルクティーの香りが漂っていました。';
        titles = ['森の喫茶店'];
      }
      return { text: collectedText.trim(), titles: titles };
    }

    // ==========================================
    // 修正箇所3：Wikipediaの正式記事タイトルを最優先で正確に取得
    // ==========================================
    async function fetchTopicFromWikipedia(topicQuery) {
      var exactUrl = 'https://ja.wikipedia.org/w/api.php?action=query&titles=' + encodeURIComponent(topicQuery) + '&redirects=1&prop=extracts&exintro&explaintext&format=json&origin=*';
      var res = await fetch(exactUrl);
      var data = await res.json();
      var pages = (data.query && data.query.pages) ? data.query.pages : {};
      var keys = Object.keys(pages);

      var hasValidExact = false;
      for (var j = 0; j < keys.length; j++) {
        if (Number(keys[j]) > 0 && pages[keys[j]].extract && pages[keys[j]].extract.trim().length > 15) {
          hasValidExact = true;
          break;
        }
      }

      if (!hasValidExact) {
        var searchUrl = 'https://ja.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=' + encodeURIComponent(topicQuery) + '&gsrlimit=2&prop=extracts&exintro&explaintext&format=json&origin=*';
        res = await fetch(searchUrl);
        data = await res.json();
        pages = (data.query && data.query.pages) ? data.query.pages : {};
        keys = Object.keys(pages);
      }

      var structuredBlocks = [];
      var titles = [];
      var summaryForReply = '';

      for (var i = 0; i < keys.length; i++) {
        var pId = keys[i];
        if (Number(pId) < 0) continue;
        var title = pages[pId].title;
        var cleanBody = cleanWikipediaText(pages[pId].extract);
        if (cleanBody.length > 10) {
          titles.push(title);
          structuredBlocks.push('【テーマ：' + title + '】\n・' + title + '：' + cleanBody);
          if (!summaryForReply) {
            summaryForReply = cleanBody.split('。').slice(0, 3).join('。') + '。';
          }
        }
      }

      return {
        text: structuredBlocks.join('\n\n').trim(),
        titles: titles,
        summaryForReply: summaryForReply
      };
    }

    // ==========================================
    // 修正箇所2：テーマ名が完全一致する本物の記事だけを優先ヒットさせる
    // ==========================================
    function searchMultiFactsInMemory(keywords, sentenceOffset, requireExactTopic) {
      if (sentenceOffset === undefined) sentenceOffset = 0;
      var lines = memoryStore.corpusText.split('\n');
      var scoredMatches = [];

      for (var l = 0; l < lines.length; l++) {
        var line = lines[l].trim();
        if (!line || line.indexOf('【テーマ：') === 0) continue;

        var colonIdx = line.indexOf('：');
        var topicName = colonIdx !== -1 ? line.slice(0, colonIdx).replace(/^・/, '').trim() : '知識メモ';
        var rawFact = colonIdx !== -1 ? line.slice(colonIdx + 1).trim() : line.replace(/^・/, '');

        var score = 0;
        for (var k = 0; k < keywords.length; k++) {
          var kw = keywords[k];
          if (!kw) continue;
          if (topicName === kw) {
            score += 100;
          } else if (topicName.indexOf(kw) !== -1 && topicName.length <= kw.length + 3) {
            score += 40;
          } else if (!requireExactTopic && rawFact.indexOf(kw) !== -1) {
            score += 2;
          }
        }

        if (score > 0) {
          var sentences = rawFact.split('。').filter(function(s) { return s.trim().length > 0; });
          var start = sentenceOffset < sentences.length ? sentenceOffset : 0;
          var excerpt = sentences.slice(start, start + 3).join('。') + '。';
          scoredMatches.push({ topic: topicName, text: excerpt, score: score });
        }
      }

      scoredMatches.sort(function(a, b) { return b.score - a.score; });
      return scoredMatches.slice(0, 3);
    }

    function extractAndSaveUserMemory(trimmedInput) {
      if (!memoryStore.userProfile) {
        memoryStore.userProfile = { name: '', likes: [], facts: [] };
      }
      var nameMatch = trimmedInput.match(/^(?:私|僕|俺|わたし|ぼく|おれ)(?:の名前)?は([^\s。！!？?、]+?)(?:と申します|といいます|っていう|です|だよ|だ)[。！!？?]*$/);
      if (!nameMatch) {
        nameMatch = trimmedInput.match(/^([^\s。！!？?、]+?)と申します[。！!？?]*$/);
      }
      if (nameMatch && nameMatch[1]) {
        memoryStore.userProfile.name = nameMatch[1];
        return 'はじめまして、' + memoryStore.userProfile.name + 'さん！お名前を長期メモリにしっかり刻みました☕ これからもよろしくお願いします！';
      }

      var likeMatch = trimmedInput.match(/(?:私|僕|俺|わたし|ぼく|おれ)は([^\s。！!？?、]+)が(?:好き|大好き|趣味)/);
      if (likeMatch && likeMatch[1]) {
        var item = likeMatch[1];
        if (memoryStore.userProfile.likes.indexOf(item) === -1) {
          memoryStore.userProfile.likes.push(item);
        }
        return 'なるほど、「' + item + '」がお好きなんですね☕ あなたの好みとして長期メモリに記憶しました！';
      }
      return '';
    }

    async function generateFullLLMReply(userInput) {
      var trimmed = userInput.trim();
      var normalized = trimmed.replace(/[（(][^）)]*[）)]/g, '').replace(/[！!？?。、\s]/g, '');
      var userNamePrefix = (memoryStore.userProfile && memoryStore.userProfile.name)
        ? memoryStore.userProfile.name + 'さん、'
        : '';

      var learnedUserNote = extractAndSaveUserMemory(trimmed);
      if (learnedUserNote) {
        saveToPermanentMemory();
        return learnedUserNote;
      }

      if (/^(こんにちは|こんにちわ|こんばんは|こんばんわ|おはよう|おはようございます|やあ|ハロー|はじめまして|よろしく|おっす|ちわ)/.test(normalized)) {
        var pressureNote = (trimmed.indexOf('圧') !== -1) ? '（ビシッ！と背筋を伸ばしてご挨拶します！☕）\n' : '';
        var vocabCount = llmModel ? llmModel.vocabSize : 0;
        var likeHint = (memoryStore.userProfile && memoryStore.userProfile.likes.length > 0)
          ? 'そういえば「' + memoryStore.userProfile.likes[0] + '」がお好きでしたよね！'
          : 'どんなテーマでも調べて比較・推論できるよ！';
        return pressureNote + userNamePrefix + 'こんにちは！単語トークナイザー＆2層Transformer搭載の「カフェ・LLM」へようこそ☕\n現在 ' + vocabCount + '語の単語辞書と ' + memoryStore.corpusText.length.toLocaleString() + '文字の知識を保持しています。' + likeHint;
      }

      if (/名前|好み|好きなもの|覚えてる/.test(normalized) && /私|僕|俺|わたし|ぼく|おれ/.test(normalized)) {
        var uName = memoryStore.userProfile.name || 'まだ聞いていないみたい';
        var uLikes = memoryStore.userProfile.likes.length > 0 ? memoryStore.userProfile.likes.join('・') : 'まだ登録なし';
        return 'もちろん長期メモリに覚えていますよ☕\n・お名前：' + uName + '\n・好きなもの：' + uLikes + '\n（「私は〇〇と申します」「〇〇が好き」と教えてくれたらいつでも更新するよ！）';
      }

      if (/^(ありがとう|ありがとうございます|サンキュー|助かった|すごい|賢い|いいね|最高|なるほど|へー|そうなんだ|面白い|おもしろい)/.test(normalized)) {
        if (memoryStore.lastDiscussedTopic) {
          return userNamePrefix + 'そう言ってもらえると嬉しいです☕ さっきの「' + memoryStore.lastDiscussedTopic + '」について、さらに詳しく掘り下げたり、別のテーマと比較したりもできますよ！';
        }
        return userNamePrefix + 'ありがとうございます！そう言っていただけるとLLMとしての学習意欲がどんどん湧いてきます☕';
      }

      if (/疲れた|ねむい|眠い|お腹すいた|おなかすいた|暇|ひま|元気|調子はどう|どう思う|おすすめ/.test(normalized)) {
        if (/疲れた|ねむい|眠い/.test(normalized)) {
          return userNamePrefix + 'お疲れさまです☕ そういうときは温かいコーヒーでも飲んで一息つきましょう！気分転換に何か面白い雑学でも調べてお話ししましょうか？';
        }
        if (/お腹すいた|おなかすいた/.test(normalized)) {
          return userNamePrefix + 'お腹がすくとエネルギーが出ませんよね☕ カフェの焼きたてパンケーキが恋しくなる時間です！好きな食べ物の歴史でも調べてみましょうか？';
        }
        if (/暇|ひま|おすすめ/.test(normalized)) {
          var fav = (memoryStore.userProfile.likes && memoryStore.userProfile.likes[0]) || memoryStore.topics[Math.floor(Math.random() * memoryStore.topics.length)] || '宇宙';
          return userNamePrefix + 'そんなときは知識の探検に出ましょう☕ 「' + fav + 'について教えて」や「宇宙と地球の違い」みたいに聞いてくれたら、LLMが複数の知識を組み合わせて解説するよ！';
        }
        return userNamePrefix + '私は今日も2層Transformerを回転させて絶好調です☕ 今日はどんなテーマを調査・推論しましょうか？';
      }

      if (/^(自己紹介|あなたは誰|君は誰|何ができる|機能)/.test(normalized)) {
        return '私は全方向進化型「カフェ・LLM」です☕\n1. 【単語トークン＆2層Transformer】文字ではなく単語単位で文脈を学習し、脳みそ（重み）を永久保存します\n2. 【横断RAG推論】「AとBの違い」「〇〇と△△の共通点」のように複数テーマを比較・統合して答えます\n3. 【長期パーソナルメモリ】「私は〇〇と申します」「〇〇が好き」を覚えて会話に活かします！';
      }

      // 比較推論モード（「宇宙と地球の違い」など：テーマ名一致の正確な記事だけを使う！）
      var compareMatch = trimmed.match(/^(.+?)と(.+?)(?:の|について|を)?(?:違い|共通点|比較|関係|どっち|比べて)/);
      if (compareMatch && compareMatch[1] && compareMatch[2]) {
        var topicA = compareMatch[1].replace(/^(?:ねえ|あの|ところで)/, '').trim();
        var topicB = compareMatch[2].trim();
        memoryStore.lastDiscussedTopic = topicA;

        var resA = searchMultiFactsInMemory([topicA], 0, true)[0];
        if (!resA) {
          var fetchedA = await fetchTopicFromWikipedia(topicA);
          if (fetchedA.text && fetchedA.titles.length > 0) {
            trainAndGrowMemory(fetchedA.text, fetchedA.titles, null, true);
            resA = { topic: fetchedA.titles[0], text: fetchedA.summaryForReply };

          var fetchedB = await fetchTopicFromWikipedia(topicB);

            trainAndGrowMemory(fetchedB.text, fetchedB.titles, null, true);
            resB = { topic: fetchedB.titles[0], text: fetchedB.summaryForReply };
          }
        }

        if (resA && resB) {
          return userNamePrefix + '「' + topicA + '」と「' + topicB + '」の2つの知識を横断検索して比較推論しました☕\n\n' +
            '■ 【' + resA.topic + '】の特徴：\n' + resA.text + '\n\n' +
            '■ 【' + resB.topic + '】の特徴：\n' + resB.text + '\n\n' +
            '💡 【LLM統合まとめ】：\n「' + resA.topic + '」と「' + resB.topic + '」はそれぞれ独自の性質やスケールを持っていますが、互いに関わり合いながら私たちの世界を形作っています。さらに詳しく知りたい方はどちらかを指定してくださいね！';
        }
      }

      if (/^(もっと詳しく|もっと教えて|続き|つづき|それで|それから|詳しく|詳細)/.test(normalized)) {
        if (memoryStore.lastDiscussedTopic) {
          memoryStore.lastTopicOffset = (memoryStore.lastTopicOffset || 0) + 3;
          var moreMatches = searchMultiFactsInMemory([memoryStore.lastDiscussedTopic], memoryStore.lastTopicOffset, true);
          if (moreMatches.length > 0 && moreMatches[0].text) {
            return userNamePrefix + '「' + memoryStore.lastDiscussedTopic + '」の続きですね☕ 記憶にあるさらに詳しい情報をお伝えします！\n\n' + moreMatches[0].text;
          } else {
            return userNamePrefix + '「' + memoryStore.lastDiscussedTopic + '」について今持っているメモはここまでです☕ 「' + memoryStore.lastDiscussedTopic + 'の文章を作って」と頼んでくれたら、これまでの知識を統合して紹介文を作成しますよ！';
          }
        }
      }

      var writeMatch = trimmed.match(/^(.+?)(?:の|についての|に関する)?(?:文章|作文|紹介文|解説文|物語|ストーリー|スピーチ|まとめ)を?(?:作って|書いて|作成して|考えて|お願い)/);
      if (writeMatch && writeMatch[1]) {
        var rawWriteTopic = writeMatch[1].trim();
        var writeTopic = (/^(それ|これ|あれ|その|この|さっきの)$/.test(rawWriteTopic) && memoryStore.lastDiscussedTopic)
          ? memoryStore.lastDiscussedTopic
          : rawWriteTopic;

        memoryStore.lastDiscussedTopic = writeTopic;
        var matchesForWrite = searchMultiFactsInMemory([writeTopic], 0, true);
        var fact = matchesForWrite.length > 0 ? matchesForWrite[0].text : '';
        if (!fact) {
          try {
            var fetchedTopic = await fetchTopicFromWikipedia(writeTopic);
            if (fetchedTopic.text && fetchedTopic.titles.length > 0) {
              fact = fetchedTopic.summaryForReply;
              trainAndGrowMemory(fetchedTopic.text, fetchedTopic.titles, null, true);
            }
          } catch (e) {}
        }

        var llmCreativeTail = llmModel ? llmModel.generateTokenContinuation(writeTopic, 10) : '';
        if (fact) {
          return '【「' + writeTopic + '」についてのLLM統合解説文】\n\nみなさんは「' + writeTopic + '」についてご存知でしょうか。' + fact + 'このように、' + writeTopic + 'には奥深い背景と魅力があります。（LLM連想フレーズ：「' + writeTopic + llmCreativeTail + '」）';
        } else {
          return '【「' + writeTopic + '」をテーマにした文章】\n\n静かなカフェの窓辺で温かいコーヒーを飲みながら、「' + writeTopic + '」について思いを巡らせてみました。（LLM連想フレーズ：「' + writeTopic + llmCreativeTail + '」）';
        }
      }

      var isExplicitQuery = /(?:について|とは|ってなに|って何|調べて|学んで|勉強して|検索して|学習して|教えて|解説して|説明して|知ってる|知りたい|[？?])/.test(trimmed);
      var isShortNounInput = (normalized.length >= 2 && normalized.length <= 10 && !/(?:ですね|だよ|だな|ます|ました|はは|笑|！|!|だめ|もう)/.test(trimmed));

      if (isExplicitQuery || isShortNounInput) {
        var queryClean = trimmed
          .replace(/(?:について|を|とは|って|ってなに|って何|のことも)?(?:調べて|学んで|勉強して|検索して|学習して|教えて|解説して|説明して|知ってる|知りたい|何|なに|ですか|だよね|かな)[？?！!。]*$/g, '')
          .replace(/[？?！!。、]/g, ' ')
          .trim();

        var keywords = queryClean.split(/\s+/).filter(function(w) { return w.length >= 2; });
        var targetKeyword = keywords[0] || normalized;

        if (targetKeyword && targetKeyword.length >= 2) {
          memoryStore.lastDiscussedTopic = targetKeyword;
          memoryStore.lastTopicOffset = 0;

          var ragMatches = searchMultiFactsInMemory(keywords.length > 0 ? keywords : [targetKeyword], 0, true);
          if (ragMatches.length > 0) {
            var replyBody = userNamePrefix + '「' + targetKeyword + '」についてknowledge.txtの知識ベースから正確な記事を見つけました☕\n\n' +
              '■ 【' + ragMatches[0].topic + '】\n' + ragMatches[0].text;
            if (ragMatches.length > 1) {
              replyBody += '\n\n🔗 【関連する記憶：' + ragMatches[1].topic + '】\n' + ragMatches[1].text;
            }
            return replyBody;
          }

          trainStatusEl.textContent = '🔍 Wikipediaで「' + targetKeyword + '」を自動調査＆LLM学習中...';
          try {
            var topicData = await fetchTopicFromWikipedia(targetKeyword);
            if (topicData.text && topicData.titles.length > 0) {
              trainAndGrowMemory(topicData.text, topicData.titles, null, true);
              return userNamePrefix + '「' + targetKeyword + '」についてWikipediaから新しく調査し、knowledge.txtと2層Transformerの脳みそに記憶しました☕\n\n【調査結果：' + topicData.titles[0] + '】\n' + topicData.summaryForReply;
            }
          } catch (e) {}
        }
      }

      var neuralHint = llmModel ? llmModel.generateTokenContinuation(trimmed, 8) : '';
      return userNamePrefix + 'あはは、「' + trimmed + '」ですね☕ 思わず笑っちゃいました！（LLMの連想：「' + neuralHint + '」）\n何か調べてほしい言葉があるときは「〇〇について教えて」や「〇〇とは？」と聞いてくれたら今度はバッチリ正確に調べてきますよ！';
    }

    function addMessageImmediate(text, sender) {
      if (sender === 'user') {
        var div = document.createElement('div');
        div.className = 'message user-msg';
        div.textContent = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
        return div;
      } else {
        var row = document.createElement('div');
        row.className = 'ai-row';
        var avatar = document.createElement('div');
        avatar.className = 'ai-avatar';
        avatar.innerHTML = AI_AVATAR_SVG;
        var bubble = document.createElement('div');
        bubble.className = 'message ai-msg';
        bubble.textContent = text;
        row.appendChild(avatar);
        row.appendChild(bubble);
        chatBox.appendChild(row);
        chatBox.scrollTop = chatBox.scrollHeight;
        return bubble;
      }
    }

    function addMessageWithTyping(text, sender, callback) {
      var row = document.createElement('div');
      row.className = 'ai-row';
      var avatar = document.createElement('div');
      avatar.className = 'ai-avatar';
      avatar.innerHTML = AI_AVATAR_SVG;
      var div = document.createElement('div');
      div.className = 'message ai-msg typing-cursor';
      row.appendChild(avatar);
      row.appendChild(div);
      chatBox.appendChild(row);

      var chars = Array.from(text);
      var idx = 0;
      function typeNext() {
        if (idx < chars.length) {
          div.textContent += chars[idx];
          idx++;
          chatBox.scrollTop = chatBox.scrollHeight;
          setTimeout(typeNext, TYPING_SPEED_MS);
        } else {
          div.classList.remove('typing-cursor');
          if (callback) callback();
        }
      }
      typeNext();
    }

    function toggleKnowledgePanel() {
      if (knowledgePanel.style.display === 'block') {
        knowledgePanel.style.display = 'none';
      } else {
        knowledgePanel.style.display = 'block';
        renderKnowledgePanel();
      }
    }

    function renderKnowledgePanel() {
      var previewText = memoryStore.corpusText.slice(-3000);
      var prefixNote = memoryStore.corpusText.length > 3000 ? '（※最新の3,000文字を抜粋表示中）\n\n' : '';
      var vocabSize = llmModel ? llmModel.vocabSize : 0;
      var userName = (memoryStore.userProfile && memoryStore.userProfile.name) || '未登録';
      var userLikes = (memoryStore.userProfile && memoryStore.userProfile.likes.length > 0) ? memoryStore.userProfile.likes.join(' / ') : '未登録';

      knowledgePanel.innerHTML =
        '<strong>🧠 カフェ・LLM 脳みそ＆長期メモリ状態:</strong><br>' +
        '・単語トークナイザー語彙数: <b>' + vocabSize + '語</b>（2層Transformer重み永続保存中）<br>' +
        '・長期パーソナル記憶: 名前=<b>' + userName + '</b> / 好み=<b>' + userLikes + '</b><br>' +
        '・knowledge.txt総量: <b>' + memoryStore.corpusText.length.toLocaleString() + '文字</b>（' + memoryStore.topics.length + 'テーマ）<br>' +
        '<span style="color:#8d6e63;font-size:0.75rem;">最近学んだテーマ: ' + (memoryStore.topics.slice(-10).join(' / ') || 'なし') + '</span><br><br>' +
        prefixNote + (previewText || 'まだ学習データがありません');
    }

    async function fetchGitHubKnowledgeFile() {
      var token = getSavedToken();
      if (token) {
        try {
          var apiUrl = 'https://api.github.com/repos/' + GITHUB_OWNER + '/' + GITHUB_REPO + '/contents/' + GITHUB_TARGET_PATH + '?nocache=' + Date.now();
          var res = await fetch(apiUrl, {
            headers: {
              'Authorization': 'Bearer ' + token,
              'Accept': 'application/vnd.github+json'
            },
            cache: 'no-store'
          });
          if (res.ok) {
            var fileInfo = await res.json();
            if (fileInfo.content) {
              return base64ToUtf8(fileInfo.content).trim();
            }
          }
        } catch (e) {}
      }

      try {
        var rawRes = await fetch(GITHUB_KNOWLEDGE_FILE + '?t=' + Date.now());
        if (rawRes.ok) {
          var text = await rawRes.text();
          if (text && text.trim().length > 5) return text.trim();
        }
      } catch (e2) {}
      return '';
    }

    function trainAndGrowMemory(newText, newTitles, announceMessage, isSilentBackground, onComplete) {
      if (isLearningNow) {
        if (onComplete) onComplete();
        return;
      }
      isLearningNow = true;

      var isAdded = false;
      if (newText && memoryStore.corpusText.indexOf(newText.slice(0, 25)) === -1) {
        var combined = (memoryStore.corpusText ? memoryStore.corpusText + '\n\n' : '') + newText;
        memoryStore.corpusText = (MAX_MEMORY_CHARS === Infinity) ? combined : combined.slice(-MAX_MEMORY_CHARS);
        isAdded = true;
      }

      newTitles.forEach(function(t) {
        if (memoryStore.topics.indexOf(t) === -1) {
          memoryStore.topics.push(t);
        }
      });

      var prevWeights = llmModel ? llmModel.exportWeights() : memoryStore.savedWeights;
      var nextModel = new CafeDeepLLM(memoryStore.corpusText, prevWeights);
      var step = 0;

      function fastTrainLoop() {
        if (step >= TOTAL_STEPS) {
          llmModel = nextModel;
          isLearningNow = false;
          progressBarEl.style.width = '100%';
          updateStatusDisplay();
          promptInput.disabled = false;
          generateBtn.disabled = false;

          if (knowledgePanel.style.display === 'block') {
            renderKnowledgePanel();
          }

          saveToPermanentMemory();

          if (isAdded && newText) {
            enqueueGitHubWrite(newText);
          }

          if (announceMessage) {
            memoryStore.chatHistory.push({ sender: 'ai', text: announceMessage });
            saveToPermanentMemory();
            addMessageWithTyping(announceMessage, 'ai', onComplete);
          } else if (onComplete) {
            onComplete();
          }
          return;
        }

        for (var i = 0; i < BATCH_PER_FRAME && step < TOTAL_STEPS; i++) {
          nextModel.trainStep();
          step++;
        }

        var percent = Math.round((step / TOTAL_STEPS) * 100);
        progressBarEl.style.width = percent + '%';
        trainStatusEl.textContent = isSilentBackground
          ? '🔄 裏側で単語学習＆2層Transformer継続更新中... ' + percent + '%'
          : '⚡ 単語トークナイザー＆2層Transformer学習中... ' + percent + '%';

        setTimeout(fastTrainLoop, 5);
      }

      fastTrainLoop();
    }

    async function autoGrowInBackground() {
      if (githubWriteQueue.length > 0 && !isGitHubWriting) {
        processGitHubWriteQueue();
      }
      if (isLearningNow) return;
      try {
        trainStatusEl.textContent = '🌐 裏側で新しい知識を自動収集中...';
        var fetched = await fetchRandomWebArticles();
        trainAndGrowMemory(fetched.text, fetched.titles, null, true);
      } catch (e) {}
    }

    async function bootAI() {
      try {
        // 制作者以外には設定画面を見せないため、自動では開かない
        githubConfigPanel.style.display = 'none';

        var loaded = await loadFromUnlimitedStorage();
        if (loaded) {
          memoryStore = Object.assign({
            topics: [],
            corpusText: '',
            chatHistory: [],
            lastDiscussedTopic: '',
            lastTopicOffset: 0,
            userProfile: { name: '', likes: [], facts: [] },
            savedWeights: null
          }, loaded);
        }

        trainStatusEl.textContent = '📂 GitHub（280054-netizen/tomoAI）の knowledge.txt を読み込み中...';
        var githubText = await fetchGitHubKnowledgeFile();
        if (githubText && memoryStore.corpusText.indexOf(githubText.slice(0, 25)) === -1) {
          var merged = githubText + (memoryStore.corpusText ? '\n\n' + memoryStore.corpusText : '');
          memoryStore.corpusText = (MAX_MEMORY_CHARS === Infinity) ? merged : merged.slice(-MAX_MEMORY_CHARS);
          if (memoryStore.topics.indexOf('GitHub知識ベース(knowledge.txt)') === -1) {
            memoryStore.topics.unshift('GitHub知識ベース(knowledge.txt)');
          }
        }

        if (memoryStore.chatHistory && memoryStore.chatHistory.length > 0) {
          memoryStore.chatHistory.forEach(function(item) {
            addMessageImmediate(item.text, item.sender);
          });
        }

        trainStatusEl.textContent = '🌐 ネットから新しい知識を収集し、LLMの脳みそを更新中...';
        var fetched = await fetchRandomWebArticles();

        var isFirstEver = (!memoryStore.corpusText || memoryStore.corpusText.length <= 15);
        var greeting = isFirstEver
          ? 'こんにちは！全方向進化した「カフェ・LLM」へようこそ☕\n単語トークナイザー・2層Transformer・横断比較推論・長期記憶を搭載したよ！「私は〇〇と申します」や「宇宙と地球の違い」「〇〇について教えて」など何でも試してみてね！'
          : null;

        trainAndGrowMemory(fetched.text, fetched.titles, greeting, false);

        setInterval(autoGrowInBackground, AUTO_LEARN_INTERVAL_MS);

      } catch (err) {
        statusContainer.style.backgroundColor = '#fdecea';
        trainStatusEl.textContent = '❌ 起動エラー: ' + err.message;
      }
    }

    async function handleGenerateClick() {
      if (!llmModel) return;
      var prompt = promptInput.value.trim();
      if (!prompt) {
        prompt = 'こんにちは！';
      }

      addMessageImmediate(prompt, 'user');
      memoryStore.chatHistory.push({ sender: 'user', text: prompt });
      promptInput.value = '';
      promptInput.disabled = true;
      generateBtn.disabled = true;

      var reply = await generateFullLLMReply(prompt);
      memoryStore.chatHistory.push({ sender: 'ai', text: reply });
      saveToPermanentMemory();

      addMessageWithTyping(reply, 'ai', function() {
        promptInput.disabled = false;
        generateBtn.disabled = false;
        promptInput.focus();
      });
    }

    promptInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleGenerateClick();
      }
    });

    window.addEventListener('DOMContentLoaded', bootAI);
  </script>
