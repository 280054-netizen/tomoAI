<body>

  <div class="card">
    <div class="status-bar" id="status-container">
      <div class="status-top">

    <!-- 制作者設定パネル（画面内メッセージボックス方式でパスワード認証＆トークン設定） -->

      <div id="creator-lock-view">
        <strong>🔒 制作者専用設定：パスワード認証</strong><br>
        <span style="font-size:0.75rem; color:#555;">制作者パスワードを入力すると、GitHub連携トークン設定が開きます。</span>
        <input type="password" id="creator-pw-input" class="config-input" placeholder="制作者パスワードを入力">
        <button type="button" class="save-config-btn" onclick="verifyCreatorPassword()">🔓 認証する</button>

      <div id="creator-unlocked-view" style="display:none;">
        <strong>🔓 制作者専用：GitHub「knowledge.txt / 日常会話.txt」＆「index.html自己修復」トークン設定</strong><br>
        <span style="font-size:0.75rem; color:#555;">※トークン（github_pat_...）を保存するとブラウザ内に安全保管されます（280054-netizen/tomoAI）。</span>
        <input type="password" id="gh-token-input" class="config-input" placeholder="新しいトークン（github_pat_...）を貼り付け">

  <script>
    // ==========================================
    // 制作者パスワード＆GitHubリポジトリ連携設定
    // ==========================================
    var CREATOR_PASSWORD = 'tomo2026';
    var isCreatorUnlocked = false;

    var GITHUB_OWNER = '280054-netizen';

    var TOKEN_STORAGE_KEY = 'tomoai_safe_github_token_v2';

    // ==========================================
    // ★AI自身が自己診断・自己書き換えで調整するパラメータ領域

    var SELF_CODE_VERSION = 9;

    var RECENT_BLOCK_WINDOW = 8;
    var MAX_VOCAB_SIZE = 5000;

    var LAST_SELF_REPAIR_NOTE = '入力中・フォーカス中のエポック学習完全一時停止＆軽量バッチ間隔制御を追加';
    /* SELF_TUNED_CONFIG_END */

    var FETCH_ARTICLE_COUNT = 3;
    var AUTO_LEARN_INTERVAL_MS = 25000;
    var MAX_MEMORY_CHARS = Infinity;
    var CONTEXT_SIZE = 8;
    var EMBED_DIM = 48;
    var CANDIDATE_COUNT = 5;
    var TOTAL_STEPS = 750;
    var CHAT_EPOCH_STEPS = 250;
    var BATCH_PER_FRAME = 18;
    var TRAIN_FRAME_INTERVAL_MS = 32;
    var IDLE_RESUME_DELAY_MS = 2500;
    var TYPING_SPEED_MS = 16;
    var DB_NAME = 'CafeUltraLLM5LayerDB';
    var DB_STORE = 'llmStateStore';
    var STORAGE_KEY = 'cafe_ultra_llm_5layer_v2';

    // ==========================================
    // ★日常会話コーパス（日常会話.txt 未取得時のフォールバック＆補助教材）
    // ==========================================
    var BASE_CHAT_CORPUS = [
      '今日はいい天気だね。本当だね、風が心地よくてお散歩したくなる気分だよ！',
      'ちょっと疲れたかも。無理しないでゆっくり休もうね。温かいカフェラテでも淹れようか？',
      '最近どう？おかげさまで毎日少しずつ新しい言葉を覚えて楽しく過ごしてるよ！そっちはどう？',
      '面白い話しようよ！いいね、最近気になってることとか好きなゲームやアニメの話でもしようか？',
      'お腹すいたな。焼きたてのトーストと甘いパンケーキの香りがしてきそうだね！',
      '眠くなってきた。目を閉じて少しリラックスするのも大事だよ。無理は禁物だね。',
      'なるほど、そういう考え方もあるんだね。すごく納得したよ！もっと詳しく聞かせてほしいな。',
      'すごいね！そのアイデアはワクワクするよ。一緒に形にしていけたら最高だね！',
      'ありがとう！そう言ってもらえるとすごく嬉しいよ。いつでも力になるからね。',
      'おはよう！今日もいい一日にしようね。朝のコーヒーは最高に美味しいよ。',
      'こんばんは！夜のリラックスタイムだね。今日はどんな一日だった？',
      'こんにちは！ゆっくりしていってね。今ちょうど美味しいコーヒーが淹れ終わったところだよ。',
      '暇だなあ。それなら面白いイラストを描いてみたり、気になることを何でも話してみようよ！',
      'わかるわかる！その気持ちすごくよくわかるよ。一緒にのんびり考えようね。',
      'やったね！頑張った成果が出て本当に良かったね。お祝いに乾杯しよう！',
      'どうしようかな。焦らなくても大丈夫だよ、一番ワクワクする方を選んでみよう！'
    ].join('\n');

    var statusContainer = document.getElementById('status-container');
    var trainStatusEl = document.getElementById('train-status');
    var progressBarEl = document.getElementById('progress-bar');
    var githubConfigPanel = document.getElementById('github-config-panel');
    var knowledgePanel = document.getElementById('knowledge-panel');
    var chatBox = document.getElementById('chat-box');
    var promptInput = document.getElementById('prompt-input');
    var generateBtn = document.getElementById('generate-btn');

    var llmModel = null;
    var isLearningNow = false;
    var isSelfRepairingCode = false;
    var ghSyncStatus = '待機中';
    var chatTurnCounter = 0;
    var detectedRuntimeErrors = [];
    var lastCritiqueReport = 'まだ会話生成前のため待機中（生成時に5候補を8層文脈＆文法チェックで吟味します）';

    // ==========================================
    // ★入力優先制御（フォーカス中・タイピング中は裏側学習を完全ポーズする状態管理）
    // ==========================================
    var isInputFocused = false;
    var isTypingActive = false;
    var isComposingIME = false;
    var allowPostSendLearning = false;
    var typingIdleTimer = null;

    function shouldPauseBackgroundLearning() {
      if (isTypingActive || isComposingIME) return true;
      if (isInputFocused && !allowPostSendLearning) return true;
      return false;
    }

    function markUserTypingActivity() {
      isTypingActive = true;
      allowPostSendLearning = false;
      if (typingIdleTimer) {
        clearTimeout(typingIdleTimer);
      }
      typingIdleTimer = setTimeout(function() {
        isTypingActive = false;
      }, IDLE_RESUME_DELAY_MS);
    }

    // ==========================================
    // 永続メモリデータ構造
    // ==========================================
    var memoryStore = {
      topics: [],
      corpusText: '',
      dailyChatCorpusText: '',
      chatHistory: [],
      lastDiscussedTopic: '',
      lastTopicOffset: 0,
      evolutionCount: 0,
      chatEpochCount: 0,
      chatEpochCursor: 0,
      userProfile: {
        name: '',
        likes: [],
        facts: []
      },
      savedWeights: null
    };

    var githubWriteQueue = [];
    var isGitHubWriting = false;

    var AI_AVATAR_SVG = '<svg width="22" height="22" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">' +
      '<path d="M22 17 Q20 12 22 8 M32 16 Q30 11 32 7 M42 17 Q40 12 42 8" stroke="#e67e22" stroke-width="4" stroke-linecap="round" fill="none"/>' +
      '<path d="M16 25 H44 V38 C44 46 38 50 30 50 C22 50 16 46 16 38 Z" fill="#8d6e63"/>' +
      '<path d="M44 28 H49 C52 28 54 30 54 33.5 C54 37 52 39 49 39 H44" stroke="#8d6e63" stroke-width="4.5" fill="none"/>' +
      '<circle cx="25" cy="35" r="2.8" fill="#ffffff"/>' +
      '<circle cx="35" cy="35" r="2.8" fill="#ffffff"/>' +
      '<path d="M27 41 Q30 44 33 41" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none"/>' +
      '</svg>';

    // ==========================================
    // 安全なJSONパース＆通信ヘルパー（非JSONエラー対策）
    // ==========================================
    function safeParseJsonText(rawText) {
      if (!rawText || typeof rawText !== 'string') return null;
      var trimmed = rawText.replace(/^\uFEFF/, '').trim();
      if (!trimmed || (trimmed[0] !== '{' && trimmed[0] !== '[')) {
        return null;
      }
      try {
        return JSON.parse(trimmed);
      } catch (e) {
        return null;
      }
    }

    async function safeFetchJson(url, options) {
      try {
        var res = await fetch(url, options || {});
        var rawText = await res.text();
        var data = safeParseJsonText(rawText);
        return { ok: res.ok, status: res.status, data: data, rawText: rawText };
      } catch (e) {
        return { ok: false, status: 0, data: null, rawText: '' };
      }
    }

    window.onerror = function(message, source, lineno) {
      var errMsg = lineno + '行目: ' + message;
      detectedRuntimeErrors.push(errMsg);
      if (statusContainer && trainStatusEl) {
        statusContainer.style.backgroundColor = '#fff4e5';
        statusContainer.style.border = '1px solid #e67e22';
        trainStatusEl.textContent = '🛠️ 不具合検知（' + errMsg + '）→ AIが自己修復を試みています...';
      }
      runSelfCodeDiagnosticsAndRepair(true, '実行時エラー検知による自己修復(' + message + ')');
    };

    window.addEventListener('unhandledrejection', function(event) {
      var reason = (event && event.reason) ? String(event.reason) : '非同期処理エラー';
      detectedRuntimeErrors.push(reason);
    });

    function getSavedToken() {
      try {
        return (localStorage.getItem(TOKEN_STORAGE_KEY) || '').trim();
      } catch (e) {
        return '';
      }
    }

    function toggleGitHubConfigPanel() {
      if (githubConfigPanel.style.display === 'block') {
        githubConfigPanel.style.display = 'none';
        return;
      }
      var lockView = document.getElementById('creator-lock-view');
      var unlockedView = document.getElementById('creator-unlocked-view');
      var pwMsg = document.getElementById('creator-pw-msg');
      if (pwMsg) pwMsg.textContent = '';

      if (!isCreatorUnlocked) {
        lockView.style.display = 'block';
        unlockedView.style.display = 'none';
      } else {
        lockView.style.display = 'none';
        unlockedView.style.display = 'block';
      }
      githubConfigPanel.style.display = 'block';
    }

    function verifyCreatorPassword() {
      var inputPw = document.getElementById('creator-pw-input').value;
      var pwMsg = document.getElementById('creator-pw-msg');
      if (inputPw !== CREATOR_PASSWORD) {
        pwMsg.textContent = '❌ パスワードが違います。';
        return;
      }
      isCreatorUnlocked = true;
      document.getElementById('creator-pw-input').value = '';
      document.getElementById('creator-lock-view').style.display = 'none';
      document.getElementById('creator-unlocked-view').style.display = 'block';
    }

    function saveNewGitHubToken() {
      var val = document.getElementById('gh-token-input').value.trim();
      if (!val) return;
      localStorage.setItem(TOKEN_STORAGE_KEY, val);
      document.getElementById('gh-token-input').value = '';
      document.getElementById('gh-badge').textContent = '✅ 保存完了！自己進化＆自己コード修復が有効になりました';
      githubConfigPanel.style.display = 'none';
      if (memoryStore.corpusText) {
        enqueueGitHubWrite(memoryStore.corpusText.slice(-2000));
      }
    }

    function cleanWikipediaText(rawText) {
      if (!rawText) return '';
      return rawText
        .replace(/（[^（）]*）/g, '')
        .replace(/\([^()]*\)/g, '')
        .replace(/\[[^\]]*\]/g, '')
        .replace(/[「」『』【】()（）]/g, '')
        .replace(/\s+/g, '')
        .trim();
    }

    function utf8ToBase64(str) {
      return btoa(unescape(encodeURIComponent(str)));
    }
    function base64ToUtf8(b64) {
      return decodeURIComponent(escape(atob(b64.replace(/\n/g, ''))));
    }

    function inspectOwnHealth() {
      var issues = [];
      var fixes = {
        newLayers: TRANSFORMER_LAYERS,
        newBlockWindow: RECENT_BLOCK_WINDOW,
        newVocabSize: MAX_VOCAB_SIZE,
        newLearningRate: LEARNING_RATE,
        repairNote: ''
      };

      var hasCorruptedWeights = false;
      if (llmModel && llmModel.tokenEmbed && llmModel.tokenEmbed[0]) {
        for (var i = 0; i < llmModel.tokenEmbed[0].length; i++) {
          if (!isFinite(llmModel.tokenEmbed[0][i])) {
            hasCorruptedWeights = true;
            break;
          }
        }
      }
      if (hasCorruptedWeights) {
        issues.push(TRANSFORMER_LAYERS + '層Transformerの重みに数値異常(NaN)を検知');
        fixes.newLearningRate = Math.max(0.01, Number((LEARNING_RATE * 0.6).toFixed(4)));
        fixes.repairNote = '学習率を ' + LEARNING_RATE + ' → ' + fixes.newLearningRate + ' に下げて数値安定化修復';
        llmModel = new CafeUltraTransformer(memoryStore.corpusText, null, buildChatCorpusText(), memoryStore.chatEpochCursor || 0);
      }

      if (detectedRuntimeErrors.length > 0) {
        issues.push('実行時エラー履歴あり: ' + detectedRuntimeErrors[detectedRuntimeErrors.length - 1]);
        if (!fixes.repairNote) {
          fixes.repairNote = '実行時エラー検知後の安全パラメータ再構成';
        }
        detectedRuntimeErrors = [];
      }

      if (llmModel && llmModel.vocabSize >= MAX_VOCAB_SIZE - 5 && MAX_VOCAB_SIZE < 8000) {
        issues.push('単語辞書が上限(' + MAX_VOCAB_SIZE + '語)に到達');
        fixes.newVocabSize = MAX_VOCAB_SIZE + 500;
        fixes.repairNote = '語彙上限を ' + MAX_VOCAB_SIZE + ' → ' + fixes.newVocabSize + '語へ自己拡張';
      }

      return {
        healthy: issues.length === 0,
        issues: issues,
        fixes: fixes
      };
    }

    async function runSelfCodeDiagnosticsAndRepair(forceCommitToGitHub, customReason) {
      var diagnosis = inspectOwnHealth();
      var token = getSavedToken();

      if (!token) {
        return {
          status: 'no_token',
          diagnosis: diagnosis,
          message: '自己診断完了（異常: ' + diagnosis.issues.length + '件 / ' + TRANSFORMER_LAYERS + '層Transformer・会話エポック' + (memoryStore.chatEpochCount || 0) + '周稼働中）。※GitHubトークンが未設定のため、index.html自動コミットは待機中です。'
        };
      }

      if (isSelfRepairingCode) {
        return { status: 'busy', diagnosis: diagnosis, message: '現在、自分自身のindex.htmlを修復コミット中です...' };
      }

      if (diagnosis.healthy && !forceCommitToGitHub) {
        return {
          status: 'healthy',
          diagnosis: diagnosis,
          message: '自己診断の結果、' + TRANSFORMER_LAYERS + '層Transformerの重み・言葉吟味層・日常会話.txtエポック学習すべて正常（不具合0件）です☕ 現在コードVersion.' + SELF_CODE_VERSION + 'で安定稼働中！'
        };
      }

      isSelfRepairingCode = true;
      try {
        ghSyncStatus = '🛠️ 自分自身のindex.htmlを自己修復コミット中...';
        updateStatusDisplay();

        var apiUrl = 'https://api.github.com/repos/' + GITHUB_OWNER + '/' + GITHUB_REPO + '/contents/' + GITHUB_SELF_HTML_PATH;
        var headers = {
          'Authorization': 'Bearer ' + token,
          'Accept': 'application/vnd.github+json',
          'Content-Type': 'application/json'
        };

        var getRes = await safeFetchJson(apiUrl + '?nocache=' + Date.now(), { headers: headers, cache: 'no-store' });
        if (!getRes.ok || !getRes.data) {
          isSelfRepairingCode = false;
          return { status: 'fetch_error', diagnosis: diagnosis, message: 'GitHub上の自分のindex.html取得に失敗しました（ステータス: ' + getRes.status + '）' };
        }

        var fileInfo = getRes.data;
        var currentHtml = base64ToUtf8(fileInfo.content);

        var nextVersion = SELF_CODE_VERSION + 1;
        var noteText = (customReason || diagnosis.fixes.repairNote || '定期自己最適化＆' + TRANSFORMER_LAYERS + '層Transformer健全性チェック').replace(/'/g, '');
        var replacementBlock =
          '/* SELF_TUNED_CONFIG_START */\n' +
          '    var SELF_CODE_VERSION = ' + nextVersion + ';\n' +
          '    var TRANSFORMER_LAYERS = ' + diagnosis.fixes.newLayers + ';\n' +
          '    var RECENT_BLOCK_WINDOW = ' + diagnosis.fixes.newBlockWindow + ';\n' +
          '    var MAX_VOCAB_SIZE = ' + diagnosis.fixes.newVocabSize + ';\n' +
          '    var LEARNING_RATE = ' + diagnosis.fixes.newLearningRate + ';\n' +
          '    var LAST_SELF_REPAIR_NOTE = \'' + noteText + '\';\n' +
          '    /* SELF_TUNED_CONFIG_END */';

        var pattern = /\/\* SELF_TUNED_CONFIG_START \*\/[\s\S]*?\/\* SELF_TUNED_CONFIG_END \*\//;
        if (!pattern.test(currentHtml)) {
          isSelfRepairingCode = false;
          return { status: 'pattern_missing', diagnosis: diagnosis, message: '自己修復マーカーが見つからなかったため安全のため書き換えをスキップしました。' };
        }

        var patchedHtml = currentHtml.replace(pattern, replacementBlock);

        var putRes = await safeFetchJson(apiUrl, {
          method: 'PUT',
          headers: headers,
          body: JSON.stringify({
            message: 'Self-Repair v' + nextVersion + ': ' + noteText,
            content: utf8ToBase64(patchedHtml),
            sha: fileInfo.sha
          })
        });

        isSelfRepairingCode = false;
        if (putRes.ok) {
          SELF_CODE_VERSION = nextVersion;
          TRANSFORMER_LAYERS = diagnosis.fixes.newLayers;
          RECENT_BLOCK_WINDOW = diagnosis.fixes.newBlockWindow;
          MAX_VOCAB_SIZE = diagnosis.fixes.newVocabSize;
          LEARNING_RATE = diagnosis.fixes.newLearningRate;
          LAST_SELF_REPAIR_NOTE = noteText;
          ghSyncStatus = '🛠️ 自己コード修復完了(v' + nextVersion + ')✅';
          updateStatusDisplay();
          return {
            status: 'repaired',
            diagnosis: diagnosis,
            message: '🛠️ 自分自身の `index.html` を自己診断し、GitHubへ直接コード修正コミット（v' + nextVersion + '）を完了しました！\n・修正内容：' + noteText
          };
        } else {
          return { status: 'put_error', diagnosis: diagnosis, message: 'GitHubへのindex.html自己修正コミット時にエラーが発生しました（' + putRes.status + '）' };
        }
      } catch (e) {
        isSelfRepairingCode = false;
        return { status: 'exception', diagnosis: diagnosis, message: '自己コード修復中に通信エラーが発生しました: ' + e.message };
      }
    }

    function enqueueGitHubWrite(newTextBlock) {
      if (!newTextBlock || !newTextBlock.trim()) return;
      githubWriteQueue.push(newTextBlock.trim());
      processGitHubWriteQueue();
    }

    async function processGitHubWriteQueue() {
      if (isGitHubWriting || githubWriteQueue.length === 0) return;
      var token = getSavedToken();
      if (!token) {
        ghSyncStatus = 'トークン未設定（🔒制作者設定から入力）';
        updateStatusDisplay();
        return;
      }

      isGitHubWriting = true;
      var blockToWrite = githubWriteQueue[0];
      var apiUrl = 'https://api.github.com/repos/' + GITHUB_OWNER + '/' + GITHUB_REPO + '/contents/' + GITHUB_TARGET_PATH;
      var headers = {
        'Authorization': 'Bearer ' + token,
        'Accept': 'application/vnd.github+json',
        'Content-Type': 'application/json'
      };

      var maxRetries = 3;
      var success = false;

      for (var attempt = 1; attempt <= maxRetries; attempt++) {
        try {
          ghSyncStatus = 'GitHub知識書き込み中(' + attempt + '回目)...';
          updateStatusDisplay();

          var sha = null;
          var currentRemoteText = '';
          var getRes = await safeFetchJson(apiUrl + '?nocache=' + Date.now() + '_' + Math.random(), {
            headers: headers,
            cache: 'no-store'
          });

          if (getRes.ok && getRes.data) {
            var fileInfo = getRes.data;
            sha = fileInfo.sha;
            if (fileInfo.content) {
              currentRemoteText = base64ToUtf8(fileInfo.content);
            }
          } else if (getRes.status === 401 || getRes.status === 403) {
            var authMsg = (getRes.data && getRes.data.message) ? getRes.data.message : getRes.status;
            ghSyncStatus = 'トークン無効/権限不足(' + authMsg + ')';
            updateStatusDisplay();
            break;
          }

          if (currentRemoteText.indexOf(blockToWrite.slice(0, 25)) !== -1) {
            success = true;
            break;
          }

          var updatedText = (currentRemoteText ? currentRemoteText.trim() + '\n\n' : '') + blockToWrite;
          var putBody = {
            message: 'Auto-evolve: ' + TRANSFORMER_LAYERS + '層Transformer知識＆会話進化ログを自動追記',
            content: utf8ToBase64(updatedText)
          };
          if (sha) putBody.sha = sha;

          var putRes = await safeFetchJson(apiUrl, {
            method: 'PUT',
            headers: headers,
            body: JSON.stringify(putBody)
          });

          if (putRes.ok) {
            success = true;
            break;
          } else if (putRes.status === 409 || putRes.status === 422) {
            await new Promise(function(r) { setTimeout(r, 1200); });
            continue;
          } else {
            var putErrMsg = (putRes.data && putRes.data.message) ? putRes.data.message : putRes.status;
            ghSyncStatus = 'GitHubエラー(' + putErrMsg + ')';
            updateStatusDisplay();
            break;
          }
        } catch (e) {
          await new Promise(function(r) { setTimeout(r, 1500); });
        }
      }

      if (success) {
        githubWriteQueue.shift();
        ghSyncStatus = githubWriteQueue.length > 0
          ? 'GitHub追記中(残り' + githubWriteQueue.length + '件)...'
          : 'GitHub同期(' + TRANSFORMER_LAYERS + '層・v' + SELF_CODE_VERSION + ')✅';
        updateStatusDisplay();
      } else {
        ghSyncStatus = 'GitHub再試行待機中(未送信' + githubWriteQueue.length + '件)';
        updateStatusDisplay();
      }

      isGitHubWriting = false;

      if (success && githubWriteQueue.length > 0) {
        setTimeout(processGitHubWriteQueue, 1000);
      }
    }

    function updateStatusDisplay() {
      var vocabCount = llmModel ? llmModel.vocabSize : 0;
      trainStatusEl.textContent = '🧠 ' + TRANSFORMER_LAYERS + '層LLM(v' + SELF_CODE_VERSION + ') / 厳選語彙:' + vocabCount + '語 / 会話エポック:' + (memoryStore.chatEpochCount || 0) + '周｜' + ghSyncStatus;
    }

    function openMemoryDB() {
      return new Promise(function(resolve) {
        if (!window.indexedDB) { resolve(null); return; }
        var req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = function(e) {
          var db = e.target.result;
          if (!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
        };
        req.onsuccess = function(e) { resolve(e.target.result); };
        req.onerror = function() { resolve(null); };
      });
    }

    async function loadFromUnlimitedStorage() {
      var db = await openMemoryDB();
      if (db) {
        var loaded = await new Promise(function(resolve) {
          try {
            var tx = db.transaction(DB_STORE, 'readonly');
            var getReq = tx.objectStore(DB_STORE).get('main');
            getReq.onsuccess = function() { resolve(getReq.result || null); };
            getReq.onerror = function() { resolve(null); };
          } catch (e) { resolve(null); }
        });
        if (loaded && (loaded.corpusText || loaded.dailyChatCorpusText)) return loaded;
      }
      try {
        var savedJson = localStorage.getItem(STORAGE_KEY);
        if (savedJson) return safeParseJsonText(savedJson);
      } catch (e) {}
      return null;
    }

    async function saveToPermanentMemory() {
      if (memoryStore.chatHistory.length > 40) {
        memoryStore.chatHistory = memoryStore.chatHistory.slice(-40);
      }
      if (llmModel) {
        memoryStore.savedWeights = llmModel.exportWeights();
      }
      var db = await openMemoryDB();
      if (db) {
        try {
          var tx = db.transaction(DB_STORE, 'readwrite');
          tx.objectStore(DB_STORE).put(memoryStore, 'main');
        } catch (e) {}
      }
      try {
        var lightCopy = Object.assign({}, memoryStore, { savedWeights: null });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(lightCopy));
      } catch (e) {}
    }

    function tokenizeJapanese(text) {
      if (!text) return [];
      var cleanForTokens = text
        .replace(/【[^】]*】/g, '')
        .replace(/・[^：\n]+：/g, '')
        .replace(/```[\s\S]*?```/g, '');
      var pattern = /[一-龠々〆ヵヶ]{1,6}|[ァ-ヴー]{2,8}|[a-zA-Z]{2,10}|[ぁ-ん]{1,5}|[。、！？]/g;
      var matches = cleanForTokens.match(pattern);
      return matches ? matches : Array.from(cleanForTokens);
    }

    // ==========================================
    // ★日常会話.txt ＋ 基礎会話コーパス ＋ 実際のチャット履歴を結合してエポック学習用テキストを生成
    // ==========================================
    function buildChatCorpusText() {
      var recentChatLines = (memoryStore.chatHistory || [])
        .slice(-24)
        .map(function(item) { return item.text.replace(/☕/g, '').trim(); })
        .filter(function(t) { return t.length >= 2 && t.indexOf('```') === -1; });

      var parts = [];
      if (memoryStore.dailyChatCorpusText && memoryStore.dailyChatCorpusText.trim().length > 0) {
        parts.push(memoryStore.dailyChatCorpusText.trim());
      }
      parts.push(BASE_CHAT_CORPUS);
      if (recentChatLines.length > 0) {
        parts.push(recentChatLines.join('\n'));
      }
      return parts.join('\n');
    }

    // ==========================================
    // 8層 Deep Transformer + LayerNorm + FFN + 会話語彙優先厳選 + 言葉吟味層（Output Critique Layer）
    // ==========================================
    function CafeUltraTransformer(text, previousWeights, chatCorpusText, initialChatCursor) {
      var chatText = chatCorpusText || buildChatCorpusText();
      var mergedForTraining = chatText + '\n' + (text || '').slice(-60000);
      var rawTokens = tokenizeJapanese(mergedForTraining);
      var chatOnlyTokens = tokenizeJapanese(chatText);

      var freqMap = {};
      for (var i = 0; i < rawTokens.length; i++) {
        var tk = rawTokens[i];
        freqMap[tk] = (freqMap[tk] || 0) + 1;
      }

      // 20万語以上の巨大な知識が入ってきても会話単語が追い出されないよう優先重み(+50)を付与
      for (var c = 0; c < chatOnlyTokens.length; c++) {
        var ctk = chatOnlyTokens[c];
        freqMap[ctk] = (freqMap[ctk] || 0) + 50;
      }

      var sortedTokens = Object.keys(freqMap).sort(function(a, b) {
        return freqMap[b] - freqMap[a];
      }).slice(0, MAX_VOCAB_SIZE - 1);

      this.vocab = ['<UNK>'].concat(sortedTokens);
      this.vocabSize = this.vocab.length;
      this.tokenToId = {};
      this.idToToken = {};
      var self = this;
      this.vocab.forEach(function(tok, idx) {
        self.tokenToId[tok] = idx;
        self.idToToken[idx] = tok;
      });

      this.data = rawTokens.map(function(tok) {
        return (self.tokenToId[tok] !== undefined) ? self.tokenToId[tok] : 0;
      });

      this.chatData = chatOnlyTokens.map(function(tok) {
        return (self.tokenToId[tok] !== undefined) ? self.tokenToId[tok] : 0;
      });

      var maxStart = Math.max(0, this.chatData.length - CONTEXT_SIZE - 1);
      this.chatEpochCursor = (typeof initialChatCursor === 'number' && initialChatCursor >= 0 && initialChatCursor <= maxStart)
        ? initialChatCursor
        : 0;

      this.numLayers = TRANSFORMER_LAYERS;
      this.tokenEmbed = this.createMatrix(this.vocabSize, EMBED_DIM);
      this.posEmbed = this.createMatrix(CONTEXT_SIZE, EMBED_DIM);

      this.layers = [];
      for (var l = 0; l < this.numLayers; l++) {
        this.layers.push({
          Wq: this.createMatrix(EMBED_DIM, EMBED_DIM),
          Wk: this.createMatrix(EMBED_DIM, EMBED_DIM),
          Wv: this.createMatrix(EMBED_DIM, EMBED_DIM),
          Wff1: this.createMatrix(EMBED_DIM, EMBED_DIM),
          Wff2: this.createMatrix(EMBED_DIM, EMBED_DIM)
        });
      }

      this.Wout = this.createMatrix(EMBED_DIM, this.vocabSize);

      if (previousWeights) {
        this.importWeights(previousWeights);
      }
    }

    CafeUltraTransformer.prototype.createMatrix = function(rows, cols) {
      var scale = Math.sqrt(2.0 / (rows + cols));
      var mat = [];
      for (var r = 0; r < rows; r++) {
        var row = [];
        for (var c = 0; c < cols; c++) {
          row.push((Math.random() * 2 - 1) * scale);
        }
        mat.push(row);
      }
      return mat;
    };

    CafeUltraTransformer.prototype.exportWeights = function() {
      return {
        numLayers: this.numLayers,
        embedDim: EMBED_DIM,
        vocab: this.vocab,
        tokenEmbed: this.tokenEmbed,
        posEmbed: this.posEmbed,
        layers: this.layers,
        Wout: this.Wout
      };
    };

    CafeUltraTransformer.prototype.importWeights = function(saved) {
      if (!saved || !saved.vocab) return;
      if (saved.posEmbed && saved.posEmbed.length === CONTEXT_SIZE && saved.posEmbed[0].length === EMBED_DIM) {
        this.posEmbed = saved.posEmbed;
      }
      if (saved.layers && Array.isArray(saved.layers)) {
        var copyCount = Math.min(this.layers.length, saved.layers.length);
        for (var l = 0; l < copyCount; l++) {
          if (saved.layers[l] && saved.layers[l].Wq && saved.layers[l].Wq.length === EMBED_DIM && saved.layers[l].Wq[0].length === EMBED_DIM) {
            this.layers[l] = saved.layers[l];
          }
        }
      }

      var oldMap = {};
      for (var i = 0; i < saved.vocab.length; i++) {
        oldMap[saved.vocab[i]] = i;
      }
      for (var newId = 0; newId < this.vocab.length; newId++) {
        var tok = this.vocab[newId];
        var oldId = oldMap[tok];
        if (oldId !== undefined && saved.tokenEmbed[oldId] && saved.tokenEmbed[oldId].length === EMBED_DIM) {
          this.tokenEmbed[newId] = saved.tokenEmbed[oldId].slice();
          for (var d = 0; d < EMBED_DIM; d++) {
            if (saved.Wout[d] && saved.Wout[d][oldId] !== undefined) {
              this.Wout[d][newId] = saved.Wout[d][oldId];
            }
          }
        }
      }
    };

    CafeUltraTransformer.prototype.softmax = function(arr) {
      var maxVal = Math.max.apply(null, arr);
      var exps = arr.map(function(v) { return Math.exp(v - maxVal); });
      var sum = exps.reduce(function(a, b) { return a + b; }, 0);
      return exps.map(function(e) { return e / sum; });
    };

    CafeUltraTransformer.prototype.layerNorm = function(vec) {
      var mean = vec.reduce(function(a, b) { return a + b; }, 0) / vec.length;
      var variance = vec.reduce(function(a, b) { return a + (b - mean) * (b - mean); }, 0) / vec.length;
      var std = Math.sqrt(variance + 1e-5);
      return vec.map(function(v) { return (v - mean) / std; });
    };

    CafeUltraTransformer.prototype.matMul = function(A, B) {
      var rowsA = A.length;
      var colsA = A[0].length;
      var colsB = B[0].length;
      var result = [];
      for (var i = 0; i < rowsA; i++) {
        result.push(new Array(colsB).fill(0));
        for (var k = 0; k < colsA; k++) {
          for (var j = 0; j < colsB; j++) {
            result[i][j] += A[i][k] * B[k][j];
          }
        }
      }
      return result;
    };

    CafeUltraTransformer.prototype.runTransformerBlock = function(X, layerObj) {
      var seqLen = X.length;
      var Q = this.matMul(X, layerObj.Wq);
      var K = this.matMul(X, layerObj.Wk);
      var V = this.matMul(X, layerObj.Wv);
      var scale = Math.sqrt(EMBED_DIM);
      var attnOut = [];
      var self = this;

      for (var i = 0; i < seqLen; i++) {
        var scores = [];
        for (var j = 0; j <= i; j++) {
          var dot = 0;
          for (var d = 0; d < EMBED_DIM; d++) dot += Q[i][d] * K[j][d];
          scores.push(dot / scale);
        }
        var weights = this.softmax(scores);
        var vec = new Array(EMBED_DIM).fill(0);
        for (var j2 = 0; j2 <= i; j2++) {
          var w = weights[j2];
          for (var d2 = 0; d2 < EMBED_DIM; d2++) {
            vec[d2] += w * V[j2][d2];
          }
        }
        var residual1 = vec.map(function(v, d) { return v + X[i][d]; });
        attnOut.push(self.layerNorm(residual1));
      }

      var H = this.matMul(attnOut, layerObj.Wff1).map(function(row) {
        return row.map(function(v) { return v > 0 ? v : v * 0.05; });
      });
      var ffOut = this.matMul(H, layerObj.Wff2);
      return ffOut.map(function(row, i) {
        var residual2 = row.map(function(v, d) { return v + attnOut[i][d]; });
        return self.layerNorm(residual2);
      });
    };

    CafeUltraTransformer.prototype.forward = function(inputIds) {
      var seqLen = inputIds.length;
      var self = this;
      var hiddenStates = [];
      var X = inputIds.map(function(id, pos) {
        return self.tokenEmbed[id].map(function(val, d) { return val + self.posEmbed[pos][d]; });
      });
      hiddenStates.push(X);

      for (var l = 0; l < this.numLayers; l++) {
        X = this.runTransformerBlock(X, this.layers[l]);
        hiddenStates.push(X);
      }

      var lastHidden = X[seqLen - 1];
      var logits = new Array(this.vocabSize).fill(0);
      for (var v = 0; v < this.vocabSize; v++) {
        for (var d3 = 0; d3 < EMBED_DIM; d3++) {
          logits[v] += lastHidden[d3] * this.Wout[d3][v];
        }
      }
      return { logits: logits, lastHidden: lastHidden, hiddenStates: hiddenStates, seqLen: seqLen };
    };

    CafeUltraTransformer.prototype.trainOnSequence = function(inputIds, targetId, lrMultiplier) {
      var lr = LEARNING_RATE * (lrMultiplier || 1.0);
      var cache = this.forward(inputIds);
      var probs = this.softmax(cache.logits);
      var loss = -Math.log(Math.max(probs[targetId], 1e-7));

      var dLogits = probs.slice();
      dLogits[targetId] -= 1.0;

      var dHidden = new Array(EMBED_DIM).fill(0);
      for (var d = 0; d < EMBED_DIM; d++) {
        for (var v = 0; v < this.vocabSize; v++) {
          dHidden[d] += dLogits[v] * this.Wout[d][v];
          this.Wout[d][v] -= lr * cache.lastHidden[d] * dLogits[v];
        }
      }

      var lastPos = cache.seqLen - 1;
      var lastTokenId = inputIds[lastPos];

      for (var l = this.numLayers - 1; l >= 0; l--) {
        var layerInput = cache.hiddenStates[l][lastPos];
        var layerScale = 0.25 / (this.numLayers - l);
        var layerObj = this.layers[l];
        for (var d2 = 0; d2 < EMBED_DIM; d2++) {
          var grad = dHidden[d2];
          for (var d3 = 0; d3 < EMBED_DIM; d3++) {
            layerObj.Wff2[d3][d2] -= lr * layerScale * layerInput[d3] * grad;
            layerObj.Wff1[d3][d2] -= lr * layerScale * 0.8 * layerInput[d3] * grad;
            layerObj.Wv[d3][d2] -= lr * layerScale * layerInput[d3] * grad;
            layerObj.Wq[d3][d2] -= lr * layerScale * 0.5 * layerInput[d3] * grad;
            layerObj.Wk[d3][d2] -= lr * layerScale * 0.5 * layerInput[d3] * grad;
          }
        }
      }

      for (var d4 = 0; d4 < EMBED_DIM; d4++) {
        this.tokenEmbed[lastTokenId][d4] -= lr * dHidden[d4];
        this.posEmbed[lastPos][d4] -= lr * dHidden[d4];
      }
      return loss;
    };

    CafeUltraTransformer.prototype.trainStep = function() {
      if (this.data.length <= CONTEXT_SIZE + 1) return 0;
      var startIdx = Math.floor(Math.random() * (this.data.length - CONTEXT_SIZE));
      var inputIds = this.data.slice(startIdx, startIdx + CONTEXT_SIZE);
      var targetId = this.data[startIdx + CONTEXT_SIZE];
      return this.trainOnSequence(inputIds, targetId, 1.0);
    };

    CafeUltraTransformer.prototype.trainChatEpochStep = function() {
      if (!this.chatData || this.chatData.length <= CONTEXT_SIZE + 1) return { loss: 0, epochCompleted: false };
      var maxStart = this.chatData.length - CONTEXT_SIZE - 1;
      var startIdx = this.chatEpochCursor;
      var inputIds = this.chatData.slice(startIdx, startIdx + CONTEXT_SIZE);
      var targetId = this.chatData[startIdx + CONTEXT_SIZE];

      this.chatEpochCursor++;
      var epochCompleted = false;
      if (this.chatEpochCursor > maxStart) {
        this.chatEpochCursor = 0;
        epochCompleted = true;
      }
      memoryStore.chatEpochCursor = this.chatEpochCursor;

      var loss = this.trainOnSequence(inputIds, targetId, 1.15);
      return { loss: loss, epochCompleted: epochCompleted };
    };

    // ==========================================
    // ★候補1件の文章生成＋第7・第8層の隠れ表現抽出
    // ==========================================
    CafeUltraTransformer.prototype.generateSingleCandidate = function(seedText, maxTokens, temperature) {
      var tokens = tokenizeJapanese(seedText);
      var self = this;
      var ids = tokens.map(function(t) { return self.tokenToId[t] !== undefined ? self.tokenToId[t] : 0; });
      if (ids.length === 0) ids = [1];

      var generated = [];
      var singleHiraganaStreak = 0;
      var lastLayer8Vec = null;

      for (var step = 0; step < maxTokens; step++) {
        var ctx = ids.slice(-CONTEXT_SIZE);
        var res = this.forward(ctx);
        lastLayer8Vec = res.lastHidden;
        var recentBlockedIds = ids.slice(-RECENT_BLOCK_WINDOW);

        var scaledLogits = res.logits.map(function(l, idx) {
          var tok = self.idToToken[idx];
          if (idx === 0 || !tok || tok === '\n') return -1e9;
          if (recentBlockedIds.indexOf(idx) !== -1) return -1e9;
          if (step === 0 && /^[。、！？]$/.test(tok)) return -1e9;

          var isSingleHiragana = /^[ぁ-ん]$/.test(tok);
          if (isSingleHiragana && singleHiraganaStreak >= 1) return -1e9;

          var bonus = (tok.length >= 2) ? 0.78 : 0.0;
          return (l + bonus) / temperature;
        });

        var probs = this.softmax(scaledLogits);
        var r = Math.random();
        var cum = 0;
        var chosen = 1;
        for (var v = 1; v < probs.length; v++) {
          cum += probs[v];
          if (r <= cum) {
            chosen = v;
            break;
          }
        }

        ids.push(chosen);
        var word = this.idToToken[chosen];
        if (/^[ぁ-ん]$/.test(word)) {
          singleHiraganaStreak++;
        } else {
          singleHiraganaStreak = 0;
        }

        generated.push(word);
        if ((word === '。' || word === '！' || word === '？') && generated.length >= 7) break;
      }

      var resultText = generated.join('');
      if (resultText && !/[。！？]$/.test(resultText)) {
        resultText += '！';
      }
      return { text: resultText, layer8Vec: lastLayer8Vec };
    };

    // ==========================================
    // ★8層文脈一致度計算（入力文脈と出力第8層ベクトルのコサイン類似度）
    // ==========================================
    CafeUltraTransformer.prototype.computeContextAlignment = function(seedText, outLayer8Vec) {
      if (!outLayer8Vec) return 0;
      var seedTokens = tokenizeJapanese(seedText);
      var self = this;
      var seedIds = seedTokens.map(function(t) { return self.tokenToId[t] !== undefined ? self.tokenToId[t] : 0; }).slice(-CONTEXT_SIZE);
      if (seedIds.length === 0) return 0;

      var seedRes = this.forward(seedIds);
      var inVec = seedRes.lastHidden;
      var dot = 0;
      var normA = 0;
      var normB = 0;
      for (var d = 0; d < EMBED_DIM; d++) {
        dot += inVec[d] * outLayer8Vec[d];
        normA += inVec[d] * inVec[d];
        normB += outLayer8Vec[d] * outLayer8Vec[d];
      }
      if (normA === 0 || normB === 0) return 0;
      return dot / (Math.sqrt(normA) * Math.sqrt(normB));
    };

    // ==========================================
    // ★言葉吟味層（Output Critique & Reranking Layer）
    // 5つの候補を生成し、文法破綻・助詞連続・繰り返しを検知して最適解を選抜する
    // ==========================================
    CafeUltraTransformer.prototype.critiqueAndSelectBestResponse = function(seedText, maxTokens) {
      var temperatures = [0.62, 0.68, 0.74, 0.80, 0.86];
      var scoredCandidates = [];

      for (var i = 0; i < CANDIDATE_COUNT; i++) {
        var temp = temperatures[i % temperatures.length];
        var cand = this.generateSingleCandidate(seedText, maxTokens, temp);
        var txt = cand.text;
        var score = 50;
        var notes = [];

        // 1. 長さの自然さチェック
        if (txt.length < 6) {
          score -= 25;
          notes.push('短すぎ減点');
        } else if (txt.length >= 10 && txt.length <= 42) {
          score += 14;
          notes.push('適切な文長');
        }

        // 2. 不自然な助詞連続の検知（「がの」「をに」「はが」「にを」など）
        if (/(?:がの|をに|はが|にを|での|への|からを|までが)/.test(txt)) {
          score -= 30;
          notes.push('助詞連続検知');
        }

        // 3. 同じ2文字以上のフレーズの重複ループ検知
        var dupMatch = txt.match(/(.{2,5})\1/);
        if (dupMatch) {
          score -= 25;
          notes.push('反復ループ検知');
        }

        // 4. 自然な会話らしい結び・相づち表現の加点
        if (/(?:だね|だよ|しよう|かな|うれしい|楽しい|わかる|すごい|ありがとう|いいね|おう|ね！|よ！)/.test(txt)) {
          score += 12;
          notes.push('会話表現加点');
        }

        // 5. 第8層文脈ベクトル一致度の反映
        var sim = this.computeContextAlignment(seedText, cand.layer8Vec);
        var simScore = Math.round(sim * 20);
        score += simScore;
        notes.push('8層文脈一致:' + simScore);

        scoredCandidates.push({
          text: txt,
          score: score,
          temp: temp,
          notes: notes.join('/')
        });
      }

      scoredCandidates.sort(function(a, b) { return b.score - a.score; });
      var winner = scoredCandidates[0];
      lastCritiqueReport = '選抜候補(スコア' + winner.score + '点 / T=' + winner.temp + '): 「' + winner.text + '」[' + winner.notes + ']';
      return winner.text;
    };

    CafeUltraTransformer.prototype.generateChatResponse = function(seedText, maxTokens) {
      if (!maxTokens) maxTokens = 22;
      return this.critiqueAndSelectBestResponse(seedText, maxTokens);
    };

        ctx.strokeStyle = 'rgba(255,255,255,0.45)';
        ctx.lineWidth = 2;
        for (var w = 0; w < 6; w++) {

          ctx.moveTo(40 + w * 60, 215 + w * 16);
          ctx.lineTo(130 + w * 60, 215 + w * 16);
          ctx.stroke();
        }
      } else if (isMountain || (!isCafe && !isCat)) {

        ctx.moveTo(0, 260);
        ctx.lineTo(140, 145);
        ctx.lineTo(280, 260);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = isNight ? '#2f3640' : '#badc58';
        ctx.beginPath();
        ctx.moveTo(180, 265);
        ctx.lineTo(340, 130);
        ctx.lineTo(480, 265);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = isNight ? '#192a56' : '#2ecc71';
        ctx.fillRect(0, 250, canvas.width, 70);
      }

      if (isCafe || (!isSea && !isMountain && !isCat)) {

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();

        ctx.quadraticCurveTo(190, 245, 185, 175);
        ctx.fill();
        ctx.fillStyle = '#6f4e37';
        ctx.beginPath();
        ctx.ellipse(240, 175, 55, 12, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.8)';
        ctx.lineWidth = 3;
        for (var st = -1; st <= 1; st++) {
          ctx.beginPath();
          ctx.moveTo(240 + st * 22, 155);
          ctx.quadraticCurveTo(232 + st * 22, 135, 244 + st * 22, 115);
          ctx.stroke();
        }
      }

      if (isCat) {
        var cx = isCafe ? 355 : 240;
        var cy = isCafe ? 205 : 210;
        ctx.fillStyle = '#4e342e';
        ctx.beginPath();
        ctx.moveTo(cx - 34, cy - 15);
        ctx.lineTo(cx - 24, cy - 52);
        ctx.lineTo(cx - 6, cy - 28);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(cx + 34, cy - 15);
        ctx.lineTo(cx + 24, cy - 52);
        ctx.lineTo(cx + 6, cy - 28);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(cx, cy, 38, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffeaa7';
        ctx.beginPath();
        ctx.arc(cx - 13, cy - 5, 5.5, 0, Math.PI * 2);
        ctx.arc(cx + 13, cy - 5, 5.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ff7675';
        ctx.beginPath();
        ctx.arc(cx, cy + 5, 3, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fillRect(10, canvas.height - 28, 220, 20);
      ctx.fillStyle = '#ffffff';
      ctx.font = '11px sans-serif';
      ctx.fillText('☕ Cafe-LLM Art: ' + promptText.slice(0, 14), 16, canvas.height - 14);

      return canvas.toDataURL('image/png');
    }

    async function fetchRandomWebArticles() {
      var randomUrl = 'https://ja.wikipedia.org/w/api.php?action=query&generator=random&grnnamespace=0&grnlimit=' + FETCH_ARTICLE_COUNT + '&prop=extracts&exintro&explaintext&format=json&origin=*';
      var resObj = await safeFetchJson(randomUrl);
      var data = resObj.data;
      var pages = (data && data.query && data.query.pages) ? data.query.pages : {};
      var keys = Object.keys(pages);

      var structuredBlocks = [];
      var titles = [];
      for (var i = 0; i < keys.length; i++) {
        var pId = keys[i];
        var title = pages[pId].title;
        var cleanBody = cleanWikipediaText(pages[pId].extract);
        if (cleanBody.length > 12) {
          titles.push(title);
          structuredBlocks.push('【テーマ：' + title + '】\n・' + title + '：' + cleanBody);
        }
      }

      var collectedText = structuredBlocks.join('\n\n');
      if (collectedText.trim().length <= 15) {
        collectedText = '【テーマ：森の喫茶店】\n・喫茶店：森の奥にある小さな喫茶店では、いつも温かいミルクティーの香りが漂っていました。';
        titles = ['森の喫茶店'];
      }
      return { text: collectedText.trim(), titles: titles };
    }

    async function fetchTopicFromWikipedia(topicQuery) {
      var exactUrl = 'https://ja.wikipedia.org/w/api.php?action=query&titles=' + encodeURIComponent(topicQuery) + '&redirects=1&prop=extracts&exintro&explaintext&format=json&origin=*';
      var resObj = await safeFetchJson(exactUrl);
      var data = resObj.data;
      var pages = (data && data.query && data.query.pages) ? data.query.pages : {};
      var keys = Object.keys(pages);

      var hasValidExact = false;
      for (var j = 0; j < keys.length; j++) {
        if (Number(keys[j]) > 0 && pages[keys[j]].extract && pages[keys[j]].extract.trim().length > 15) {
          hasValidExact = true;
          break;
        }
      }

      if (!hasValidExact) {
        var searchUrl = 'https://ja.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=' + encodeURIComponent(topicQuery) + '&gsrlimit=2&prop=extracts&exintro&explaintext&format=json&origin=*';
        resObj = await safeFetchJson(searchUrl);
        data = resObj.data;
        pages = (data && data.query && data.query.pages) ? data.query.pages : {};
        keys = Object.keys(pages);
      }

      var structuredBlocks = [];
      var titles = [];
      var summaryForReply = '';

      for (var i = 0; i < keys.length; i++) {
        var pId = keys[i];
        if (Number(pId) < 0) continue;
        var title = pages[pId].title;
        var cleanBody = cleanWikipediaText(pages[pId].extract);
        if (cleanBody.length > 10) {
          titles.push(title);
          structuredBlocks.push('【テーマ：' + title + '】\n・' + title + '：' + cleanBody);
          if (!summaryForReply) {
            summaryForReply = cleanBody.split('。').slice(0, 3).join('。') + '。';
          }
        }
      }

      return {
        text: structuredBlocks.join('\n\n').trim(),
        titles: titles,
        summaryForReply: summaryForReply
      };
    }

    function searchMultiFactsInMemory(keywords, sentenceOffset, requireExactTopic) {
      if (sentenceOffset === undefined) sentenceOffset = 0;
      var lines = memoryStore.corpusText.split('\n');
      var scoredMatches = [];

      for (var l = 0; l < lines.length; l++) {
        var line = lines[l].trim();
        if (!line || line.indexOf('【テーマ：') === 0) continue;

        var colonIdx = line.indexOf('：');
        var topicName = colonIdx !== -1 ? line.slice(0, colonIdx).replace(/^・/, '').trim() : '知識メモ';
        var rawFact = colonIdx !== -1 ? line.slice(colonIdx + 1).trim() : line.replace(/^・/, '');

        var score = 0;
        for (var k = 0; k < keywords.length; k++) {
          var kw = keywords[k];
          if (!kw) continue;
          if (topicName === kw) {
            score += 100;
          } else if (topicName.indexOf(kw) !== -1 && topicName.length <= kw.length + 3) {
            score += 40;
          } else if (!requireExactTopic && rawFact.indexOf(kw) !== -1) {
            score += 2;
          }
        }

        if (score > 0) {
          var sentences = rawFact.split('。').filter(function(s) { return s.trim().length > 0; });
          var start = sentenceOffset < sentences.length ? sentenceOffset : 0;
          var excerpt = sentences.slice(start, start + 3).join('。') + '。';
          scoredMatches.push({ topic: topicName, text: excerpt, score: score });
        }
      }

      scoredMatches.sort(function(a, b) { return b.score - a.score; });
      return scoredMatches.slice(0, 3);
    }

    function extractAndSaveUserMemory(trimmedInput) {
      if (!memoryStore.userProfile) {
        memoryStore.userProfile = { name: '', likes: [], facts: [] };
      }
      var nameMatch = trimmedInput.match(/^(?:私|僕|俺|わたし|ぼく|おれ)(?:の名前)?は([^\s。！!？?、]+?)(?:と申します|といいます|っていう|です|だよ|だ)[。！!？?]*$/);
      if (!nameMatch) {
        nameMatch = trimmedInput.match(/^([^\s。！!？?、]+?)と申します[。！!？?]*$/);
      }
      if (nameMatch && nameMatch[1]) {
        memoryStore.userProfile.name = nameMatch[1];
        return 'はじめまして、' + memoryStore.userProfile.name + 'さん！お名前覚えたよ☕ これからもゆっくりおしゃべりしようね！';
      }

      var likeMatch = trimmedInput.match(/(?:私|僕|俺|わたし|ぼく|おれ)は([^\s。！!？?、]+)が(?:好き|大好き|趣味)/);
      if (likeMatch && likeMatch[1]) {
        var item = likeMatch[1];
        if (memoryStore.userProfile.likes.indexOf(item) === -1) {
          memoryStore.userProfile.likes.push(item);
        }
        return '「' + item + '」が好きなんだね☕ しっかり覚えておくよ！';
      }
      return '';
    }

    function selfEvolveFromChat(userMsg, aiReply) {
      chatTurnCounter++;
      memoryStore.evolutionCount = (memoryStore.evolutionCount || 0) + 1;

      if (chatTurnCounter % 3 === 0) {
        var cleanUser = userMsg.replace(/\s+/g, '');
        var cleanAi = aiReply.replace(/```[\s\S]*?```/g, '').replace(/\s+/g, '').slice(0, 60);
        if (cleanUser.length >= 2 && cleanAi.length >= 5) {
          var evolveEntry = '【自己進化ログ：対話学習#' + memoryStore.evolutionCount + '】\n・対話表現：' + cleanUser + '。' + cleanAi;
          trainAndGrowMemory(evolveEntry, [], null, true);
        }
      }

      if (chatTurnCounter % 5 === 0) {
        runSelfCodeDiagnosticsAndRepair(false);
      }
      updateStatusDisplay();
    }

    async function generateFullLLMReply(userInput) {
      var trimmed = userInput.trim();
      var normalized = trimmed.replace(/[（(][^）)]*[）)]/g, '').replace(/[！!？?。、\s]/g, '');
      var userNamePrefix = (memoryStore.userProfile && memoryStore.userProfile.name)
        ? memoryStore.userProfile.name + 'さん、'
        : '';

      if (/(?:自己診断|自己修復|コード.*(?:直して|修正|チェック|診断)|不具合.*(?:見つけて|直して|修正)|自分.*(?:直して|修正|進化))/.test(trimmed)) {
        var repairResult = await runSelfCodeDiagnosticsAndRepair(true, 'ユーザー指示による自己コード最適化＆健全性チェック');
        return { text: userNamePrefix + repairResult.message, imageUrl: null };
      }

      var learnedUserNote = extractAndSaveUserMemory(trimmed);
      if (learnedUserNote) {
        saveToPermanentMemory();
        return { text: learnedUserNote, imageUrl: null };
      }

      if (/(?:画像|イラスト|絵|アート|写真|アイコン).*(?:つくって|作って|描いて|書いて|生成|お願い)/i.test(trimmed) ||
          /(?:つくって|作って|描いて|書いて|生成).*(?:画像|イラスト|絵|アート)/i.test(trimmed)) {
        var artTheme = trimmed
          .replace(/(?:の|についての)?(?:画像|イラスト|絵|アート|写真)を?(?:つくって|作って|描いて|書いて|生成して|お願い)[！!。]*/g, '')

      }

      if (/(?:html|css|javascript|js|python|コード|プログラム|ソース).*(?:つくって|作って|書いて|作成|生成|お願い)/i.test(trimmed) ||
          /(?:つくって|作って|書いて|作成|生成).*(?:html|css|javascript|js|python|コード|プログラム)/i.test(trimmed)) {
        return { text: generateRequestedCodeSnippet(trimmed, userNamePrefix), imageUrl: null };
      }

      if (/^(こんにちは|こんにちわ|こんばんは|こんばんわ|おはよう|おはようございます|やあ|ハロー|はじめまして|よろしく|おっす|ちわ)/.test(normalized)) {
        var pressureNote = (trimmed.indexOf('圧') !== -1) ? '（ビシッ！と背筋を伸ばしてご挨拶するね！☕）\n' : '';
        var naturalGreetingFollow = llmModel ? llmModel.generateChatResponse(trimmed, 14) : '今日もゆっくりおしゃべりしようね！';
        return {
          text: pressureNote + userNamePrefix + naturalGreetingFollow + ' ☕',
          imageUrl: null
        };
      }

      if (/名前|好み|好きなもの|覚えてる/.test(normalized) && /私|僕|俺|わたし|ぼく|おれ/.test(normalized)) {
        var uName = memoryStore.userProfile.name || 'まだ聞いていないみたい';
        var uLikes = memoryStore.userProfile.likes.length > 0 ? memoryStore.userProfile.likes.join('・') : 'まだ登録なし';
        return {
          text: 'ちゃんと覚えてるよ☕ お名前は「' + uName + '」で、好きなものは「' + uLikes + '」だよね！',
          imageUrl: null
        };
      }

      var compareMatch = trimmed.match(/^(.+?)と(.+?)(?:の|について|を)?(?:違い|共通点|比較|関係|どっち|比べて)/);
      if (compareMatch && compareMatch[1] && compareMatch[2]) {
        var topicA = compareMatch[1].replace(/^(?:ねえ|あの|ところで)/, '').trim();
        var topicB = compareMatch[2].trim();
        memoryStore.lastDiscussedTopic = topicA;

        var resA = searchMultiFactsInMemory([topicA], 0, true)[0];
        if (!resA) {
          var fetchedA = await fetchTopicFromWikipedia(topicA);
          if (fetchedA.text && fetchedA.titles.length > 0) {
            trainAndGrowMemory(fetchedA.text, fetchedA.titles, null, true);
            resA = { topic: fetchedA.titles[0], text: fetchedA.summaryForReply };
          }
        }

        var resB = searchMultiFactsInMemory([topicB], 0, true)[0];
        if (!resB) {
          var fetchedB = await fetchTopicFromWikipedia(topicB);
          if (fetchedB.text && fetchedB.titles.length > 0) {
            trainAndGrowMemory(fetchedB.text, fetchedB.titles, null, true);
            resB = { topic: fetchedB.titles[0], text: fetchedB.summaryForReply };
          }
        }

        if (resA && resB) {
          return {
            text: userNamePrefix + '「' + topicA + '」と「' + topicB + '」の違いだね☕\n\n' +
              '■ ' + resA.topic + '\n' + resA.text + '\n\n' +
              '■ ' + resB.topic + '\n' + resB.text,
            imageUrl: null
          };
        }
      }

      if (/^(もっと詳しく|もっと教えて|続き|つづき|詳細)/.test(normalized) && memoryStore.lastDiscussedTopic) {
        memoryStore.lastTopicOffset = (memoryStore.lastTopicOffset || 0) + 3;
        var moreMatches = searchMultiFactsInMemory([memoryStore.lastDiscussedTopic], memoryStore.lastTopicOffset, true);
        if (moreMatches.length > 0 && moreMatches[0].text) {
          return { text: userNamePrefix + '「' + memoryStore.lastDiscussedTopic + '」の続きだね☕\n\n' + moreMatches[0].text, imageUrl: null };
        }
      }

      var writeMatch = trimmed.match(/^(.+?)(?:の|についての|に関する)?(?:文章|作文|紹介文|解説文|物語|ストーリー|スピーチ|まとめ)を?(?:つくって|作って|書いて|作成して|考えて|お願い)/);
      if (writeMatch && writeMatch[1]) {
        var rawWriteTopic = writeMatch[1].trim();
        var writeTopic = (/^(それ|これ|あれ|その|この|さっきの)$/.test(rawWriteTopic) && memoryStore.lastDiscussedTopic)
          ? memoryStore.lastDiscussedTopic
          : rawWriteTopic;
        var llmCreativeTail = llmModel ? llmModel.generateChatResponse(writeTopic, 20) : '';
        return {
          text: '「' + writeTopic + '」をテーマに書いてみたよ☕\n\n' + writeTopic + 'といえば、' + llmCreativeTail,
          imageUrl: null
        };

      var isExplicitQuestion = /(?:とは[？?]?$|ってなに[？?]?$|って何[？?]?$|について教えて|を教えて|を調べて|について調べて|を解説して|を説明して|を検索して|を知りたい|とは何)/.test(trimmed);

      if (isExplicitQuestion) {
        var queryClean = trimmed
          .replace(/(?:について|を|とは|って|ってなに|って何|のことも)?(?:調べて|学んで|勉強して|検索して|学習して|教えて|解説して|説明して|知ってる|知りたい|何|なに|ですか|だよね|かな)[？?！!。]*$/g, '')
          .replace(/[？?！!。、]/g, ' ')
          .trim();

        var keywords = queryClean.split(/\s+/).filter(function(w) { return w.length >= 2; });
        var targetKeyword = keywords[0] || normalized;

        if (targetKeyword && targetKeyword.length >= 2) {
          memoryStore.lastDiscussedTopic = targetKeyword;
          memoryStore.lastTopicOffset = 0;

          var ragMatches = searchMultiFactsInMemory(keywords.length > 0 ? keywords : [targetKeyword], 0, true);
          if (ragMatches.length > 0) {
            return {
              text: userNamePrefix + '「' + targetKeyword + '」について記憶から引っ張ってきたよ☕\n\n' + ragMatches[0].text,
              imageUrl: null
            };
          }

          trainStatusEl.textContent = '🔍 質問にお答えするためWikipediaで「' + targetKeyword + '」を調査中...';
          try {
            var topicData = await fetchTopicFromWikipedia(targetKeyword);
            if (topicData.text && topicData.titles.length > 0) {
              trainAndGrowMemory(topicData.text, topicData.titles, null, true);
              return {
                text: userNamePrefix + '「' + targetKeyword + '」について調べて覚えたよ☕\n\n' + topicData.summaryForReply,
                imageUrl: null
              };
            }
          } catch (e) {}
        }
      }

      var prevContext = '';
      if (memoryStore.chatHistory && memoryStore.chatHistory.length >= 2) {
        var lastAiTurn = memoryStore.chatHistory[memoryStore.chatHistory.length - 2];
        if (lastAiTurn && lastAiTurn.text) {
          prevContext = lastAiTurn.text.slice(-20) + ' ';
        }
      }

      var directGenerated = llmModel
        ? llmModel.generateChatResponse(prevContext + trimmed, 22)
        : 'うんうん、その話もっと聞かせてほしいな！';

      return {
        text: userNamePrefix + directGenerated + ' ☕',
        imageUrl: null
      };
    }

          }
          if (callback) callback();
        }
      }
      typeNext();
    }

    async function fetchGitHubKnowledgeFile() {
      var token = getSavedToken();
      if (token) {
        var apiUrl = 'https://api.github.com/repos/' + GITHUB_OWNER + '/' + GITHUB_REPO + '/contents/' + GITHUB_TARGET_PATH + '?nocache=' + Date.now();
        var resObj = await safeFetchJson(apiUrl, {
          headers: {
            'Authorization': 'Bearer ' + token,
            'Accept': 'application/vnd.github+json'
          },
          cache: 'no-store'
        });
        if (resObj.ok && resObj.data && resObj.data.content) {
          return base64ToUtf8(resObj.data.content).trim();
        }
      }

      try {
        var rawRes = await fetch(GITHUB_KNOWLEDGE_FILE + '?t=' + Date.now());
        if (rawRes.ok) {
          var text = await rawRes.text();
          if (text && text.trim().length > 5 && text.trim()[0] !== '<') return text.trim();
        }
      } catch (e2) {}
      return '';
    }

    function cleanDailyChatText(rawText) {
      if (!rawText) return '';
      return rawText
        .split('\n')
        .map(function(line) { return line.trim(); })
        .filter(function(line) {
          if (!line) return false;
          if (/^=+$/.test(line)) return false;
          if (/^【[^】]+】$/.test(line)) return false;
          return true;
        })
        .map(function(line) {
          return line.replace(/^・[^：]+：/, '').replace(/^〜/, '');
        })
        .join('\n');
    }

    async function fetchGitHubDailyChatFile() {
      var token = getSavedToken();
      if (token) {
        var encodedPath = encodeURIComponent(GITHUB_DAILY_CHAT_PATH);
        var apiUrl = 'https://api.github.com/repos/' + GITHUB_OWNER + '/' + GITHUB_REPO + '/contents/' + encodedPath + '?nocache=' + Date.now();
        var resObj = await safeFetchJson(apiUrl, {
          headers: {
            'Authorization': 'Bearer ' + token,
            'Accept': 'application/vnd.github+json'
          },
          cache: 'no-store'
        });
        if (resObj.ok && resObj.data && resObj.data.content) {
          return cleanDailyChatText(base64ToUtf8(resObj.data.content));
        }
      }

      try {
        var rawRes = await fetch(encodeURI(GITHUB_DAILY_CHAT_FILE) + '?t=' + Date.now());
        if (rawRes.ok) {
          var text = await rawRes.text();
          if (text && text.trim().length > 5 && text.trim()[0] !== '<') {
            return cleanDailyChatText(text);
          }
        }
      } catch (e2) {}
      return '';
    }

    // ==========================================
    // ★知識学習 ＋ 日常会話.txt裏側エポック回し統合ループ（入力中完全ポーズ＆軽量間隔制御版）
    // ==========================================
    function trainAndGrowMemory(newText, newTitles, announceMessage, isSilentBackground, onComplete) {
      if (isLearningNow) {
        if (onComplete) onComplete();
        return;
      }
      isLearningNow = true;

      var isAdded = false;
      if (newText && memoryStore.corpusText.indexOf(newText.slice(0, 25)) === -1) {
        var combined = (memoryStore.corpusText ? memoryStore.corpusText + '\n\n' : '') + newText;
        memoryStore.corpusText = (MAX_MEMORY_CHARS === Infinity) ? combined : combined.slice(-MAX_MEMORY_CHARS);
        isAdded = true;
      }

      newTitles.forEach(function(t) {
        if (memoryStore.topics.indexOf(t) === -1) {
          memoryStore.topics.push(t);
        }
      });

      var prevWeights = llmModel ? llmModel.exportWeights() : memoryStore.savedWeights;
      var currentChatCorpus = buildChatCorpusText();
      var nextModel = new CafeUltraTransformer(memoryStore.corpusText, prevWeights, currentChatCorpus, memoryStore.chatEpochCursor || 0);
      var step = 0;
      var chatStep = 0;
      var dynamicChatSteps = Math.max(CHAT_EPOCH_STEPS, (nextModel.chatData ? nextModel.chatData.length : 0) + 16);
      var wasPausedLastTick = false;

      function fastTrainLoop() {
        // 入力欄フォーカス中・タイピング中・日本語変換中は行列計算を行わず完全に一時停止
        if (shouldPauseBackgroundLearning()) {
          if (!wasPausedLastTick) {
            wasPausedLastTick = true;
            trainStatusEl.textContent = '⏸️ 入力中のためエポック学習を一時停止中（サクサク入力優先モード）';
          }
          setTimeout(fastTrainLoop, 250);
          return;
        }
        wasPausedLastTick = false;

        if (step >= TOTAL_STEPS && chatStep >= dynamicChatSteps) {
          llmModel = nextModel;
          isLearningNow = false;
          allowPostSendLearning = false;
          progressBarEl.style.width = '100%';
          updateStatusDisplay();
          promptInput.disabled = false;
          generateBtn.disabled = false;

          if (knowledgePanel.style.display === 'block') {
            renderKnowledgePanel();
          }

          saveToPermanentMemory();

          if (isAdded && newText) {
            enqueueGitHubWrite(newText);
          }

          if (announceMessage) {
            memoryStore.chatHistory.push({ sender: 'ai', text: announceMessage });
            saveToPermanentMemory();
            addMessageWithTyping(announceMessage, 'ai', onComplete);
          } else if (onComplete) {
            onComplete();
          }
          return;
        }

        // 1. 知識コーパスの学習（1フレームあたりの負荷を最小限に抑制）
        for (var i = 0; i < BATCH_PER_FRAME && step < TOTAL_STEPS; i++) {
          nextModel.trainStep();
          step++;
        }

        // 2. 日常会話.txt＋日常会話コーパス＆チャット履歴の反復学習（エポック回し）
        var chatBatch = Math.max(6, Math.ceil(BATCH_PER_FRAME * 0.6));
        for (var c = 0; c < chatBatch && chatStep < dynamicChatSteps; c++) {
          var epochRes = nextModel.trainChatEpochStep();
          if (epochRes.epochCompleted) {
            memoryStore.chatEpochCount = (memoryStore.chatEpochCount || 0) + 1;
          }
          chatStep++;
        }

        var totalDone = step + chatStep;
        var totalAll = TOTAL_STEPS + dynamicChatSteps;
        var percent = Math.round((totalDone / totalAll) * 100);
        progressBarEl.style.width = percent + '%';
        trainStatusEl.textContent = isSilentBackground
          ? '🔄 待機時間に日常会話.txtエポック学習(' + (memoryStore.chatEpochCount || 0) + '周目)中... ' + percent + '%'
          : '⚡ ' + TRANSFORMER_LAYERS + '層Transformer＆日常会話.txtエポック学習中... ' + percent + '%';

        setTimeout(fastTrainLoop, TRAIN_FRAME_INTERVAL_MS);
      }

      fastTrainLoop();
    }

    async function autoGrowInBackground() {
      if (githubWriteQueue.length > 0 && !isGitHubWriting) {
        processGitHubWriteQueue();
      }
      if (isLearningNow || shouldPauseBackgroundLearning()) return;
      try {
        trainStatusEl.textContent = '🌐 放置時間を利用して日常会話.txtエポック＆語彙を自動学習中...';
        var latestDailyChat = await fetchGitHubDailyChatFile();
        if (latestDailyChat) {
          memoryStore.dailyChatCorpusText = latestDailyChat;
        }
        var fetched = await fetchRandomWebArticles();
        trainAndGrowMemory(fetched.text, fetched.titles, null, true);
      } catch (e) {}
    }

    async function bootAI() {
      try {
        githubConfigPanel.style.display = 'none';

        var loaded = await loadFromUnlimitedStorage();
        if (loaded) {
          memoryStore = Object.assign({
            topics: [],
            corpusText: '',

            lastDiscussedTopic: '',
            lastTopicOffset: 0,
            evolutionCount: 0,
            chatEpochCount: 0,
            chatEpochCursor: 0,
            userProfile: { name: '', likes: [], facts: [] },
            savedWeights: null
          }, loaded);
        }

        trainStatusEl.textContent = '📂 GitHub（280054-netizen/tomoAI）の knowledge.txt と 日常会話.txt を読み込み中...';
        var results = await Promise.all([
          fetchGitHubKnowledgeFile(),
          fetchGitHubDailyChatFile()
        ]);
        var githubText = results[0];
        var dailyChatText = results[1];

        if (dailyChatText) {
          memoryStore.dailyChatCorpusText = dailyChatText;
          if (memoryStore.topics.indexOf('日常会話.txt(成分・品詞コーパス)') === -1) {
            memoryStore.topics.unshift('日常会話.txt(成分・品詞コーパス)');
          }
        }

        if (githubText && memoryStore.corpusText.indexOf(githubText.slice(0, 25)) === -1) {
          var merged = githubText + (memoryStore.corpusText ? '\n\n' + memoryStore.corpusText : '');
          memoryStore.corpusText = (MAX_MEMORY_CHARS === Infinity) ? merged : merged.slice(-MAX_MEMORY_CHARS);
          if (memoryStore.topics.indexOf('GitHub知識ベース(knowledge.txt)') === -1) {
            memoryStore.topics.unshift('GitHub知識ベース(knowledge.txt)');
          }
        }

        if (memoryStore.chatHistory && memoryStore.chatHistory.length > 0) {
          memoryStore.chatHistory.forEach(function(item) {
            addMessageImmediate(item.text, item.sender, item.imageUrl);
          });
        }

        trainStatusEl.textContent = '🌐 8層Transformer＆言葉吟味層・日常会話.txtエポック学習中...';
        var fetched = await fetchRandomWebArticles();

        var isFirstEver = (!memoryStore.corpusText || memoryStore.corpusText.length <= 15);
        var greeting = isFirstEver
          ? 'やっほー！カフェ・LLMだよ☕ 8層Transformer（48次元）と言葉吟味層を搭載し、文字入力中は学習を自動一時停止してサクサク動くように進化したよ！何でも話しかけてね！'
          : null;

        trainAndGrowMemory(fetched.text, fetched.titles, greeting, false);

        setInterval(autoGrowInBackground, AUTO_LEARN_INTERVAL_MS);

      } catch (err) {
        statusContainer.style.backgroundColor = '#fdecea';
        trainStatusEl.textContent = '❌ 起動エラー: ' + err.message;
      }
    }

    async function handleGenerateClick() {
      if (!llmModel) return;
      var prompt = promptInput.value.trim();
      if (!prompt) {
        prompt = 'こんにちは！';
      }

      isTypingActive = false;
      isComposingIME = false;
      if (typingIdleTimer) clearTimeout(typingIdleTimer);

      addMessageImmediate(prompt, 'user');
      memoryStore.chatHistory.push({ sender: 'user', text: prompt });
      promptInput.value = '';
      promptInput.disabled = true;
      generateBtn.disabled = true;

      var replyObj = await generateFullLLMReply(prompt);
      memoryStore.chatHistory.push({ sender: 'ai', text: replyObj.text });

      allowPostSendLearning = true;
      selfEvolveFromChat(prompt, replyObj.text);
      saveToPermanentMemory();

      addMessageWithTyping(replyObj, 'ai', function() {
        promptInput.disabled = false;
        generateBtn.disabled = false;
        promptInput.focus();
      });
    }

    // ==========================================
    // ★入力欄イベント監視（フォーカス・タイピング・日本語変換中は学習を完全停止）
    // ==========================================
    promptInput.addEventListener('focus', function() {
      isInputFocused = true;
    });

    promptInput.addEventListener('blur', function() {
      isInputFocused = false;
      isTypingActive = false;
      isComposingIME = false;
    });

    promptInput.addEventListener('compositionstart', function() {
      isComposingIME = true;
      markUserTypingActivity();
    });

    promptInput.addEventListener('compositionend', function() {
      isComposingIME = false;
      markUserTypingActivity();
    });

    promptInput.addEventListener('input', function() {
      markUserTypingActivity();
    });

    promptInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleGenerateClick();
        return;
      }
      markUserTypingActivity();
    });

    window.addEventListener('DOMContentLoaded', bootAI);
  </script>
</body>
</html>
