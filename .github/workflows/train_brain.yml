name: ☕ カフェ・LLM クラウド自動特訓（8層Transformer学習）

on:
  # 1. 日常会話.txt や knowledge.txt が更新されたときに自動特訓
  push:
    paths:
      - '日常会話.txt'
      - 'knowledge.txt'
      - '.github/workflows/train_brain.yml'

  # 2. 毎日日本時間 朝3:00 (UTC 18:00) に自動で反復特訓
  schedule:
    - cron: '0 18 * * *'

  # 3. GitHubの「Actions」タブからいつでも手動で特訓ボタンを押せる
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train-cafe-llm:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリの最新ファイルを取得
        uses: actions/checkout@v4

      - name: Node.js 環境をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 8層・48次元Transformerをクラウド上で25周エポック特訓
        run: |
          cat << 'EOF' > train_cloud.js
          const fs = require('fs');

          const TRANSFORMER_LAYERS = 8;
          const EMBED_DIM = 48;
          const CONTEXT_SIZE = 8;
          const MAX_VOCAB_SIZE = 5000;
          const LEARNING_RATE = 0.035;
          const TARGET_EPOCHS = 25;

          function cleanDailyChatText(rawText) {
            if (!rawText) return '';
            return rawText
              .replace(/=+/g, '')
              .replace(/【[^】]*】/g, '')
              .replace(/・[^：\n]+：/g, '')
              .replace(/〜/g, '')
              .replace(/\n{2,}/g, '\n')
              .trim();
          }

          function tokenizeJapanese(text) {
            if (!text) return [];
            const clean = text
              .replace(/【[^】]*】/g, '')
              .replace(/・[^：\n]+：/g, '')
              .replace(/```[\s\S]*?```/g, '');
            const pattern = /[一-龠々〆ヵヶ]{1,6}|[ァ-ヴー]{2,8}|[a-zA-Z]{2,10}|[ぁ-ん]{1,5}|[。、！？]/g;
            const matches = clean.match(pattern);
            return matches ? matches : Array.from(clean);
          }

          function createMatrix(rows, cols) {
            const scale = Math.sqrt(2.0 / (rows + cols));
            const mat = [];
            for (let r = 0; r < rows; r++) {
              const row = [];
              for (let c = 0; c < cols; c++) {
                row.push((Math.random() * 2 - 1) * scale);
              }
              mat.push(row);
            }
            return mat;
          }

          function softmax(arr) {
            const maxVal = Math.max(...arr);
            const exps = arr.map(v => Math.exp(v - maxVal));
            const sum = exps.reduce((a, b) => a + b, 0);
            return exps.map(e => e / sum);
          }

          function layerNorm(vec) {
            const mean = vec.reduce((a, b) => a + b, 0) / vec.length;
            const variance = vec.reduce((a, b) => a + (b - mean) * (b - mean), 0) / vec.length;
            const std = Math.sqrt(variance + 1e-5);
            return vec.map(v => (v - mean) / std);
          }

          function matMul(A, B) {
            const rowsA = A.length;
            const colsA = A[0].length;
            const colsB = B[0].length;
            const result = [];
            for (let i = 0; i < rowsA; i++) {
              result.push(new Array(colsB).fill(0));
              for (let k = 0; k < colsA; k++) {
                for (let j = 0; j < colsB; j++) {
                  result[i][j] += A[i][k] * B[k][j];
                }
              }
            }
            return result;
          }

          const rawDaily = fs.existsSync('日常会話.txt') ? fs.readFileSync('日常会話.txt', 'utf8') : '';
          const rawKnowledge = fs.existsSync('knowledge.txt') ? fs.readFileSync('knowledge.txt', 'utf8') : '';
          const chatText = cleanDailyChatText(rawDaily) || 'こんにちは！今日もいい天気だね。ゆっくりおしゃべりしようね！';
          const knowledgeText = rawKnowledge.slice(-60000);

          const chatTokens = tokenizeJapanese(chatText);
          const allTokens = tokenizeJapanese(chatText + '\n' + knowledgeText);

          const freqMap = {};
          for (const tk of allTokens) {
            freqMap[tk] = (freqMap[tk] || 0) + 1;
          }
          for (const ctk of chatTokens) {
            freqMap[ctk] = (freqMap[ctk] || 0) + 50;
          }

          const sortedTokens = Object.keys(freqMap)
            .sort((a, b) => freqMap[b] - freqMap[a])
            .slice(0, MAX_VOCAB_SIZE - 1);

          const vocab = ['<UNK>', ...sortedTokens];
          const vocabSize = vocab.length;
          const tokenToId = {};
          vocab.forEach((tok, idx) => { tokenToId[tok] = idx; });

          const chatIds = chatTokens.map(t => tokenToId[t] !== undefined ? tokenToId[t] : 0);
          const allIds = allTokens.map(t => tokenToId[t] !== undefined ? tokenToId[t] : 0);

          let tokenEmbed = createMatrix(vocabSize, EMBED_DIM);
          let posEmbed = createMatrix(CONTEXT_SIZE, EMBED_DIM);
          let layers = [];
          for (let l = 0; l < TRANSFORMER_LAYERS; l++) {
            layers.push({
              Wq: createMatrix(EMBED_DIM, EMBED_DIM),
              Wk: createMatrix(EMBED_DIM, EMBED_DIM),
              Wv: createMatrix(EMBED_DIM, EMBED_DIM),
              Wff1: createMatrix(EMBED_DIM, EMBED_DIM),
              Wff2: createMatrix(EMBED_DIM, EMBED_DIM)
            });
          }
          let Wout = createMatrix(EMBED_DIM, vocabSize);
          let totalEpochs = 0;

          if (fs.existsSync('brain_weights.json')) {
            try {
              const prev = JSON.parse(fs.readFileSync('brain_weights.json', 'utf8'));
              if (prev && Array.isArray(prev.vocab)) {
                totalEpochs = prev.epochs || 0;
                if (prev.posEmbed && prev.posEmbed.length === CONTEXT_SIZE && prev.posEmbed[0].length === EMBED_DIM) {
                  posEmbed = prev.posEmbed;
                }
                if (prev.layers && prev.layers.length === TRANSFORMER_LAYERS && prev.layers[0].Wq.length === EMBED_DIM) {
                  layers = prev.layers;
                }
                const oldMap = {};
                prev.vocab.forEach((tok, idx) => { oldMap[tok] = idx; });
                vocab.forEach((tok, newId) => {
                  const oldId = oldMap[tok];
                  if (oldId !== undefined && prev.tokenEmbed[oldId] && prev.tokenEmbed[oldId].length === EMBED_DIM) {
                    tokenEmbed[newId] = prev.tokenEmbed[oldId].slice();
                    for (let d = 0; d < EMBED_DIM; d++) {
                      if (prev.Wout[d] && prev.Wout[d][oldId] !== undefined) {
                        Wout[d][newId] = prev.Wout[d][oldId];
                      }
                    }
                  }
                });
              }
            } catch (e) {
              console.log('初回新規モデルとして学習を開始します');
            }
          }

          function runTransformerBlock(X, layerObj) {
            const seqLen = X.length;
            const Q = matMul(X, layerObj.Wq);
            const K = matMul(X, layerObj.Wk);
            const V = matMul(X, layerObj.Wv);
            const scale = Math.sqrt(EMBED_DIM);
            const attnOut = [];

            for (let i = 0; i < seqLen; i++) {
              const scores = [];
              for (let j = 0; j <= i; j++) {
                let dot = 0;
                for (let d = 0; d < EMBED_DIM; d++) dot += Q[i][d] * K[j][d];
                scores.push(dot / scale);
              }
              const weights = softmax(scores);
              const vec = new Array(EMBED_DIM).fill(0);
              for (let j2 = 0; j2 <= i; j2++) {
                const w = weights[j2];
                for (let d2 = 0; d2 < EMBED_DIM; d2++) vec[d2] += w * V[j2][d2];
              }
              const residual1 = vec.map((v, d) => v + X[i][d]);
              attnOut.push(layerNorm(residual1));
            }

            const H = matMul(attnOut, layerObj.Wff1).map(row => row.map(v => v > 0 ? v : v * 0.05));
            const ffOut = matMul(H, layerObj.Wff2);
            return ffOut.map((row, i) => layerNorm(row.map((v, d) => v + attnOut[i][d])));
          }

          function trainStepOnSeq(inputIds, targetId, lr) {
            const seqLen = inputIds.length;
            const hiddenStates = [];
            let X = inputIds.map((id, pos) => tokenEmbed[id].map((val, d) => val + posEmbed[pos][d]));
            hiddenStates.push(X);

            for (let l = 0; l < TRANSFORMER_LAYERS; l++) {
              X = runTransformerBlock(X, layers[l]);
              hiddenStates.push(X);
            }

            const lastHidden = X[seqLen - 1];
            const logits = new Array(vocabSize).fill(0);
            for (let v = 0; v < vocabSize; v++) {
              for (let d3 = 0; d3 < EMBED_DIM; d3++) logits[v] += lastHidden[d3] * Wout[d3][v];
            }

            const probs = softmax(logits);
            const dLogits = probs.slice();
            dLogits[targetId] -= 1.0;

            const dHidden = new Array(EMBED_DIM).fill(0);
            for (let d = 0; d < EMBED_DIM; d++) {
              for (let v = 0; v < vocabSize; v++) {
                dHidden[d] += dLogits[v] * Wout[d][v];
                Wout[d][v] -= lr * lastHidden[d] * dLogits[v];
              }
            }

            const lastPos = seqLen - 1;
            const lastTokenId = inputIds[lastPos];
            for (let l = TRANSFORMER_LAYERS - 1; l >= 0; l--) {
              const layerInput = hiddenStates[l][lastPos];
              const layerScale = 0.25 / (TRANSFORMER_LAYERS - l);
              const layerObj = layers[l];
              for (let d2 = 0; d2 < EMBED_DIM; d2++) {
                const grad = dHidden[d2];
                for (let d3 = 0; d3 < EMBED_DIM; d3++) {
                  layerObj.Wff2[d3][d2] -= lr * layerScale * layerInput[d3] * grad;
                  layerObj.Wff1[d3][d2] -= lr * layerScale * 0.8 * layerInput[d3] * grad;
                  layerObj.Wv[d3][d2] -= lr * layerScale * layerInput[d3] * grad;
                  layerObj.Wq[d3][d2] -= lr * layerScale * 0.5 * layerInput[d3] * grad;
                  layerObj.Wk[d3][d2] -= lr * layerScale * 0.5 * layerInput[d3] * grad;
                }
              }
            }

            for (let d4 = 0; d4 < EMBED_DIM; d4++) {
              tokenEmbed[lastTokenId][d4] -= lr * dHidden[d4];
              posEmbed[lastPos][d4] -= lr * dHidden[d4];
            }
          }

          console.log('クラウド特訓開始: 語彙数=' + vocabSize + ' / 日常会話トークン=' + chatIds.length);
          if (chatIds.length > CONTEXT_SIZE + 1) {
            for (let ep = 0; ep < TARGET_EPOCHS; ep++) {
              for (let idx = 0; idx < chatIds.length - CONTEXT_SIZE - 1; idx++) {
                trainStepOnSeq(chatIds.slice(idx, idx + CONTEXT_SIZE), chatIds[idx + CONTEXT_SIZE], LEARNING_RATE);
              }
              totalEpochs++;
            }
          }

          if (allIds.length > CONTEXT_SIZE + 1) {
            for (let s = 0; s < 1200; s++) {
              const rIdx = Math.floor(Math.random() * (allIds.length - CONTEXT_SIZE));
              trainStepOnSeq(allIds.slice(rIdx, rIdx + CONTEXT_SIZE), allIds[rIdx + CONTEXT_SIZE], LEARNING_RATE * 0.7);
            }
          }

          const outputBrain = {
            version: 1,
            trainedAt: new Date().toISOString(),
            epochs: totalEpochs,
            numLayers: TRANSFORMER_LAYERS,
            embedDim: EMBED_DIM,
            contextSize: CONTEXT_SIZE,
            vocab: vocab,
            tokenEmbed: tokenEmbed,
            posEmbed: posEmbed,
            layers: layers,
            Wout: Wout
          };

          fs.writeFileSync('brain_weights.json', JSON.stringify(outputBrain));
          console.log('クラウド特訓完了！累計エポック: ' + totalEpochs + '周');
          EOF
          node train_cloud.js
          rm -f train_cloud.js

      - name: 特訓済みの脳みそデータ(brain_weights.json)をGitHubに保存
        run: |
          git config user.name "Cafe-LLM Cloud Trainer"
          git config user.email "actions@github.com"
          git add brain_weights.json
          if ! git diff --staged --quiet; then
            git commit -m "☁️ クラウド特訓完了: 8層Transformer脳みそを更新"
            git push
          fi
